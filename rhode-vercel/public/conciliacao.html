<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhode · Conciliação — DRE da Loja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1d1d1f; --ink-64:#5a5a5e; --ink-48:#85858a; --ink-24:#bcbcc0;
    --pearl:#fafafc; --parchment:#f5f5f7; --hairline:#e6e6ea; --card:#ffffff;
    --rhode-red:#FE2C55; --green:#1a8f5a; --orange:#c05e00; --blue:#2563eb;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:var(--pearl);color:var(--ink);
    -webkit-font-smoothing:antialiased;line-height:1.4}
  .mono{font-family:'JetBrains Mono',monospace}
  .num{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}

  /* ---- login ---- */
  #login{position:fixed;inset:0;display:grid;place-items:center;background:var(--pearl);z-index:50}
  .login-card{background:var(--card);border:1px solid var(--hairline);border-radius:18px;
    padding:40px;width:340px;box-shadow:0 12px 40px rgba(0,0,0,.06)}
  .login-card h1{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
  .login-card p{font-size:13px;color:var(--ink-48);margin-bottom:24px}
  .login-card input{width:100%;padding:13px 15px;border:1px solid var(--hairline);border-radius:11px;
    font-family:'JetBrains Mono',monospace;font-size:14px;margin-bottom:14px;outline:none}
  .login-card input:focus{border-color:var(--ink)}
  .login-card button{width:100%;padding:13px;background:var(--ink);color:#fff;border:none;border-radius:11px;
    font-weight:600;font-size:14px;cursor:pointer;transition:opacity .15s}
  .login-card button:hover{opacity:.88}
  .login-err{color:var(--rhode-red);font-size:12px;margin-top:12px;min-height:16px;text-align:center}

  /* ---- app ---- */
  #app{display:none;max-width:1140px;margin:0 auto;padding:36px 28px 80px}
  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    padding-bottom:22px;border-bottom:1px solid var(--hairline);margin-bottom:28px;flex-wrap:wrap}
  .title h1{font-family:'JetBrains Mono',monospace;font-size:25px;font-weight:800;letter-spacing:-.03em}
  .title .sub{font-size:13px;color:var(--ink-48);margin-top:4px}
  .top-right{display:flex;align-items:center;gap:12px}
  select{font-family:'JetBrains Mono',monospace;font-size:13px;padding:9px 13px;border:1px solid var(--hairline);
    border-radius:10px;background:var(--card);cursor:pointer;outline:none}
  .lnk{font-size:12px;color:var(--ink-48);text-decoration:none;border:1px solid var(--hairline);
    padding:8px 12px;border-radius:9px;background:var(--card)}
  .lnk:hover{color:var(--ink);border-color:var(--ink-24)}
  /* switcher de módulos do console (Creators ⇄ Conciliação) — idêntico ao admin */
  .modnav{display:flex;gap:3px;background:var(--parchment);border:1px solid var(--hairline);border-radius:99px;padding:3px}
  .modnav a{font-family:'Inter',sans-serif;font-size:13px;font-weight:500;text-decoration:none;color:var(--ink-48);padding:6px 15px;border-radius:99px;transition:all .15s ease;white-space:nowrap}
  .modnav a:hover{color:var(--ink)}
  .modnav a.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}

  /* KPIs */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
  .kpi{background:var(--card);border:1px solid var(--hairline);border-radius:15px;padding:18px 20px}
  .kpi .lbl{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-48)}
  .kpi .val{font-family:'JetBrains Mono',monospace;font-size:25px;font-weight:700;letter-spacing:-.02em;margin-top:8px}
  .kpi .val.accent{color:var(--green)}
  .kpi .foot{font-size:11.5px;color:var(--ink-48);margin-top:5px}

  .sec{background:var(--card);border:1px solid var(--hairline);border-radius:16px;padding:24px 26px;margin-bottom:22px}
  .sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
  .sec-h h2{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;letter-spacing:-.01em}
  .sec-h .meta{font-size:12px;color:var(--ink-48)}

  /* cascata DRE */
  .casc-row{display:grid;grid-template-columns:200px 1fr 130px;align-items:center;gap:14px;padding:9px 0}
  .casc-row + .casc-row{border-top:1px solid #f1f1f4}
  .casc-lbl{font-size:13.5px;font-weight:500}
  .casc-lbl small{display:block;font-size:10.5px;color:var(--ink-48);font-weight:400;margin-top:1px}
  .casc-bar{height:9px;border-radius:5px;background:#eef0f3;overflow:hidden}
  .casc-bar i{display:block;height:100%;border-radius:5px}
  .casc-val{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  .casc-row.total{border-top:2px solid var(--ink);margin-top:4px;padding-top:13px}
  .casc-row.total .casc-lbl{font-weight:700}
  .casc-row.total .casc-val{font-size:17px;color:var(--green)}
  .neg{color:var(--rhode-red)}

  /* trend table */
  table{width:100%;border-collapse:collapse}
  th,td{text-align:right;padding:10px 12px;font-size:13px;font-variant-numeric:tabular-nums}
  th{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-48);border-bottom:1px solid var(--hairline);font-weight:600}
  td{font-family:'JetBrains Mono',monospace;border-bottom:1px solid #f1f1f4}
  th:first-child,td:first-child{text-align:left}
  tbody tr:hover{background:#fafafb}
  td.mp{font-family:'Inter',sans-serif;font-weight:600}

  .note{background:#fff8ee;border:1px solid #f0e2c8;border-radius:12px;padding:14px 16px;
    font-size:12.5px;color:#7a5b1e;line-height:1.5;display:flex;gap:11px}
  .note b{color:#5a4310}
  .soon{opacity:.62;border-style:dashed}
  .pill{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.05em;
    background:var(--parchment);color:var(--ink-48);padding:3px 9px;border-radius:99px;border:1px solid var(--hairline)}
  .loading{text-align:center;color:var(--ink-48);font-size:13px;padding:50px}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <h1>rhode<span style="color:var(--rhode-red)">.</span> conciliação</h1>
    <p>DRE da loja · acesso admin</p>
    <input id="adm-pass" type="password" placeholder="senha admin" onkeydown="if(event.key==='Enter')admLogin()">
    <button onclick="admLogin()">Entrar</button>
    <div class="login-err" id="adm-err"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <div class="title">
      <h1>Conciliação · DRE da Loja</h1>
      <div class="sub">Caminho do dinheiro — TikTok Shop · admin/CFO</div>
    </div>
    <div class="top-right">
      <nav class="modnav">
        <a href="admin.html">Creators</a>
        <a href="conciliacao.html" class="on">Conciliação</a>
      </nav>
      <select id="period-sel" onchange="render()"></select>
      <a class="lnk" href="#" onclick="logout();return false">Sair</a>
    </div>
  </header>

  <div id="body"><div class="loading">Carregando dados…</div></div>
</div>

<script>
const ADM_TOKEN_KEY='rhode-admin-token';
function admToken(){ try{return sessionStorage.getItem(ADM_TOKEN_KEY)||'';}catch(e){return'';} }
async function admLogin(){
  const pass=document.getElementById('adm-pass').value;
  const err=document.getElementById('adm-err');
  try{
    const r=await fetch('/api/get-hub',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'admin_login',pass})});
    const d=await r.json().catch(()=>({}));
    if(r.ok && d.token){ sessionStorage.setItem(ADM_TOKEN_KEY,d.token); enter(); }
    else err.textContent=d.error||'Senha incorreta.';
  }catch(e){ err.textContent='Erro de conexão.'; }
}
function logout(){ try{sessionStorage.removeItem(ADM_TOKEN_KEY);}catch(_){}; location.reload(); }
async function admProxy(method, path, opts={}){
  const r=await fetch('/api/get-hub',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'admin_query', adminToken:admToken(), method, path, paged:opts.paged})});
  if(r.status===401){ logout(); throw new Error('sessão expirada'); }
  if(!r.ok){ let e={};try{e=await r.json();}catch(_){}; throw new Error(e.error||('HTTP '+r.status)); }
  return r.json();
}

// ---- formatação ----
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const BRL2=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2});
const NUM=new Intl.NumberFormat('pt-BR');
const fmt=v=>BRL.format(v||0), fmt2=v=>BRL2.format(v||0);
const pct=(a,b)=>b?(a/b*100):0;
const MES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const fmtMes=id=>{const[y,m]=String(id||'').split('-');return m?`${MES[+m-1]}/${String(y).slice(2)}`:id;};

// ---- estado ----
let FIN={}, GMV={}, PROD={}, CPVMAP={}, ADS={}, MESES=[];
// alíquotas de imposto (Lucro Real · editáveis · a confirmar c/ contador)
let TX_VENDA=parseFloat(localStorage.getItem('rhode_tx_venda'))||9.25; // PIS/COFINS+ICMS efetivo s/ venda
let TX_IR=parseFloat(localStorage.getItem('rhode_tx_ir'))||34;          // IRPJ+CSLL s/ lucro
function setTx(w,v){const n=parseFloat(v)||0; if(w==='venda'){TX_VENDA=n;try{localStorage.setItem('rhode_tx_venda',n)}catch(e){}}else{TX_IR=n;try{localStorage.setItem('rhode_tx_ir',n)}catch(e){}} render();}

async function load(){
  // finance (caminho do dinheiro) + pedidos_sku (GMV) + custos_sku (CPV) + ads_gmvmax (ads)
  const [fin, ped, cpv, ads] = await Promise.all([
    admProxy('GET','finance_statements?select=data,revenue_amount,fee_amount,shipping_cost,adjustment,settlement&order=data.asc',{paged:true}),
    admProxy('GET','pedidos_sku?select=periodo,gmv,qty,produto,seller_sku',{paged:true}),
    admProxy('GET','custos_sku?select=ref,cpv',{paged:true}),
    admProxy('GET','ads_gmvmax?select=periodo,campanha,custo,receita_bruta,pedidos',{paged:true})
  ]);
  CPVMAP={};
  (cpv.data||[]).forEach(r=>{ if(r.ref) CPVMAP[String(r.ref).toUpperCase()]=+r.cpv||0; });
  // ads GMV Max por mês + por campanha
  ADS={};
  (ads.data||[]).forEach(r=>{
    const m=r.periodo; if(!m)return;
    const a=ADS[m]||(ADS[m]={custo:0,receita:0,pedidos:0,camp:{}});
    a.custo+=+r.custo||0; a.receita+=+r.receita_bruta||0; a.pedidos+=+r.pedidos||0;
    const n=(r.campanha||'—'); const c=a.camp[n]||(a.camp[n]={custo:0,receita:0,pedidos:0});
    c.custo+=+r.custo||0; c.receita+=+r.receita_bruta||0; c.pedidos+=+r.pedidos||0;
  });
  // agrega finance por mês
  FIN={};
  (fin.data||[]).forEach(r=>{
    const m=(r.data||'').slice(0,7); if(!m)return;
    const a=FIN[m]||(FIN[m]={rev:0,fee:0,ship:0,adj:0,set:0,n:0});
    a.rev+=+r.revenue_amount||0; a.fee+=+r.fee_amount||0; a.ship+=+r.shipping_cost||0;
    a.adj+=+r.adjustment||0; a.set+=+r.settlement||0; a.n++;
  });
  // agrega GMV por mês + ranking/margem por produto/mês (custo = CPV×qty quando há REF cadastrado)
  GMV={}; PROD={};
  (ped.data||[]).forEach(r=>{
    const m=r.periodo; if(!m)return;
    const g=+r.gmv||0, q=+r.qty||0;
    const cpvUn=CPVMAP[(r.seller_sku||'').toUpperCase()];
    const a=GMV[m]||(GMV[m]={gmv:0,qty:0,itens:0});
    a.gmv+=g; a.qty+=q; a.itens++;
    const nome=(r.produto||'—').trim();
    const pm=PROD[m]||(PROD[m]={});
    const p=pm[nome]||(pm[nome]={gmv:0,qty:0,custo:0,gmvCpv:0});
    p.gmv+=g; p.qty+=q;
    if(cpvUn!=null){ p.custo+=cpvUn*q; p.gmvCpv+=g; }
  });
  MESES=[...new Set([...Object.keys(FIN),...Object.keys(GMV),...Object.keys(ADS)])].sort();
  // popula seletor
  const sel=document.getElementById('period-sel');
  sel.innerHTML=`<option value="ALL">Todos os meses</option>`+MESES.slice().reverse().map(m=>`<option value="${m}">${fmtMes(m)}</option>`).join('');
  render();
}

function render(){
  const sel=document.getElementById('period-sel').value;
  const meses = sel==='ALL' ? MESES : [sel];
  // soma o período selecionado
  const A={rev:0,fee:0,ship:0,adj:0,set:0,n:0}; let gmv=0, qty=0;
  meses.forEach(m=>{const f=FIN[m]; if(f){A.rev+=f.rev;A.fee+=f.fee;A.ship+=f.ship;A.adj+=f.adj;A.set+=f.set;A.n+=f.n;} const g=GMV[m]; if(g){gmv+=g.gmv;qty+=g.qty;}});
  const taxaPct=pct(Math.abs(A.fee),A.rev), efic=pct(A.set,A.rev);

  // KPIs
  const kpis=`<div class="kpis">
    <div class="kpi"><div class="lbl">Vendas (GMV)</div><div class="val">${fmt(gmv)}</div><div class="foot">${NUM.format(qty)} peças · data da venda</div></div>
    <div class="kpi"><div class="lbl">Receita (settled)</div><div class="val">${fmt(A.rev)}</div><div class="foot">${A.n} statements</div></div>
    <div class="kpi"><div class="lbl">Settlement</div><div class="val accent">${fmt(A.set)}</div><div class="foot">o que cai na conta</div></div>
    <div class="kpi"><div class="lbl">Taxa TikTok</div><div class="val">${taxaPct.toFixed(1)}%</div><div class="foot">eficiência ${efic.toFixed(1)}%</div></div>
  </div>`;

  // cascata (caminho do dinheiro)
  const maxv=Math.max(A.rev,1);
  const bar=(v,color)=>`<div class="casc-bar"><i style="width:${Math.min(100,Math.abs(v)/maxv*100)}%;background:${color}"></i></div>`;
  const row=(lbl,sub,val,color,cls='')=>`<div class="casc-row ${cls}"><div class="casc-lbl">${lbl}${sub?`<small>${sub}</small>`:''}</div>${bar(val,color)}<div class="casc-val ${val<0?'neg':''}">${fmt2(val)}</div></div>`;
  const cascata=`<div class="sec">
    <div class="sec-h"><h2>Caminho do dinheiro</h2><div class="meta">${sel==='ALL'?'todos os meses':fmtMes(sel)} · base settlement</div></div>
    ${row('Receita bruta','o que o TikTok reporta como receita',A.rev,'#cbd5e1')}
    ${row('− Taxa TikTok',`comissão + serviço · ${taxaPct.toFixed(1)}%`,A.fee,'var(--rhode-red)')}
    ${row('− Frete','custo de envio',A.ship,'var(--orange)')}
    ${row('+ Ajustes','reembolsos/correções',A.adj,'var(--blue)')}
    ${row('= Settlement','o que a loja recebe de fato',A.set,'var(--green)','total')}
  </div>`;

  // tendência mês a mês
  const rows=MESES.map(m=>{const f=FIN[m]||{rev:0,fee:0,ship:0,set:0,n:0};const g=GMV[m]||{gmv:0};
    return `<tr><td class="mp">${fmtMes(m)}</td><td>${g.gmv?fmt(g.gmv):'—'}</td><td>${fmt(f.rev)}</td>
      <td class="neg">${fmt(f.fee)}</td><td class="neg">${fmt(f.ship)}</td><td>${fmt(f.set)}</td>
      <td>${pct(Math.abs(f.fee),f.rev).toFixed(1)}%</td><td>${pct(f.set,f.rev).toFixed(1)}%</td></tr>`;}).join('');
  const trend=`<div class="sec"><div class="sec-h"><h2>Tendência mensal</h2><div class="meta">clique no seletor pra focar um mês</div></div>
    <table><thead><tr><th>Mês</th><th>GMV vendas</th><th>Receita</th><th>Taxa TT</th><th>Frete</th><th>Settlement</th><th>%taxa</th><th>Efic.</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;

  // ranking de produtos campeões (top por GMV no período) — não precisa de CPV
  const prodAgg={};
  meses.forEach(m=>{const pm=PROD[m]||{}; Object.entries(pm).forEach(([nome,v])=>{const a=prodAgg[nome]||(prodAgg[nome]={gmv:0,qty:0}); a.gmv+=v.gmv; a.qty+=v.qty;});});
  const totProd=Object.values(prodAgg).reduce((s,v)=>s+v.gmv,0)||1;
  const topProd=Object.entries(prodAgg).sort((a,b)=>b[1].gmv-a[1].gmv).slice(0,12);
  const maxP=topProd.length?topProd[0][1].gmv:1;
  const prodRows=topProd.map(([nome,v],i)=>`<tr>
    <td class="mp" style="max-width:330px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${nome.replace(/"/g,'')}">${i+1}. ${nome}</td>
    <td>${fmt(v.gmv)}</td><td>${NUM.format(v.qty)}</td><td>${fmt2(v.qty?v.gmv/v.qty:0)}</td>
    <td>${(v.gmv/totProd*100).toFixed(1)}%</td>
    <td style="width:120px"><div class="casc-bar"><i style="width:${(v.gmv/maxP*100).toFixed(0)}%;background:var(--green)"></i></div></td></tr>`).join('');
  const prods=`<div class="sec"><div class="sec-h"><h2>Produtos campeões</h2><div class="meta">${sel==='ALL'?'todos os meses':fmtMes(sel)} · por GMV de venda</div></div>
    <table><thead><tr><th>Produto</th><th>GMV</th><th>Qtd</th><th>Ticket</th><th>% total</th><th></th></tr></thead><tbody>${prodRows}</tbody></table></div>`;

  // nota dos dois relógios
  const nota=`<div class="note"><span style="font-size:16px">🕐</span><div><b>Dois relógios.</b> "GMV vendas" conta pela <b>data da venda</b> (pedidos_sku); "Receita/Settlement" pela <b>data que o dinheiro liquidou</b> (finance_statements, que atrasa ~semanas). Por isso o mês corrente mostra GMV alto e settlement ainda parcial — é o que a conciliação reconcilia ao longo do tempo, não uma soma direta.</div></div>`;

  // === Fase 2: Margem por produto — contribuição (GMV−CPV) + líquida estimada (× eficiência de settlement) ===
  let gRev=0,gSet=0; Object.values(FIN).forEach(f=>{gRev+=f.rev;gSet+=f.set;});
  const eficFrac = A.rev ? A.set/A.rev : (gRev?gSet/gRev:0.74); // settlement/receita; fallback global se o período não tem finance
  const margAgg={};
  meses.forEach(m=>{const pm=PROD[m]||{}; Object.entries(pm).forEach(([nome,v])=>{const a=margAgg[nome]||(margAgg[nome]={qty:0,custo:0,gmvCpv:0}); a.qty+=v.qty;a.custo+=v.custo;a.gmvCpv+=v.gmvCpv;});});
  let mGmvAll=0; meses.forEach(m=>{const g=GMV[m]; if(g)mGmvAll+=g.gmv;});
  let mCusto=0,mGmvCpv=0,mQty=0;
  Object.values(margAgg).forEach(v=>{mCusto+=v.custo;mGmvCpv+=v.gmvCpv;mQty+=v.qty;});
  const cobertura=mGmvAll?mGmvCpv/mGmvAll*100:0;
  const mContrib=mGmvCpv-mCusto, contribPct=mGmvCpv?mContrib/mGmvCpv*100:0;
  const mLiq=mGmvCpv*eficFrac-mCusto, liqPct=mGmvCpv?mLiq/mGmvCpv*100:0;
  const margList=Object.entries(margAgg).map(([nome,v])=>{const contrib=v.gmvCpv-v.custo, liq=v.gmvCpv*eficFrac-v.custo; return {nome,gmv:v.gmvCpv,qty:v.qty,custo:v.custo,contrib,liq,liqPct:v.gmvCpv?liq/v.gmvCpv*100:0};}).filter(x=>x.gmv>0).sort((a,b)=>b.liq-a.liq).slice(0,15);
  const margRows=margList.map((x,i)=>`<tr>
    <td class="mp" style="max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${x.nome.replace(/"/g,'')}">${i+1}. ${x.nome}</td>
    <td>${NUM.format(x.qty)}</td><td>${fmt(x.gmv)}</td><td class="neg">${fmt(x.custo)}</td>
    <td>${fmt(x.contrib)}</td>
    <td style="font-weight:700;color:${x.liq>=0?'var(--green)':'var(--rhode-red)'}">${fmt(x.liq)}</td>
    <td>${x.liqPct.toFixed(1)}%</td></tr>`).join('');
  const fase2=`<div class="sec"><div class="sec-h"><h2>Margem por produto <span class="pill">CPV</span></h2><div class="meta">${sel==='ALL'?'todos os meses':fmtMes(sel)} · contribuição & líquida estimada</div></div>
    <div class="kpis" style="margin-bottom:18px">
      <div class="kpi"><div class="lbl">GMV com CPV</div><div class="val">${fmt(mGmvCpv)}</div><div class="foot">cobertura ${cobertura.toFixed(1)}%</div></div>
      <div class="kpi"><div class="lbl">Margem contribuição</div><div class="val">${fmt(mContrib)}</div><div class="foot">${contribPct.toFixed(1)}% · GMV − CPV</div></div>
      <div class="kpi"><div class="lbl">Margem líquida est.</div><div class="val accent">${fmt(mLiq)}</div><div class="foot">${liqPct.toFixed(1)}% · líq. de fee+ads</div></div>
      <div class="kpi"><div class="lbl">Eficiência aplicada</div><div class="val">${(eficFrac*100).toFixed(1)}%</div><div class="foot">settlement / receita</div></div>
    </div>
    <table><thead><tr><th>Produto</th><th>Qtd</th><th>GMV</th><th>Custo CPV</th><th>Contrib.</th><th>Líq. est.</th><th>Líq.%</th></tr></thead><tbody>${margRows}</tbody></table>
    <div class="note" style="margin-top:14px;background:#eef6f0;border-color:#cfe6d8;color:#2a6045"><span style="font-size:15px">📦</span><div><b>Contribuição</b> = GMV − CPV (exata). <b>Líquida estimada</b> = GMV × <b>${(eficFrac*100).toFixed(1)}%</b> (eficiência de settlement) − CPV — deduz o fee da plataforma (~26%, que <b>já inclui comissão de afiliada E a mídia/GMV Max</b>) rateado por GMV. É <b>estimativa otimista</b> (usa GMV bruto; descontos de vendedor/devoluções reduzem um pouco o líquido real). O valor exato por SKU exige o detalhe order-level do finance — próximo passo. Cobertura CPV: <b>${cobertura.toFixed(1)}%</b>.</div></div></div>`;

  // === GMV Max (ads) + fecho da cascata de lucro ===
  const ad={custo:0,receita:0,pedidos:0,camp:{}};
  meses.forEach(m=>{const a=ADS[m]; if(!a)return; ad.custo+=a.custo;ad.receita+=a.receita;ad.pedidos+=a.pedidos;
    Object.entries(a.camp).forEach(([n,c])=>{const x=ad.camp[n]||(ad.camp[n]={custo:0,receita:0,pedidos:0});x.custo+=c.custo;x.receita+=c.receita;x.pedidos+=c.pedidos;});});
  const adRoi=ad.custo?ad.receita/ad.custo:0;
  const adGmvPct=mGmvAll?ad.custo/mGmvAll*100:0;  // intensidade de mídia (gasto / GMV) — informativo, NÃO dedução
  const campRows=Object.entries(ad.camp).map(([n,c])=>({n,...c,roi:c.custo?c.receita/c.custo:0})).sort((a,b)=>b.custo-a.custo).slice(0,12)
    .map((c,i)=>`<tr><td class="mp" style="max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${c.n.replace(/"/g,'')}">${i+1}. ${c.n}</td><td class="neg">${fmt(c.custo)}</td><td>${fmt(c.receita)}</td><td style="font-weight:700;color:var(--green)">${c.roi.toFixed(1)}x</td><td>${NUM.format(c.pedidos)}</td></tr>`).join('');
  const adsBlock = ad.custo>0 ? `<div class="sec"><div class="sec-h"><h2>GMV Max <span class="pill">ads</span></h2><div class="meta">${sel==='ALL'?'todos os meses':fmtMes(sel)} · Seller Center</div></div>
    <div class="kpis" style="margin-bottom:18px">
      <div class="kpi"><div class="lbl">Gasto GMV Max</div><div class="val" style="color:var(--rhode-red)">${fmt(ad.custo)}</div><div class="foot">${NUM.format(ad.pedidos)} pedidos</div></div>
      <div class="kpi"><div class="lbl">Receita atribuída</div><div class="val">${fmt(ad.receita)}</div><div class="foot">GMV gerado por ads</div></div>
      <div class="kpi"><div class="lbl">ROI (ROAS)</div><div class="val accent">${adRoi.toFixed(2)}x</div><div class="foot">receita / gasto</div></div>
      <div class="kpi"><div class="lbl">Ads / GMV</div><div class="val">${adGmvPct.toFixed(1)}%</div><div class="foot">intensidade de mídia</div></div>
    </div>
    <table><thead><tr><th>Campanha</th><th>Gasto</th><th>Receita</th><th>ROI</th><th>Pedidos</th></tr></thead><tbody>${campRows}</tbody></table>
    <div class="note" style="margin-top:14px;background:#fff8ee;border-color:#f0e2c8;color:#7a5b1e"><span style="font-size:15px">⚠️</span><div><b>O gasto de GMV Max JÁ está embutido no fee da plataforma</b> — descontado direto do settlement (confirmado na decomposição order-level: o resíduo não-comissão do fee bate ~98% com o gasto de mídia). Logo, a <b>margem líquida acima já é líquida de ads</b> — não subtrair de novo (seria double-count). Esta seção é a <b>lente do ROI da mídia</b>, não uma dedução extra. Falta só o degrau de impostos pro lucro final.</div></div></div>` : '';

  // === Lucro final (após imposto) — fecha a cascata ===
  const impVenda = mGmvCpv * TX_VENDA/100;          // imposto s/ venda (PIS/COFINS+ICMS) sobre a receita
  const lucroAntesIR = mLiq - impVenda;
  const impIR = lucroAntesIR>0 ? lucroAntesIR * TX_IR/100 : 0;  // IRPJ+CSLL só sobre lucro positivo
  const lucroFinal = lucroAntesIR - impIR, lucroPct = mGmvCpv ? lucroFinal/mGmvCpv*100 : 0;
  const inp='font-family:JetBrains Mono,monospace;width:62px;padding:5px 8px;border:1px solid var(--hairline);border-radius:8px;font-size:13px;text-align:right;outline:none';
  const lucroBlock = `<div class="sec"><div class="sec-h"><h2>Lucro final <span class="pill">após imposto</span></h2><div class="meta">Lucro Real · a confirmar c/ contador</div></div>
    <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin-bottom:16px;font-size:13px;color:var(--ink-64)">
      <label>Imposto s/ venda <input type="number" step="0.25" value="${TX_VENDA}" onchange="setTx('venda',this.value)" style="${inp}"> %</label>
      <label>IRPJ + CSLL <input type="number" step="1" value="${TX_IR}" onchange="setTx('ir',this.value)" style="${inp}"> %</label>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="lbl">Margem líquida</div><div class="val">${fmt(mLiq)}</div><div class="foot">antes de imposto</div></div>
      <div class="kpi"><div class="lbl">− Imposto s/ venda</div><div class="val" style="color:var(--rhode-red)">${fmt(impVenda)}</div><div class="foot">${TX_VENDA}% · PIS/COFINS+ICMS</div></div>
      <div class="kpi"><div class="lbl">− IRPJ + CSLL</div><div class="val" style="color:var(--rhode-red)">${fmt(impIR)}</div><div class="foot">${TX_IR}% s/ lucro</div></div>
      <div class="kpi"><div class="lbl">= LUCRO FINAL</div><div class="val accent">${fmt(lucroFinal)}</div><div class="foot">${lucroPct.toFixed(1)}% do GMV c/ CPV</div></div>
    </div>
    <div class="note" style="margin-top:14px"><span style="font-size:15px">🧾</span><div><b>Estimativa Lucro Real</b> — ajuste as alíquotas acima e confirme com a contabilidade. Imposto s/ venda incide na receita; IRPJ+CSLL (34%) só sobre lucro positivo. O CPV gera crédito de PIS/COFINS/ICMS que aqui está simplificado, então o líquido real tende a ser <b>um pouco melhor</b>. Tudo acima já é líquido de fee+afiliada+GMV Max.</div></div></div>`;

  document.getElementById('body').innerHTML = kpis + cascata + trend + prods + nota + fase2 + lucroBlock + adsBlock;
}

function enter(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  load().catch(e=>{ document.getElementById('body').innerHTML=`<div class="loading">Erro: ${e.message}</div>`; });
}
if(admToken()) enter();
</script>
</body>
</html>
