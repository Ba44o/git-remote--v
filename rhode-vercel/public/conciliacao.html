<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
(function(){try{var t=localStorage.getItem('rhode-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark')}})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhode · Conciliação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#1d1d1f; --ink-64:#5a5a5e; --ink-48:#85858a; --ink-24:#bcbcc0;
    --pearl:#fafafc; --parchment:#f5f5f7; --hairline:#e6e6ea; --card:#ffffff;
    --rhode-red:#FE2C55; --green:#1a8f5a; --orange:#c05e00; --blue:#2563eb; --amber:#b45309;

    /* ── UI v2 (2026-07-13): tokens do shell dashboard ── */
    --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-6:24px;--sp-8:32px;--sp-12:48px;
    --r-input:10px; --r-card:14px; --r-pill:99px;
    --focus:0 0 0 3px rgba(254,44,85,.20);
    --ease:all .16s ease;
    --side-w:250px;
    --side-bg:#ffffff;
    --side-active:rgba(254,44,85,.08);
    --divider:#eef0f3;
    --shadow-sm:0 1px 2px rgba(16,24,40,.06);
    --shadow-md:0 6px 22px rgba(16,24,40,.08);
  }
  /* Tema escuro (default do console interno) */
  :root[data-theme="dark"]{
    --ink:#f2f4f7; --ink-64:#c3c9d4; --ink-48:#8a93a3; --ink-24:#5a6272;
    --pearl:#0b0d12; --parchment:#0b0d12; --hairline:#242a35; --card:#151922;
    --side-bg:#0f131a; --side-active:rgba(255,107,138,.14); --divider:#1e242e;
    --rhode-red:#FE2C55; --green:#3ddc97; --orange:#f5a524; --blue:#38bdf8; --amber:#f5a524;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 8px 26px rgba(0,0,0,.55);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:var(--pearl);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45}
  .mono{font-family:'JetBrains Mono',monospace}
  .num{font-variant-numeric:tabular-nums}

  /* login */
  #login{position:fixed;inset:0;display:grid;place-items:center;background:var(--pearl);z-index:50}
  .login-card{background:var(--card);border:1px solid var(--hairline);border-radius:18px;padding:40px;width:340px;box-shadow:0 12px 40px rgba(0,0,0,.06)}
  .login-card h1{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
  .login-card p{font-size:13px;color:var(--ink-48);margin-bottom:24px}
  .login-card input{width:100%;padding:13px 15px;border:1px solid var(--hairline);border-radius:11px;font-family:'JetBrains Mono',monospace;font-size:14px;margin-bottom:14px;outline:none}
  .login-card input:focus{border-color:var(--ink)}
  .login-card button{width:100%;padding:13px;background:var(--rhode-red);color:#fff;border:none;border-radius:11px;font-weight:600;font-size:14px;cursor:pointer;transition:filter .12s}
  .login-card button:hover{filter:brightness(1.08)}
  .login-err{color:var(--rhode-red);font-size:12px;margin-top:12px;min-height:16px;text-align:center}

  /* ── Shell v2 ── */
  .app{display:grid;grid-template-columns:var(--side-w) 1fr;min-height:100vh;background:var(--parchment)}
  .side{position:sticky;top:0;height:100vh;background:var(--side-bg);border-right:1px solid var(--hairline);
    display:flex;flex-direction:column;padding:var(--sp-4) var(--sp-3);gap:2px;overflow-y:auto;z-index:50}
  .side::-webkit-scrollbar{width:6px}.side::-webkit-scrollbar-thumb{background:var(--divider);border-radius:3px}
  .side-brand{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:18px;letter-spacing:-.02em;color:var(--ink);padding:var(--sp-2) var(--sp-3) var(--sp-6);flex-shrink:0}
  .side-brand .adot{color:var(--rhode-red)}
  .side-brand small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-48);font-weight:500;display:block;margin-top:2px}
  .side-nav{display:flex;flex-direction:column;gap:2px}
  .side-sec{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-48);font-weight:500;padding:var(--sp-4) var(--sp-3) var(--sp-1)}
  .side-item{display:flex;align-items:center;gap:10px;padding:9px var(--sp-3);border-radius:var(--r-input);color:var(--ink-48);text-decoration:none;font-family:'Inter',sans-serif;font-size:13.5px;font-weight:500;cursor:pointer;border:none;background:none;text-align:left;width:100%;transition:var(--ease)}
  .side-item:hover{background:var(--divider);color:var(--ink)}
  .side-item.on{background:var(--side-active);color:var(--rhode-red);font-weight:600}
  .side-ico{width:18px;text-align:center;opacity:.9;flex-shrink:0;font-size:14px}
  .side-foot{margin-top:auto;padding-top:var(--sp-4);border-top:1px solid var(--hairline)}
  .side-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:8px var(--sp-3);border-radius:var(--r-input);background:none;border:none;color:var(--ink-48);cursor:pointer;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:500;transition:var(--ease)}
  .side-btn:hover{background:var(--divider);color:var(--ink)}
  .content{display:flex;flex-direction:column;min-width:0}
  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);padding:0 var(--sp-6);height:56px;background:var(--parchment);border-bottom:1px solid var(--hairline);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
  .crumbs{font-family:'Inter',sans-serif;font-size:13px;color:var(--ink-48);letter-spacing:-.011em}
  .crumbs b{color:var(--ink);font-weight:600}
  .crumbs .sep{margin:0 6px;opacity:.6}
  .tright{display:flex;align-items:center;gap:10px}
  .theme-toggle{width:34px;height:34px;padding:0;border:1px solid var(--hairline);border-radius:var(--r-pill);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:15px;transition:var(--ease)}
  .theme-toggle:hover{border-color:var(--ink-48)}
  :root[data-theme="dark"] .theme-toggle::before{content:'☀'}
  :root:not([data-theme="dark"]) .theme-toggle::before{content:'☾'}
  .lnk{font-family:'Inter',sans-serif;font-size:12px;color:var(--ink-64);text-decoration:none;border:1px solid var(--hairline);padding:8px 12px;border-radius:var(--r-pill);background:var(--card);cursor:pointer;transition:var(--ease)}
  .lnk:hover{color:var(--ink);border-color:var(--ink-48)}

  /* Backdrop mobile — SEMPRE display:none no desktop (senão vira grid item) */
  .side-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
  .side-backdrop.on{display:block}
  .side-open-btn{display:none;background:none;border:none;color:var(--ink);font-size:22px;cursor:pointer;padding:0 4px}
  @media(max-width:900px){
    .app{grid-template-columns:1fr}
    .side{position:fixed;left:-100%;top:0;height:100vh;width:var(--side-w);box-shadow:var(--shadow-md);transition:left .2s;z-index:55}
    .side.open{left:0}
    .side-open-btn{display:inline-flex}
  }

  #app{display:none}
  #app.on{display:block}
  .work{padding:24px 28px 90px}

  /* filtro */
  .filterbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0 18px;margin-bottom:6px}
  .seg{display:flex;gap:2px;background:var(--parchment);border:1px solid var(--hairline);border-radius:10px;padding:2px}
  .seg button{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;border:none;background:none;color:var(--ink-48);padding:7px 13px;border-radius:8px;cursor:pointer;transition:all .12s}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .fld{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-48)}
  select,input[type=date],input[type=month]{font-family:'JetBrains Mono',monospace;font-size:12.5px;padding:7px 11px;border:1px solid var(--hairline);border-radius:9px;background:var(--card);cursor:pointer;outline:none;color:var(--ink)}
  .fmeta{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-48)}

  /* tabs */
  .tabnav{display:flex;gap:2px;border-bottom:1px solid var(--hairline);margin-bottom:26px;overflow-x:auto}
  .tabnav button{font-family:'Inter',sans-serif;font-size:14px;font-weight:500;border:none;background:none;color:var(--ink-48);padding:12px 16px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .12s}
  .tabnav button:hover{color:var(--ink)}
  .tabnav button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--rhode-red)}

  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  .kpis.k6{grid-template-columns:repeat(6,1fr)}
  .kpi{background:var(--card);border:1px solid var(--hairline);border-radius:14px;padding:16px 18px}
  .kpi .lbl{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-48)}
  .kpi .val{font-family:'JetBrains Mono',monospace;font-size:23px;font-weight:700;letter-spacing:-.02em;margin-top:7px;font-variant-numeric:tabular-nums}
  .kpi.k6 .val{font-size:19px}
  .kpi .val.accent{color:var(--green)}
  .kpi .val.danger{color:var(--rhode-red)}
  .kpi .foot{font-size:11px;color:var(--ink-48);margin-top:4px}

  .sec{background:var(--card);border:1px solid var(--hairline);border-radius:16px;padding:22px 24px;margin-bottom:20px}
  .sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
  .sec-h h2{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;letter-spacing:-.01em}
  .sec-h .meta{font-size:12px;color:var(--ink-48)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:880px){.grid2{grid-template-columns:1fr}.kpis,.kpis.k6{grid-template-columns:repeat(2,1fr)}}

  /* cascata */
  .casc-row{display:grid;grid-template-columns:200px 1fr 150px;align-items:center;gap:14px;padding:9px 0}
  .casc-row + .casc-row{border-top:1px solid #f1f1f4}
  .casc-lbl{font-size:13.5px;font-weight:500}
  .casc-lbl small{display:block;font-size:10.5px;color:var(--ink-48);font-weight:400;margin-top:1px}
  .casc-bar{height:9px;border-radius:5px;background:#eef0f3;overflow:hidden}
  .casc-bar i{display:block;height:100%;border-radius:5px}
  .casc-val{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  .casc-row.total{border-top:2px solid var(--ink);margin-top:4px;padding-top:13px}
  .casc-row.total .casc-lbl{font-weight:700}
  .casc-row.total .casc-val{font-size:17px;color:var(--green)}
  .neg{color:var(--rhode-red)}

  table{width:100%;border-collapse:collapse}
  th,td{text-align:right;padding:9px 12px;font-size:13px;font-variant-numeric:tabular-nums}
  th{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-48);border-bottom:1px solid var(--hairline);font-weight:600;cursor:default}
  td{font-family:'JetBrains Mono',monospace;border-bottom:1px solid #f1f1f4}
  th:first-child,td:first-child{text-align:left}
  tbody tr:hover{background:#fafafb}
  td.mp{font-family:'Inter',sans-serif;font-weight:600}
  .tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 8px;border-radius:99px;font-weight:600}
  .tag.ok{background:#e8f6ee;color:var(--green)} .tag.warn{background:#fdeaea;color:var(--rhode-red)} .tag.mut{background:var(--parchment);color:var(--ink-48)}

  .note{background:#fff8ee;border:1px solid #f0e2c8;border-radius:12px;padding:13px 15px;font-size:12.5px;color:#7a5b1e;line-height:1.5;display:flex;gap:10px}
  .note b{color:#5a4310}
  .note.green{background:#eef6f0;border-color:#cfe6d8;color:#2a6045} .note.green b{color:#1a5b3a}
  .pill{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.05em;background:var(--parchment);color:var(--ink-48);padding:3px 9px;border-radius:99px;border:1px solid var(--hairline)}
  .loading{text-align:center;color:var(--ink-48);font-size:13px;padding:60px}

  /* alerta destaque (tarifa) */
  .alert{display:flex;gap:16px;align-items:center;background:linear-gradient(120deg,#fff5f7,#fff);border:1px solid #f6cdd6;border-radius:16px;padding:18px 22px;margin-bottom:20px}
  .alert .ic{font-size:26px}
  .alert .big{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:800;color:var(--rhode-red);letter-spacing:-.02em}
  .alert .tx{font-size:13px;color:var(--ink-64);line-height:1.5}
  .alert .tx b{color:var(--ink)}

  /* search */
  .search{font-family:'JetBrains Mono',monospace;font-size:13px;padding:8px 13px;border:1px solid var(--hairline);border-radius:10px;background:var(--card);outline:none;width:230px}
  .chartwrap{position:relative;height:280px}
  .empty{text-align:center;color:var(--ink-48);font-size:13px;padding:40px}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <h1>rhode<span style="color:var(--rhode-red)">.</span> conciliação</h1>
    <p>Console financeiro · acesso admin</p>
    <input id="adm-pass" type="password" placeholder="senha admin" onkeydown="if(event.key==='Enter')admLogin()">
    <button onclick="admLogin()">Entrar</button>
    <div class="login-err" id="adm-err"></div>
  </div>
</div>

<div id="app">
<div class="app">
  <div class="side-backdrop" id="sideBackdrop" onclick="closeSide()"></div>
  <aside class="side" id="side">
    <div class="side-brand">Rhode<span class="adot">.</span><small>Console</small></div>
    <nav class="side-nav">
      <div class="side-sec">Creators</div>
      <a class="side-item" href="admin.html"><span class="side-ico">◧</span> Console Creators</a>

      <div class="side-sec">Vendas &amp; GMV</div>
      <button class="side-item on"><span class="side-ico">▤</span> Conciliação</button>

      <div class="side-sec">Lives</div>
      <a class="side-item" href="dash-live.html"><span class="side-ico">◔</span> Dashboard Lives</a>

      <div class="side-sec">Bio</div>
      <a class="side-item" href="bio-admin.html"><span class="side-ico">✧</span> Bio Rhode</a>
    </nav>
    <div class="side-foot">
      <button class="side-btn" onclick="logout()">Sair <span style="opacity:.5">↩</span></button>
    </div>
  </aside>

  <main class="content">
    <header class="topbar">
      <button class="side-open-btn" onclick="openSide()" aria-label="Abrir menu">☰</button>
      <div class="crumbs"><span>Vendas &amp; GMV</span><span class="sep">›</span><b>Conciliação</b></div>
      <div class="tright">
        <a class="lnk" id="btn-export" onclick="exportRelatorio()" style="font-weight:600">⬇ Exportar</a>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Alternar tema"></button>
      </div>
    </header>

    <div class="work">
      <div class="filterbar">
        <div class="seg" id="seg-janela">
          <button data-j="tudo" class="on" onclick="setJanela('tudo')">Tudo</button>
          <button data-j="3m" onclick="setJanela('3m')">3M</button>
          <button data-j="6m" onclick="setJanela('6m')">6M</button>
          <button data-j="ano" onclick="setJanela('ano')">Ano</button>
        </div>
        <div class="fld">Mês <select id="f-mes" onchange="setMes(this.value)"></select></div>
        <div class="fld">Data <input type="date" id="f-de" onchange="setRange()"> → <input type="date" id="f-ate" onchange="setRange()"></div>
        <div class="fmeta" id="f-meta"></div>
      </div>
      <div class="tabnav" id="tabnav"></div>
      <div id="content"><div class="loading">Carregando dados…</div></div>
    </div>
  </main>
</div>
</div>

<script>
const ADM_TOKEN_KEY='rhode-admin-token';
function admToken(){ try{return sessionStorage.getItem(ADM_TOKEN_KEY)||'';}catch(e){return'';} }
async function admLogin(){
  const pass=document.getElementById('adm-pass').value, err=document.getElementById('adm-err');
  try{
    const r=await fetch('/api/get-hub',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'admin_login',pass})});
    const d=await r.json().catch(()=>({}));
    if(r.ok && d.token){ sessionStorage.setItem(ADM_TOKEN_KEY,d.token); enter(); } else err.textContent=d.error||'Senha incorreta.';
  }catch(e){ err.textContent='Erro de conexão.'; }
}
function logout(){ try{sessionStorage.removeItem(ADM_TOKEN_KEY);}catch(_){}; location.reload(); }
async function admProxy(method, path, opts={}){
  const payload={action:'admin_query', adminToken:admToken(), method, path, paged:opts.paged};
  if(opts.body!==undefined) payload.body=opts.body;
  if(opts.prefer) payload.prefer=opts.prefer;
  const r=await fetch('/api/get-hub',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(r.status===401){ logout(); throw new Error('sessão expirada'); }
  if(!r.ok){ let e={};try{e=await r.json();}catch(_){}; throw new Error(e.error||('HTTP '+r.status)); }
  return r.json().catch(()=>({}));
}

// formatação
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const BRL2=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2});
const NUM=new Intl.NumberFormat('pt-BR');
const fmt=v=>BRL.format(v||0), fmt2=v=>BRL2.format(v||0);
const pct=(a,b)=>b?(a/b*100):0;
const MES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const fmtMes=id=>{const[y,m]=String(id||'').split('-');return m?`${MES[+m-1]}/${String(y).slice(2)}`:id;};

// estado
let FIN={}, GMV={}, PROD={}, CPVMAP={}, ADS={}, STX={}, DIV=[], SPLIT={}, OFI={}, CONC={}, ADC={}, ADCAMP=[], LIVESES=[], LIVEATTR=[], LIVEPER={}, MESES=[];
let TAB='visao';
let FILTER={modo:'tudo', mes:'', de:'', ate:''};
let CHART=null;
let TX_VENDA=parseFloat(localStorage.getItem('rhode_tx_venda'))||6.4;   // Lucro Presumido (Rhode): ~6,4% s/ faturamento
let TX_IR=parseFloat(localStorage.getItem('rhode_tx_ir'))||0;           // Presumido: IRPJ/CSLL já embutidos no % s/ venda (sem 34% s/ lucro)
let TX_ICMS=parseFloat(localStorage.getItem('rhode_tx_icms'))||0;       // ICMS LÍQUIDO estimado — a confirmar c/ contador (fabrica CE, vende de SP; sem ST na venda B2C)
function setTx(w,v){const n=parseFloat(v)||0; if(w==='venda'){TX_VENDA=n;try{localStorage.setItem('rhode_tx_venda',n)}catch(e){}}else if(w==='icms'){TX_ICMS=n;try{localStorage.setItem('rhode_tx_icms',n)}catch(e){}}else{TX_IR=n;try{localStorage.setItem('rhode_tx_ir',n)}catch(e){}} render();}
function setRegime(r){ if(r==='presumido'){TX_VENDA=6.4;TX_IR=0;} else if(r==='real'){TX_VENDA=9.25;TX_IR=34;} try{localStorage.setItem('rhode_tx_venda',TX_VENDA);localStorage.setItem('rhode_tx_ir',TX_IR);}catch(e){} render(); }

const TABS=[['visao','Visão Geral'],['conciliacao','Conciliação'],['repasse','Repasse'],['receber','A Receber'],['produtos','Produtos'],['liquidacao','Liquidação SKU'],['psku','P&L SKU × Tamanho'],['lucro','Lucro'],['ads','Ads'],['lives','Lives'],['pedidos','Pedidos']];

async function load(){
  const [fin, ped, cpv, ads, stx, div, ofi, conc, adc, adcamp, livs, livp, liva] = await Promise.all([
    admProxy('GET','finance_statements?select=data,revenue_amount,fee_amount,shipping_cost,adjustment,settlement&order=data.asc',{paged:true}),
    admProxy('GET','pedidos_sku?select=periodo,gmv,qty,produto,seller_sku,status',{paged:true}),
    admProxy('GET','custos_sku?select=ref,cpv',{paged:true}),
    admProxy('GET','ads_gmvmax?select=periodo,campanha,custo,receita_bruta,pedidos',{paged:true}),
    admProxy('GET','statement_tx_resumo?select=*',{paged:true}).catch(()=>({data:[]})),
    admProxy('GET','repasse_divergencias?select=*',{paged:true}).catch(()=>({data:[]})),
    admProxy('GET','gmv_oficial_resumo?select=*',{paged:true}).catch(()=>({data:[]})),
    admProxy('GET','conciliacao_resumo?select=*',{paged:true}).catch(()=>({data:[]})),
    admProxy('GET','ads_custo_resumo?select=*',{paged:true}).catch(()=>({data:[]})),
    admProxy('GET','ads_campanha?select=data,periodo,campaign_id,campanha,modelo,cost,net_cost,receita,pedidos',{paged:true}).catch(()=>({data:[]})),
    admProxy('GET','live_sessao?select=room_id,data,periodo,campanha,origem,cost,receita,pedidos,views',{paged:true}).catch(()=>({data:[]})),
    admProxy('GET','live_periodo?select=*',{paged:true}).catch(()=>({data:[]})),
    admProxy('GET','live_attr?select=room_id,titulo,inicio,data,periodo,origem,gmv,pedidos,itens,customers,aov,views',{paged:true}).catch(()=>({data:[]}))
  ]);
  LIVEATTR = (liva&&liva.data)?liva.data:[];
  LIVESES = (livs&&livs.data)?livs.data:[];
  LIVEPER={}; (livp&&livp.data?livp.data:[]).forEach(r=>{ if(r.periodo) LIVEPER[r.periodo]=r; });
  OFI={}; (ofi&&ofi.data?ofi.data:[]).forEach(r=>{ if(r.periodo) OFI[r.periodo]=r; });
  CONC={}; (conc&&conc.data?conc.data:[]).forEach(r=>{ if(r.periodo) CONC[r.periodo]=r; });
  ADC={}; (adc&&adc.data?adc.data:[]).forEach(r=>{ if(r.periodo) ADC[r.periodo]=r; });
  ADCAMP = (adcamp&&adcamp.data)?adcamp.data:[];
  CPVMAP={}; (cpv.data||[]).forEach(r=>{ if(r.ref) CPVMAP[String(r.ref).toUpperCase()]=+r.cpv||0; });
  STX={}; (stx.data||[]).forEach(r=>{ if(r.periodo) STX[r.periodo]=r; });
  DIV = (div&&div.data)?div.data:[];
  ADS={}; (ads.data||[]).forEach(r=>{const m=r.periodo; if(!m)return; const a=ADS[m]||(ADS[m]={custo:0,receita:0,pedidos:0,camp:{}}); a.custo+=+r.custo||0;a.receita+=+r.receita_bruta||0;a.pedidos+=+r.pedidos||0; const n=(r.campanha||'—'); const c=a.camp[n]||(a.camp[n]={custo:0,receita:0,pedidos:0}); c.custo+=+r.custo||0;c.receita+=+r.receita_bruta||0;c.pedidos+=+r.pedidos||0;});
  FIN={}; (fin.data||[]).forEach(r=>{const m=(r.data||'').slice(0,7); if(!m)return; const a=FIN[m]||(FIN[m]={rev:0,fee:0,ship:0,adj:0,set:0,n:0}); a.rev+=+r.revenue_amount||0;a.fee+=+r.fee_amount||0;a.ship+=+r.shipping_cost||0;a.adj+=+r.adjustment||0;a.set+=+r.settlement||0;a.n++;});
  GMV={}; PROD={}; SPLIT={};
  (ped.data||[]).forEach(r=>{
    const m=r.periodo; if(!m)return;
    const g=+r.gmv||0, q=+r.qty||0, cpvUn=CPVMAP[(r.seller_sku||'').toUpperCase()];
    const canc=/CANCEL/i.test(r.status||'');
    const a=GMV[m]||(GMV[m]={gmv:0,qty:0,itens:0,canc:0,cancq:0}); a.gmv+=g; a.qty+=q; a.itens++; if(canc){a.canc+=g;a.cancq+=q;}
    if(canc) return;  // cancelado não gera margem nem fee — fora do GMV válido
    const nome=(r.produto||'—').trim();
    const pm=PROD[m]||(PROD[m]={}); const p=pm[nome]||(pm[nome]={gmv:0,qty:0,custo:0,gmvCpv:0});
    p.gmv+=g; p.qty+=q; if(cpvUn!=null){ p.custo+=cpvUn*q; p.gmvCpv+=g; }
    const sp=SPLIT[m]||(SPLIT[m]={gmvLt:0,qtyGe:0}); const un=q>0?g/q:0;
    if(un>0 && un<50) sp.gmvLt+=g; else if(un>=50) sp.qtyGe+=q;
  });
  MESES=[...new Set([...Object.keys(FIN),...Object.keys(GMV),...Object.keys(ADS),...Object.keys(STX)])].filter(Boolean).sort();
  // filtros
  document.getElementById('f-mes').innerHTML='<option value="">—</option>'+MESES.slice().reverse().map(m=>`<option value="${m}">${fmtMes(m)}</option>`).join('');
  document.getElementById('tabnav').innerHTML=TABS.map(([k,l])=>`<button data-t="${k}" class="${k===TAB?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('');
  render();
}

// ---- filtros → meses ----
function getMeses(){
  if(!MESES.length) return [];
  if(FILTER.modo==='mes' && FILTER.mes) return [FILTER.mes];
  if(FILTER.modo==='range' && FILTER.de && FILTER.ate){ const a=FILTER.de.slice(0,7), b=FILTER.ate.slice(0,7); return MESES.filter(m=>m>=a&&m<=b); }
  if(FILTER.modo==='3m') return MESES.slice(-3);
  if(FILTER.modo==='6m') return MESES.slice(-6);
  if(FILTER.modo==='ano'){ const y=MESES[MESES.length-1].slice(0,4); return MESES.filter(m=>m.startsWith(y)); }
  return MESES;
}
function periodoLabel(){ const ms=getMeses(); if(!ms.length) return '—'; if(ms.length===1) return fmtMes(ms[0]); return `${fmtMes(ms[0])} – ${fmtMes(ms[ms.length-1])}`; }
function setJanela(j){ FILTER={modo:j,mes:'',de:'',ate:''}; document.getElementById('f-mes').value=''; document.getElementById('f-de').value=''; document.getElementById('f-ate').value=''; syncSeg(j); render(); }
function setMes(v){ if(!v){return;} FILTER={modo:'mes',mes:v,de:'',ate:''}; document.getElementById('f-de').value=''; document.getElementById('f-ate').value=''; syncSeg(null); render(); }
function setRange(){ const de=document.getElementById('f-de').value, ate=document.getElementById('f-ate').value; if(de&&ate){ FILTER={modo:'range',mes:'',de,ate}; document.getElementById('f-mes').value=''; syncSeg(null); render(); } }
function syncSeg(j){ document.querySelectorAll('#seg-janela button').forEach(b=>b.classList.toggle('on', b.dataset.j===j)); }

function setTab(t){ TAB=t; document.querySelectorAll('#tabnav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t)); render(); }

// ---- núcleo de cálculo (para os meses do filtro) ----
function agg(meses){
  const A={rev:0,fee:0,ship:0,adj:0,set:0,n:0}; let gmv=0,qty=0,gmvVal=0,qtyVal=0,cancV=0, exSettle=0,exPago=0, pago=0;
  meses.forEach(m=>{const f=FIN[m]; if(f){A.rev+=f.rev;A.fee+=f.fee;A.ship+=f.ship;A.adj+=f.adj;A.set+=f.set;A.n+=f.n;} const g=GMV[m]; if(g){gmv+=g.gmv;qty+=g.qty;gmvVal+=(g.gmv-(g.canc||0));qtyVal+=(g.qty-(g.cancq||0));cancV+=(g.canc||0);} const s=STX[m]; if(s){exSettle+=+s.settle_liq||0;exPago+=+s.pago_liq||0;pago+=+s.pago_total||0;}});
  // GMV OFICIAL (Orders API, = Seller Center, sem lag) — ponte: oficial → frete → produto → válido
  let ofiHas=false, gmvOficial=0, ofiFrete=0, ofiProduto=0, ofiPagoCanc=0, ofiProdValido=0, ofiN=0;
  meses.forEach(m=>{const o=OFI[m]; if(o){ofiHas=true; gmvOficial+=+o.gmv_oficial||0; ofiFrete+=+o.frete||0; ofiProduto+=+o.produto||0; ofiPagoCanc+=+o.pago_cancelado||0; ofiProdValido+=+o.produto_valido||0; ofiN+=+o.pedidos_pagos||0;}});
  const gmvAll=gmvVal;                              // base de cobertura/ads = GMV válido produto
  const faturamento = ofiHas ? gmvOficial : gmvVal; // headline: GMV oficial (= SC) quando disponível; senão GMV válido
  const margAgg={};
  meses.forEach(m=>{const pm=PROD[m]||{}; Object.entries(pm).forEach(([nome,v])=>{const a=margAgg[nome]||(margAgg[nome]={qty:0,custo:0,gmvCpv:0,gmv:0}); a.qty+=v.qty;a.custo+=v.custo;a.gmvCpv+=v.gmvCpv;a.gmv+=v.gmv;});});
  let mCusto=0,mGmvCpv=0,mQty=0; Object.values(margAgg).forEach(v=>{mCusto+=v.custo;mGmvCpv+=v.gmvCpv;mQty+=v.qty;});
  let gRev=0,gSet=0; Object.values(FIN).forEach(f=>{gRev+=f.rev;gSet+=f.set;});
  const eficFrac = exPago>0 ? exSettle/exPago : (A.rev?A.set/A.rev:(gRev?gSet/gRev:0.74));
  const eficExata = exPago>0;
  const cobertura = gmvAll?mGmvCpv/gmvAll*100:0;
  const mContrib=mGmvCpv-mCusto, mLiq=mGmvCpv*eficFrac-mCusto;
  let adReal=0,adRealRec=0,adRealHas=false,adTrad=0;
  meses.forEach(m=>{const a=ADC[m]; if(a){adRealHas=true; adReal+=+a.custo||0; adRealRec+=+a.receita||0;} const g=ADS[m]; if(g) adTrad+=g.custo;});
  // PROVADO (4 investigadores · 98 statements reconciliam sem NENHUMA linha de ads): o settlement não tem custo de GMV Max. Tradicional E Vendas Líquidas são debitados da CONTA DE ADS → subtrair AMBOS (ads_custo total) do lucro.
  const impVenda=mGmvCpv*(TX_VENDA+TX_ICMS)/100, lucroAntesIR=mLiq-impVenda-adReal, impIR=lucroAntesIR>0?lucroAntesIR*TX_IR/100:0, lucroFinal=lucroAntesIR-impIR;
  const rp={liq:0,pagoLiq:0,rec:0,recN:0,dev:0,devN:0,plat:0,afi:0,ads:0,frete:0,liqN:0};
  meses.forEach(m=>{const s=STX[m]; if(!s)return; rp.liq+=+s.settle_liq||0;rp.pagoLiq+=+s.pago_liq||0;rp.liqN+=+s.liquidados||0;rp.rec+=+s.a_receber||0;rp.recN+=+s.pendentes||0;rp.dev+=+s.devolucao||0;rp.devN+=+s.devolvidos||0;rp.plat+=+s.comissao_plataforma||0;rp.afi+=+s.comissao_afiliada||0;rp.ads+=+s.comissao_ads_afil||0;rp.frete+=+s.frete||0;});
  const rpTaxa=rp.pagoLiq?(1-rp.liq/rp.pagoLiq)*100:0;
  const ad={custo:0,receita:0,pedidos:0,camp:{}};
  meses.forEach(m=>{const a=ADS[m]; if(!a)return; ad.custo+=a.custo;ad.receita+=a.receita;ad.pedidos+=a.pedidos; Object.entries(a.camp).forEach(([n,c])=>{const x=ad.camp[n]||(ad.camp[n]={custo:0,receita:0,pedidos:0});x.custo+=c.custo;x.receita+=c.receita;x.pedidos+=c.pedidos;});});
  let gmvLt=0,qtyGe=0; meses.forEach(m=>{const s=SPLIT[m]; if(s){gmvLt+=s.gmvLt;qtyGe+=s.qtyGe;}});
  const tarifaExtra=0.04*gmvLt+2.0*qtyGe;
  // CONCILIAÇÃO (esperado × real)
  const C={has:false,receita:0,repasse:0,com_real:0,com_esp:0,serv_real:0,serv_esp:0,afi:0,ads:0,fre:0,tabela:0,desc:0,desc_plat:0,div_serv:0,custo_dev:0,faltante:0,imp:0,n_ok:0,n_serv:0,n_com:0,n_dev:0,n_falt:0,n_canc:0,n_total:0};
  meses.forEach(m=>{const c=CONC[m]; if(!c)return; C.has=true;
    C.receita+=+c.receita||0; C.repasse+=+c.repasse||0; C.com_real+=+c.comissao_real||0; C.com_esp+=+c.comissao_esp||0;
    C.serv_real+=+c.servico_real||0; C.serv_esp+=+c.servico_esp||0; C.afi+=+c.afiliada||0; C.ads+=+c.ads||0; C.fre+=+c.frete||0;
    C.tabela+=+c.preco_tabela||0; C.desc+=+c.desconto_vendedor||0; C.desc_plat+=+c.desconto_plataforma||0; C.div_serv+=+c.div_servico_revisar||0; C.custo_dev+=+c.custo_devolucao||0;
    C.faltante+=+c.valor_faltante||0; C.imp+=+c.impacto_1507||0;
    C.n_ok+=+c.n_ok||0; C.n_serv+=+c.n_servico||0; C.n_com+=+c.n_comissao||0; C.n_dev+=+c.n_devolucao||0; C.n_falt+=+c.n_faltante||0; C.n_canc+=+c.n_cancelado||0; C.n_total+=+c.pedidos_total||0;
  });
  return {A,gmv,qty,gmvAll,gmvVal,qtyVal,cancV,pago,faturamento,ofiHas,gmvOficial,ofiFrete,ofiProduto,ofiPagoCanc,ofiProdValido,ofiN,eficFrac,eficExata,margAgg,mCusto,mGmvCpv,mQty,cobertura,mContrib,mLiq,impVenda,impIR,lucroAntesIR,lucroFinal,rp,rpTaxa,ad,gmvLt,qtyGe,tarifaExtra,conc:C,adReal,adRealRec,adRealHas,adTrad};
}

// helpers UI
const kpi=(lbl,val,foot,cls='')=>`<div class="kpi ${cls.includes('k6')?'k6':''}"><div class="lbl">${lbl}</div><div class="val ${cls.replace('k6','').trim()}">${val}</div><div class="foot">${foot||''}</div></div>`;
const cascRow=(lbl,sub,val,color,maxv,cls='')=>`<div class="casc-row ${cls}"><div class="casc-lbl">${lbl}${sub?`<small>${sub}</small>`:''}</div><div class="casc-bar"><i style="width:${Math.min(100,Math.abs(val)/maxv*100)}%;background:${color}"></i></div><div class="casc-val ${val<0?'neg':''}">${fmt2(val)}</div></div>`;

function renderVisao(D,ms){
  const margPct=D.mGmvCpv?D.mLiq/D.mGmvCpv*100:0, lucroPct=D.mGmvCpv?D.lucroFinal/D.mGmvCpv*100:0;
  const prodAgg=Object.entries(D.margAgg).map(([n,v])=>({n,gmv:v.gmv})).sort((a,b)=>b.gmv-a.gmv);
  const top=prodAgg[0]||{n:'—',gmv:0};
  const falt=DIV.filter(d=>(FILTER.modo==='tudo'||ms.includes(d.periodo))&&d.classe==='repasse_faltante').reduce((s,d)=>s+(+d.pago||0),0);
  const k=`<div class="kpis k6">
    ${kpi(D.ofiHas?'GMV (oficial)':'GMV (válido)',fmt(D.faturamento),D.ofiHas?'= Seller Center · '+NUM.format(D.ofiN)+' ped pagos':NUM.format(D.qtyVal)+' itens · por data','k6')}
    ${kpi('Liquidado',fmt(D.rp.liq||D.A.set),'recebido de fato','k6 accent')}
    ${kpi('Lucro líquido',fmt(D.lucroFinal),lucroPct.toFixed(1)+'% do GMV','k6 accent')}
    ${kpi('Margem líq.',margPct.toFixed(1)+'%','após fee+ads','k6')}
    ${kpi('A receber',fmt(D.rp.rec),NUM.format(D.rp.recN)+' pendentes','k6')}
    ${kpi('Taxa real',D.rpTaxa.toFixed(1)+'%','só liquidados','k6')}
  </div>`;
  const alert=D.tarifaExtra>0?`<div class="alert">
    <div class="ic">⚠️</div>
    <div><div class="big">+${fmt(D.tarifaExtra/Math.max(1,ms.length))}/mês</div>
    <div class="tx">A partir de <b>15/07/2026</b> a taxa por item do TikTok sobe <b>R$4 → R$6</b> (e comissão de itens &lt;R$50 vai a 10%). No seu volume isso é <b>~${fmt(D.tarifaExtra/Math.max(1,ms.length))}/mês</b> de custo novo — <b>reprecificar antes</b>. <span style="color:var(--ink-48)">Itens ≥R$50 = ${pct(D.qtyGe*1,D.qty).toFixed(0)}% das peças.</span></div></div>
  </div>`:'';
  const chart=`<div class="sec"><div class="sec-h"><h2>Evolução</h2><div class="meta">faturamento vs liquidado · mês a mês</div></div><div class="chartwrap"><canvas id="evo-chart"></canvas></div></div>`;
  const high=`<div class="grid2">
    <div class="sec"><div class="sec-h"><h2>Produto-herói</h2></div><div style="font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700">${fmt(top.gmv)}</div><div style="font-size:13px;color:var(--ink-64);margin-top:4px">${top.n}</div><div style="font-size:12px;color:var(--ink-48);margin-top:8px">o produto que mais fatura no período</div></div>
    <div class="sec"><div class="sec-h"><h2>A recuperar</h2></div><div style="font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:${falt>0?'var(--amber)':'var(--green)'}">${fmt(falt)}</div><div style="font-size:13px;color:var(--ink-64);margin-top:4px">repasse faltante (recuperável)</div><div style="font-size:12px;color:var(--ink-48);margin-top:8px">${falt>0?'pedidos pagos sem settlement — ver aba A Receber':'TikTok está pagando certo 👍'}</div></div>
  </div>`;
  let funil;
  if(D.ofiHas){
    const mx=Math.max(D.gmvOficial,1), prodCanc=D.ofiProduto-D.ofiProdValido;
    funil=`<div class="sec"><div class="sec-h"><h2>Ponte de receita <span class="pill">bate c/ Seller Center</span></h2><div class="meta">do GMV oficial ao que importa pro lucro</div></div>
      ${cascRow('GMV oficial','= Seller Center · '+NUM.format(D.ofiN)+' pedidos pagos · por data',D.gmvOficial,'#2563eb',mx)}
      ${cascRow('− Frete pago pelo cliente','está no GMV oficial do TikTok, não é sua receita',-D.ofiFrete,'var(--orange)',mx)}
      ${cascRow('− Produto pago-e-cancelado','pago, depois cancelado — sai da base',-prodCanc,'var(--rhode-red)',mx)}
      ${cascRow('= GMV produto válido','base real de margem e lucro',D.ofiProdValido,'var(--green)',mx,'total')}
      <div class="note green" style="margin-top:14px"><span>✅</span><div>O <b>GMV oficial</b> vem da Orders API (o que o cliente pagou, <b>sem atraso de settlement</b>) e bate com o Seller Center (~0,1%). O <b>Liquidado</b> ${fmt(D.rp.liq||D.A.set)} é o que já caiu na conta — atrasa ~semanas, por isso o mês corrente fica abaixo do GMV.</div></div></div>`;
  } else {
    funil=`<div class="note"><span>🔎</span><div><b>3 níveis de receita:</b> <b>GMV bruto</b> ${fmt(D.gmv)} (todos pedidos, incl. cancelados) → <b>GMV válido</b> ${fmt(D.gmvVal)} (vendas reais, exclui ${fmt(D.cancV)} de cancelados · por data) → <b>Liquidado</b> ${fmt(D.rp.liq||D.A.set)} (o que já caiu — atrasa ~semanas). <i>Rode <span class="mono">pedido_pagamento.sql</span> + backfill pra ligar o GMV oficial (bate 1:1 c/ Seller Center).</i></div></div>`;
  }
  return k+funil+alert+chart+high;
}
function drawChart(){
  const c=document.getElementById('evo-chart'); if(!c||!window.Chart) return;
  if(CHART){ CHART.destroy(); CHART=null; }
  const labels=MESES.map(fmtMes);
  const anyOfi=Object.keys(OFI).length>0;
  const fat=MESES.map(m=>OFI[m]?+OFI[m].gmv_oficial||0:(GMV[m]?(GMV[m].gmv-(GMV[m].canc||0)):0));

  CHART=new Chart(c,{type:'bar',data:{labels,datasets:[

    {label:'Liquidado',data:liq,type:'line',borderColor:'#1a8f5a',backgroundColor:'#1a8f5a',tension:.3,pointRadius:3,order:1}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{family:'Inter'},usePointStyle:true,boxWidth:8}}},scales:{y:{ticks:{callback:v=>'R$ '+(v/1000)+'k',font:{family:'JetBrains Mono',size:10}},grid:{color:'#f1f1f4'}},x:{ticks:{font:{family:'JetBrains Mono',size:10}},grid:{display:false}}}}});
}

// ===== CONCILIAÇÃO (esperado × real) =====
function renderConciliacao(D,ms){
  const C=D.conc;
  if(!C.has) return `<div class="sec"><div class="empty">Rode <span class="mono">conciliacao_pedido.sql</span> (view v2) pra ligar a conciliação esperado×real.<br><small>Precisa do statement_tx itemizado (backfill).</small></div></div>`;
  const feeTot=C.com_real+C.serv_real+C.afi+C.ads, taxaEf=C.receita?feeTot/C.receita*100:0;
  const divCom=C.com_real-C.com_esp, descPct=C.tabela?C.desc/C.tabela*100:0, descPlatPct=C.tabela?C.desc_plat/C.tabela*100:0;
  const k=`<div class="kpis k6">
    ${kpi('Receita líquida',fmt(C.receita),NUM.format(C.n_total)+' pedidos','k6')}
    ${kpi('Taxa efetiva',taxaEf.toFixed(1)+'%','fee / receita','k6')}
    ${kpi('Repasse',fmt(C.repasse),'líquido recebido','k6 accent')}
    ${kpi('Comissão',fmt(C.com_real),'esp '+fmt(C.com_esp)+' · '+(divCom>=0?'+':'')+fmt(divCom),'k6')}
    ${kpi('A recuperar',fmt(C.faltante),NUM.format(C.n_falt)+' faltantes','k6')}
    ${kpi('Impacto 15/07',fmt(C.imp),feeTot?'+'+(C.imp/feeTot*100).toFixed(1)+'% no fee':'','k6 danger')}
  </div>`;
  const feeRow=(lbl,real,esp,note)=>{const dv=esp!=null?real-esp:null;
    const st=dv==null?'—':(Math.abs(dv)<=Math.max(2,esp*0.02)?'<span class="tag ok">ok</span>':(dv>0?'<span class="tag warn">+'+fmt(dv)+'</span>':'<span class="tag mut">'+fmt(dv)+'</span>'));
    return `<tr><td class="mp">${lbl}${note?'<br><small style="color:var(--ink-48);font-weight:400">'+note+'</small>':''}</td><td>${fmt(real)}</td><td>${esp!=null?fmt(esp):'—'}</td><td style="text-align:right">${st}</td></tr>`;};
  const casc=`<div class="sec"><div class="sec-h"><h2>Taxas: esperado × real <span class="pill">contratado TikTok BR</span></h2><div class="meta">${periodoLabel()}</div></div>
    <table><thead><tr><th>Componente</th><th>Real</th><th>Esperado</th><th style="text-align:right">Status</th></tr></thead><tbody>
    ${feeRow('Comissão plataforma',C.com_real,C.com_esp,'6% da receita líquida')}
    ${feeRow('Serviço + Frete grátis',C.serv_real,C.serv_esp,'6% + R$4/item')}
    ${feeRow('Comissão afiliada',C.afi,null,'taxa da creator (varia por produto)')}
    ${feeRow('Mídia GMV Max',C.ads,null,'custo de campanha')}
    ${feeRow('Frete líquido',C.fre,null,'')}
    </tbody></table>
    <div class="note green"><span>✅</span><div>A <b>comissão bate 6% ao centavo</b> (validado em 480+ pedidos). O "serviço+frete acima" é majoritariamente <b>frete não-subsidiado</b> que você absorve — custo real, a revisar caso a caso, não overcharge garantido.</div></div></div>`;
  const causa=(lbl,n,cor,val)=>`<div class="casc-row"><div class="casc-lbl">${lbl}${val!=null?'<small>'+fmt(val)+'</small>':''}</div><div class="casc-bar"><i style="width:${Math.min(100,n/Math.max(1,C.n_total)*100)}%;background:${cor}"></i></div><div class="casc-val">${NUM.format(n)}</div></div>`;
  const causas=`<div class="sec"><div class="sec-h"><h2>Conciliação por status</h2><div class="meta">${NUM.format(C.n_total)} pedidos</div></div>
    ${causa('✅ Conciliado (ok)',C.n_ok,'var(--green)')}
    ${causa('⚠️ Serviço/frete a revisar',C.n_serv,'var(--orange)',C.div_serv)}
    ${causa('↩️ Com devolução',C.n_dev,'#9a7030',C.custo_dev)}
    ${causa('🔺 Comissão acima',C.n_com,'var(--rhode-red)')}
    ${causa('🕐 Repasse faltante',C.n_falt,'var(--blue)',C.faltante)}
    ${causa('✖️ Cancelado',C.n_canc,'var(--ink-24)')}</div>`;
  const mx=Math.max(C.tabela,1);
  const promo=`<div class="grid2">
    <div class="sec"><div class="sec-h"><h2>Promoção — o que você banca</h2></div>
      ${cascRow('Preço de tabela','soma dos preços "de"',C.tabela,'#cbd5e1',mx)}
      ${cascRow('− Desconto do vendedor',descPct.toFixed(0)+'% · promo que você absorve',-C.desc,'var(--rhode-red)',mx)}
      ${cascRow('+ Subsídio TikTok',descPlatPct.toFixed(1)+'% · cupom que a plataforma banca e reembolsa',C.desc_plat,'var(--green)',mx)}
      ${cascRow('= Receita líquida','preço real de venda',C.receita,'var(--green)',mx,'total')}
      <div class="note" style="margin-top:12px"><span>🏷️</span><div>Você desconta <b>${descPct.toFixed(0)}%</b> do preço de tabela em promoção — define a base de <b>todas</b> as taxas, e o gatilho 15/07 usa o preço <b>pós-desconto</b>. O <b>subsídio TikTok</b> (<b>${fmt(C.desc_plat)}</b> no período) é cupom que a <b>plataforma</b> banca e te reembolsa — <b>não</b> sai do seu bolso.</div></div></div>
    <div class="sec"><div class="sec-h"><h2>Simulação tarifa 15/07</h2></div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:800;color:var(--rhode-red)">+${fmt(C.imp)}<span style="font-size:14px;color:var(--ink-48);font-weight:500">/mês</span></div>
      <div style="font-size:13px;color:var(--ink-64);margin-top:10px;line-height:1.5">Custo novo a partir de <b>15/07/2026</b>: comissão de itens &lt;R$50 sobe 6%→10%; taxa por item ≥R$50 sobe R$4→R$6. ${feeTot?'<b>+'+(C.imp/feeTot*100).toFixed(1)+'%</b> sobre o fee atual.':''}</div></div>
  </div>`;
  return k+casc+causas+promo+renderConcDrillShell();
}
function renderConcDrillShell(){
  return `<div class="sec"><div class="sec-h"><h2>Pedidos · conciliação linha a linha</h2>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <select id="conc-filtro" onchange="loadConcDrill()">
        <option value="">todos os status</option><option value="servico_revisar">serviço a revisar</option>
        <option value="comissao_acima">comissão acima</option><option value="com_devolucao">com devolução</option>
        <option value="repasse_faltante">repasse faltante</option><option value="ok">ok</option></select>
      <input class="search" id="conc-search" placeholder="order_id…" oninput="renderConcTable()"></div></div>
    <div id="conc-body"><div class="loading">Carregando pedidos…</div></div></div>`;
}
let CONCROWS=[];
async function loadConcDrill(){
  const ms=getMeses(), f=document.getElementById('conc-filtro')?document.getElementById('conc-filtro').value:'';
  let path='conciliacao_pedido?select=order_id,data,produto,qty,preco_tabela,desconto_pct,receita_liq,comissao_real,comissao_esperada,servico_frete_real,servico_frete_esperado,afiliada_real,ads_real,settlement,taxa_efetiva_pct,conciliacao&order=receita_liq.desc&limit=300';
  if(ms.length===1) path+=`&periodo=eq.${ms[0]}`; else if(ms.length) path+=`&periodo=in.(${ms.join(',')})`;
  if(f) path+=`&conciliacao=eq.${f}`;
  try{ const r=await admProxy('GET',path); CONCROWS=r.data||[]; renderConcTable(); }
  catch(e){ const b=document.getElementById('conc-body'); if(b) b.innerHTML=`<div class="empty">Rode <span class="mono">conciliacao_pedido.sql</span> pra ativar o drill.<br><small>${e.message}</small></div>`; }
}
function renderConcTable(){
  const b=document.getElementById('conc-body'); if(!b) return;
  const query=(document.getElementById('conc-search')?document.getElementById('conc-search').value:'').trim().toLowerCase();
  const rows=CONCROWS.filter(r=>!query||String(r.order_id).toLowerCase().includes(query));
  if(!rows.length){ b.innerHTML='<div class="empty">Nenhum pedido.</div>'; return; }
  const tag=c=>({ok:'<span class="tag ok">ok</span>',servico_revisar:'<span class="tag warn">serviço</span>',comissao_acima:'<span class="tag warn">comissão</span>',com_devolucao:'<span class="tag mut">devolução</span>',repasse_faltante:'<span class="tag mut">faltante</span>',cancelado:'<span class="tag mut">cancelado</span>'}[c]||c);
  b.innerHTML=`<div style="font-size:11.5px;color:var(--ink-48);margin-bottom:8px">${rows.length} pedidos · top 300 por receita · ${periodoLabel()}</div>
  <table><thead><tr><th>Pedido</th><th>Produto</th><th>Tabela</th><th>Desc%</th><th>Receita</th><th>Comissão</th><th>Serv/Frete</th><th>Repasse</th><th>Taxa</th><th>Status</th></tr></thead><tbody>
  ${rows.slice(0,200).map(r=>`<tr>
    <td class="mono" style="font-size:11px">${r.order_id}</td>
    <td class="mp" style="max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${(r.produto||'').replace(/"/g,'')}">${r.produto||'—'}</td>
    <td>${fmt(+r.preco_tabela||0)}</td><td>${r.desconto_pct!=null?(+r.desconto_pct).toFixed(0)+'%':'—'}</td>
    <td>${fmt(+r.receita_liq||0)}</td>
    <td title="esperado ${fmt(+r.comissao_esperada||0)}">${fmt(+r.comissao_real||0)}</td>
    <td title="esperado ${fmt(+r.servico_frete_esperado||0)}">${fmt(+r.servico_frete_real||0)}</td>
    <td>${fmt(+r.settlement||0)}</td><td>${r.taxa_efetiva_pct!=null?(+r.taxa_efetiva_pct).toFixed(0)+'%':'—'}</td>
    <td>${tag(r.conciliacao)}</td></tr>`).join('')}</tbody></table>`;
}

function renderRepasse(D,ms){
  const A=D.A, maxv=Math.max(A.rev,1), taxaPct=pct(Math.abs(A.fee),A.rev);
  const cascata=`<div class="sec"><div class="sec-h"><h2>Caminho do dinheiro</h2><div class="meta">${periodoLabel()} · base settlement</div></div>
    ${cascRow('Receita bruta','o que o TikTok reporta',A.rev,'#cbd5e1',maxv)}
    ${cascRow('− Taxa TikTok','comissão + serviço · '+taxaPct.toFixed(1)+'%',A.fee,'var(--rhode-red)',maxv)}
    ${cascRow('− Frete','custo de envio',A.ship,'var(--orange)',maxv)}
    ${cascRow('+ Ajustes','reembolsos/correções',A.adj,'var(--blue)',maxv)}
    ${cascRow('= Settlement','o que a loja recebe',A.set,'var(--green)',maxv,'total')}</div>`;
  let decomp='';
  if(D.rp.pagoLiq>0){
    const rp=D.rp, outros=Math.max(0,(rp.pagoLiq-rp.liq)-(rp.plat+rp.afi+rp.ads+rp.frete)), pc=v=>(v/rp.pagoLiq*100).toFixed(1)+'%';
    decomp=`<div class="sec"><div class="sec-h"><h2>Decomposição da taxa <span class="pill">real</span></h2><div class="meta">só pedidos liquidados · taxa ${D.rpTaxa.toFixed(1)}%</div></div>
    <div class="kpis"><div class="kpi"><div class="lbl">Liquidado</div><div class="val accent">${fmt(rp.liq)}</div><div class="foot">${NUM.format(rp.liqN)} pedidos</div></div>
      <div class="kpi"><div class="lbl">A receber</div><div class="val">${fmt(rp.rec)}</div><div class="foot">${NUM.format(rp.recN)} pendentes</div></div>
      <div class="kpi"><div class="lbl">Devolvido</div><div class="val danger">${fmt(rp.dev)}</div><div class="foot">${NUM.format(rp.devN)} pedidos</div></div>
      <div class="kpi"><div class="lbl">Taxa real</div><div class="val">${D.rpTaxa.toFixed(1)}%</div><div class="foot">pago→cash</div></div></div>
    <div class="lbl" style="margin:6px 0 8px">Pra onde vai a taxa (% do pago liquidado)</div>
    ${[['Comissão plataforma',rp.plat,'#94a3b8'],['Comissão afiliada',rp.afi,'var(--rhode-red)'],['Comissão ads-afil',rp.ads,'var(--orange)'],['Frete',rp.frete,'var(--blue)'],['Serviço/SFP + mídia GMV Max',outros,'#9a7030']].map(([l,v,c])=>`<div class="casc-row"><div class="casc-lbl">${l}</div><div class="casc-bar"><i style="width:${Math.min(100,v/rp.pagoLiq*100*3).toFixed(0)}%;background:${c}"></i></div><div class="casc-val neg">${fmt(v)} · ${pc(v)}</div></div>`).join('')}</div>`;
  } else decomp=`<div class="sec"><div class="empty">Rode <span class="mono">statement_tx_resumo.sql</span> pra ver a decomposição exata.</div></div>`;
  const rows=MESES.map(m=>{const f=FIN[m]||{rev:0,fee:0,ship:0,set:0};const g=GMV[m]||{gmv:0};const s=STX[m];const tx=s&&s.pago_liq?(1-s.settle_liq/s.pago_liq)*100:pct(Math.abs(f.fee),f.rev);
    return `<tr><td class="mp">${fmtMes(m)}</td><td>${g.gmv?fmt(g.gmv-(g.canc||0)):'—'}</td><td>${s?fmt(s.settle_liq):fmt(f.set)}</td><td class="neg">${fmt(f.fee)}</td><td>${tx.toFixed(1)}%</td></tr>`;}).join('');
  const trend=`<div class="sec"><div class="sec-h"><h2>Tendência mensal</h2></div><table><thead><tr><th>Mês</th><th>GMV válido</th><th>Liquidado</th><th>Taxa TT</th><th>Taxa real</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  const nota=`<div class="note"><span>🕐</span><div><b>Dois relógios:</b> faturamento conta pela <b>data da venda</b>; liquidado pela <b>data que o dinheiro caiu</b> (atrasa ~semanas). A conciliação casa os dois ao longo do tempo.</div></div>`;
  return cascata+decomp+trend+nota;
}

// ===== A RECEBER =====
function renderReceber(D){
  const ms=getMeses();
  const dvSel=DIV.filter(d=>FILTER.modo==='tudo'||ms.includes(d.periodo));
  const a={repasse_faltante:{n:0,v:0},pendente:{n:0,v:0},cancelado:{n:0,v:0}};
  dvSel.forEach(d=>{const c=a[d.classe]; if(c){c.n++;c.v+=+d.pago||0;}});
  if(!DIV.length) return `<div class="sec"><div class="empty">Rode <span class="mono">repasse_divergencias.sql</span> pra ativar a auditoria de divergências.</div></div>`;
  const falt=dvSel.filter(d=>d.classe==='repasse_faltante').sort((x,y)=>(+y.pago||0)-(+x.pago||0)).slice(0,30);
  const rows=falt.map((d,i)=>`<tr><td>${i+1}</td><td class="mp">${d.data||'—'}</td><td class="mp" style="max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${(d.produto||'').replace(/"/g,'')}">${d.produto||'—'}</td><td><span class="tag mut">${d.status||'?'}</span></td><td style="font-weight:700">${fmt(+d.pago||0)}</td></tr>`).join('');
  return `<div class="kpis">
    ${kpi('Repasse faltante',fmt(a.repasse_faltante.v),a.repasse_faltante.n+' ped · RECUPERÁVEL','accent')}
    ${kpi('Pendente',fmt(a.pendente.v),a.pendente.n+' ped · a cair')}
    ${kpi('Cancelado',fmt(a.cancelado.v),a.cancelado.n+' ped · esperado')}
    ${kpi('Total a receber',fmt(a.repasse_faltante.v+a.pendente.v+a.cancelado.v),'pago sem settlement')}
  </div>
  <div class="sec"><div class="sec-h"><h2>Pedidos a recuperar <span class="pill">abrir chamado</span></h2><div class="meta">pago, antigo (>30d), não cancelado</div></div>
  ${rows?`<table><thead><tr><th>#</th><th>Data</th><th>Produto</th><th>Status</th><th>Pago</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">Nenhum repasse faltante no período. 👍 O TikTok está pagando certo.</div>'}</div>
  <div class="note green"><span>✅</span><div><b>Auditoria de comissão:</b> comissão de plataforma cobrada = <b>~6,2%</b>, batendo os <b>6% contratados</b>. Sem cobrança a mais. A maior parte do "a receber" é cancelamento (dinheiro volta), não dinheiro sumido.</div></div>`;
}

// ===== PRODUTOS =====
function renderProdutos(D){
  const margList=Object.entries(D.margAgg).map(([n,v])=>{const contrib=v.gmvCpv-v.custo, liq=v.gmvCpv*D.eficFrac-v.custo; return {n,gmv:v.gmv,gmvCpv:v.gmvCpv,qty:v.qty,custo:v.custo,contrib,liq,liqPct:v.gmvCpv?liq/v.gmvCpv*100:0};}).filter(x=>x.gmv>0).sort((a,b)=>b.liq-a.liq);
  const margPct=D.mGmvCpv?D.mLiq/D.mGmvCpv*100:0, contribPct=D.mGmvCpv?D.mContrib/D.mGmvCpv*100:0;
  const k=`<div class="kpis">
    ${kpi('GMV c/ CPV',fmt(D.mGmvCpv),'cobertura '+D.cobertura.toFixed(1)+'%')}
    ${kpi('Margem contribuição',fmt(D.mContrib),contribPct.toFixed(1)+'% · GMV−CPV')}
    ${kpi('Margem líquida',fmt(D.mLiq),margPct.toFixed(1)+'% · líq. de fee+ads','accent')}
    ${kpi('Eficiência',(D.eficFrac*100).toFixed(1)+'%',D.eficExata?'REAL · liquidado/pago':'estimada')}
  </div>
  <div class="sec"><div class="sec-h"><h2>Margem por produto</h2><div class="meta">${periodoLabel()} · ${margList.length} produtos</div></div>
  <table><thead><tr><th>Produto</th><th>Qtd</th><th>GMV</th><th>Custo CPV</th><th>Contrib.</th><th>Líq.</th><th>Líq.%</th></tr></thead>
  <tbody>${margList.slice(0,30).map((x,i)=>`<tr><td class="mp" style="max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${x.n.replace(/"/g,'')}">${i+1}. ${x.n}</td><td>${NUM.format(x.qty)}</td><td>${fmt(x.gmvCpv)}</td><td class="neg">${fmt(x.custo)}</td><td>${fmt(x.contrib)}</td><td style="font-weight:700;color:${x.liq>=0?'var(--green)':'var(--rhode-red)'}">${fmt(x.liq)}</td><td>${x.liqPct.toFixed(1)}%</td></tr>`).join('')}</tbody></table></div>
  <div class="note green"><span>📦</span><div><b>Contribuição</b> = GMV − CPV (exata). <b>Líquida</b> = GMV × eficiência real (${(D.eficFrac*100).toFixed(1)}%) − CPV — já líquida de fee, afiliada e GMV Max. Cobertura de CPV: ${D.cobertura.toFixed(1)}% do GMV.</div></div>`;
  return k;
}

// Simulador de desconto → breakeven (dash de live). Atualiza só os outputs (sem re-render, pros sliders ficarem suaves).
function simLive(){
  const box=document.getElementById('sim-box'); if(!box) return;
  const taxa=+box.dataset.taxa||0, midia=+box.dataset.midia||0, iv=+box.dataset.iv||0, k=taxa+midia+iv;
  const gv=id=>{const e=document.getElementById(id); return e?(+e.value||0):0;};

  const venda=tab*(1-d), lucro=venda-cpv-venda*k, marg=venda>0?lucro/venda*100:0;
  const be=(tab>0&&(1-k)>0)?(1-cpv/(tab*(1-k))):0, folga=(be-d)*100;
  const set=(id,t,c)=>{const e=document.getElementById(id); if(e){e.textContent=t; if(c!==undefined)e.style.color=c;}};
  const sc=v=>Math.max(0,Math.min(100,v/0.7)); // desconto% (0–70) → largura% (0–100)
  set('sim-desc-v',(d*100).toFixed(0)+'%');
  set('sim-out-venda','R$ '+venda.toFixed(2));
  set('sim-out-lucro','R$ '+lucro.toFixed(2), lucro>=0?'var(--green)':'var(--rhode-red)');
  set('sim-out-marg',marg.toFixed(1)+'%', lucro>=0?'var(--ink)':'var(--rhode-red)');
  set('sim-out-be',(be*100).toFixed(0)+'%');
  set('sim-out-folga',(folga>=0?'+':'')+folga.toFixed(0)+' pts', folga>=0?'var(--green)':'var(--rhode-red)');
  const bar=document.getElementById('sim-bar'); if(bar){const b=sc(be*100); bar.style.background=`linear-gradient(90deg,#7fc9a3 0 ${b}%,#FE2C55 ${b}% 100%)`;}
  const mk=document.getElementById('sim-marker'); if(mk) mk.style.left=sc(d*100)+'%';
}
// ---- núcleo de LIVE — fonte da verdade: Seller Center Livestream "Attributed GMV" (live_attr); fallback GMV Max (live_sessao) ----
function liveAgg(ms, D){
  const inP=r=>(FILTER.modo==='range'&&FILTER.de&&FILTER.ate)?(r.data>=FILTER.de&&r.data<=FILTER.ate):ms.includes(r.periodo);
  const attr=LIVEATTR.filter(inP);
  const gmS=LIVESES.filter(inP), propGM=gmS.filter(r=>r.origem==='propria'), creGM=gmS.filter(r=>r.origem==='creator');
  const invest=propGM.reduce((s,r)=>s+(+r.cost||0),0);   // mídia da live própria (GMV Max)
  const creator={gmv:creGM.reduce((s,r)=>s+(+r.receita||0),0),cost:creGM.reduce((s,r)=>s+(+r.cost||0),0),ped:creGM.reduce((s,r)=>s+(+r.pedidos||0),0)};
  let gmvLoja=0,gmvLiveTot=0; ms.forEach(m=>{const p=LIVEPER[m]; if(p){gmvLoja+=+p.gmv_loja||0; gmvLiveTot+=+p.gmv_live||0;}});
  let src,sessions;
  if(attr.length){
    src='sc';
    sessions=attr.map(r=>({name:r.titulo||('Sala '+r.room_id),data:r.data,inicio:r.inicio,gmv:+r.gmv||0,ped:+r.pedidos||0,views:+r.views||0,cust:+r.customers||0,aov:+r.aov||0}));
  }else{
    src='gmvmax';
    sessions=propGM.map(r=>({name:r.campanha||('Sala '+r.room_id),data:r.data,inicio:r.data,gmv:+r.receita||0,ped:+r.pedidos||0,views:+r.views||0,cust:0,aov:(+r.pedidos?(+r.receita/+r.pedidos):0)}));
  }
  const gmv=sessions.reduce((s,r)=>s+r.gmv,0), ped=sessions.reduce((s,r)=>s+r.ped,0), views=sessions.reduce((s,r)=>s+r.views,0), cust=sessions.reduce((s,r)=>s+r.cust,0);
  // ROI real — cascata da loja aplicada ao GMV de live
  const cpvPct=D.mGmvCpv>0?D.mCusto/D.mGmvCpv:0.58, G=gmv;
  const taxas=G*(1-D.eficFrac), cpv=G*cpvPct, mLiq=G*D.eficFrac-cpv, impV=G*(TX_VENDA+TX_ICMS)/100;
  const lucroAntesIR=mLiq-impV-invest, impIR=lucroAntesIR>0?lucroAntesIR*TX_IR/100:0, lucro=lucroAntesIR-impIR;
  // Itemização REAL das taxas (settlement do período, via D.rp) — a soma reconcilia com o total
  // (1-eficFrac) que bate com o settlement. Comissão de afiliada aparece EXPLÍCITA; serviço/frete
  // grátis é o resíduo pra fechar. base = receita paga (pago_liq).
  const feeBase=(D.rp&&D.rp.pagoLiq>0)?D.rp.pagoLiq:0;
  const rt=k=>feeBase>0?(+D.rp[k]||0)/feeBase:0;
  const pPlat=rt('plat'), pAfi=rt('afi')+rt('ads'), pFrete=rt('frete');
  const pServ=Math.max(0,(1-D.eficFrac)-pPlat-pAfi-pFrete);
  const feeItem=feeBase>0?{plat:G*pPlat,serv:G*pServ,afi:G*pAfi,frete:G*pFrete,pPlat,pServ,pAfi,pFrete}:null;
  // VISÃO INCREMENTAL — a mídia se paga? GMV que os ads puxaram (GMV Max gross_revenue) ×
  // taxa de contribuição (eficiência − CPV) vs o gasto de mídia. Não aloca imposto nem custo do orgânico.
  const adsGmv=propGM.reduce((s,r)=>s+(+r.receita||0),0);
  const contribRate=Math.max(0,D.eficFrac-cpvPct), contribGer=adsGmv*contribRate, contribLiq=contribGer-invest, retMidia=invest?contribGer/invest:0, roasAds=invest?adsGmv/invest:0;
  const roas=invest?G/invest:0, roiReal=invest?lucro/invest*100:0, margem=G?lucro/G*100:0, convVw=views?ped/views*100:0, ticket=ped?G/ped:0, cpa=ped?invest/ped:0;
  return {src,sessions,gmv,ped,views,cust,invest,creator,gmvLoja,gmvLiveTot,cpvPct,taxas,cpv,mLiq,impV,impIR,lucro,roas,roiReal,margem,convVw,ticket,cpa,feeItem,adsGmv,contribRate,contribGer,contribLiq,retMidia,roasAds};
}

  const camps=Object.values(byc).map(c=>({...c,roas:c.cost?c.receita/c.cost:0,cpa:c.pedidos?c.cost/c.pedidos:0,ticket:c.pedidos?c.receita/c.pedidos:0})).filter(c=>c.cost>0||c.receita>0).sort((a,b)=>b.cost-a.cost);
  const T=camps.reduce((s,c)=>({cost:s.cost+c.cost,receita:s.receita+c.receita,pedidos:s.pedidos+c.pedidos}),{cost:0,receita:0,pedidos:0});
  const roas=T.cost?T.receita/T.cost:0, cpa=T.pedidos?T.cost/T.pedidos:0, ticket=T.pedidos?T.receita/T.pedidos:0, adGmvPct=D.gmvAll?T.cost/D.gmvAll*100:0;

  const model=m=>camps.filter(c=>c.modelo===m).reduce((s,c)=>({cost:s.cost+c.cost,receita:s.receita+c.receita,pedidos:s.pedidos+c.pedidos}),{cost:0,receita:0,pedidos:0});
  const trad=model('tradicional'), vl=model('vendas_liquidas');
  const mrow=(nome,m)=>`<tr><td class="mp">${nome}</td><td class="neg">${fmt(m.cost)}</td><td>${T.cost?(m.cost/T.cost*100).toFixed(0):0}%</td><td>${fmt(m.receita)}</td><td style="font-weight:700;color:var(--green)">${m.cost?(m.receita/m.cost).toFixed(2):'—'}x</td><td>${NUM.format(m.pedidos)}</td><td>${fmt2(m.pedidos?m.cost/m.pedidos:0)}</td></tr>`;
  const split=`<div class="sec"><div class="sec-h"><h2>Por modelo de cobrança</h2><div class="meta">Receita bruta (conta de ads) × Vendas líquidas (pay-with-GMV)</div></div>

    ${trad.cost>0?mrow('Receita bruta (tradicional)',trad):''}${vl.cost>0?mrow('Vendas líquidas (pay-with-GMV)',vl):''}</tbody></table></div>`;
  const clip='max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
  const tbl=`<div class="sec"><div class="sec-h"><h2>Campanhas · detalhado</h2><div class="meta">${periodoLabel()} · ${camps.length} campanhas · por investimento</div></div>
    <table><thead><tr><th>Campanha</th><th>Modelo</th><th>Investimento</th><th>%</th><th>Receita</th><th>ROAS</th><th>Pedidos</th><th>CPA</th><th>Ticket</th></tr></thead><tbody>

      <td class="neg">${fmt(c.cost)}</td><td>${T.cost?(c.cost/T.cost*100).toFixed(0):0}%</td>
      <td>${fmt(c.receita)}</td><td style="font-weight:700;color:${c.roas>=3?'var(--green)':(c.roas>=1.5?'var(--orange)':'var(--rhode-red)')}">${c.roas.toFixed(2)}x</td>
      <td>${NUM.format(c.pedidos)}</td><td>${fmt2(c.cpa)}</td><td>${fmt2(c.ticket)}</td></tr>`).join('')}
    </tbody></table></div>`;
  const note=`<div class="note"><span>ℹ️</span><div><b>ROAS</b> = receita ÷ investimento · <b>CPA</b> = investimento ÷ pedidos · <b>Ticket</b> = receita ÷ pedidos. <b>VL</b> (Vendas Líquidas) = a TikTok banca e recupera do seu GMV (roda sem saldo); <b>bruta</b> (Receita bruta) = pago na conta de ads. Fonte: Business API — bate ao centavo com o Seller Center. Investimento = ${adGmvPct.toFixed(1)}% do GMV.</div></div>`;
  // 📺 Lives (própria Rhode + creators) — classifica por nome ("LIVE" / "Rhode")

  const sumc=arr=>arr.reduce((s,c)=>({cost:s.cost+c.cost,receita:s.receita+c.receita,pedidos:s.pedidos+c.pedidos}),{cost:0,receita:0,pedidos:0});
  const lives=camps.filter(isLive).sort((a,b)=>b.cost-a.cost);
  const Lv=sumc(lives), Lp=sumc(lives.filter(isProp)), Lc=sumc(lives.filter(c=>!isProp(c)));
  const liveSec = lives.length ? `<div class="sec"><div class="sec-h"><h2>📺 Lives · GMV Max</h2><div class="meta">${periodoLabel()} · live própria (Rhode) + lives de creators</div></div>

    <div class="note"><span>📺</span><div><b>Live própria (Rhode Jeans):</b> invest. ${fmt(Lp.cost)} · GMV ${fmt(Lp.receita)} · ROAS ${(Lp.cost?Lp.receita/Lp.cost:0).toFixed(1)}x. &nbsp;<b>Lives de creators:</b> invest. ${fmt(Lc.cost)} · GMV ${fmt(Lc.receita)} · ROAS ${(Lc.cost?Lc.receita/Lc.cost:0).toFixed(1)}x. <i>Classificação por nome — me diz se alguma campanha ficou no balde errado.</i></div></div></div>` : '';
  return syncBar+k+split+liveSec+tbl+note;
}
async function syncAdsCusto(file){
  if(!file) return;
  const msg=document.getElementById('ads-sync-msg'), set=(t,c)=>{if(msg){msg.textContent=t;msg.style.color=c||'var(--ink-48)';}};
  if(!window.XLSX){ set('biblioteca carregando — tente de novo','var(--orange)'); return; }
  set('lendo '+file.name+'…');
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true});
    const hdr=(aoa[0]||[]).map(h=>String(h==null?'':h).toLowerCase());
    const col=(...ks)=>hdr.findIndex(h=>ks.some(k=>h.includes(k)));
    const ci={dia:col('por dia','dia'),custo:col('custo do gmv','custo do gmv máximo'),rec:col('receita'),ped:col('pedidos de sku','pedidos'),roi:hdr.indexOf('roi')};
    if(ci.custo<0){ set('não achei "Custo do GMV máximo" — é o "Campaign overview data"?','var(--rhode-red)'); return; }
    const num=x=>{ if(typeof x==='number') return x; if(x==null) return 0; let s=String(x).trim().replace(/[^\d,.-]/g,''); if(s.includes(',')&&s.includes('.')) s=s.replace(/\./g,'').replace(',','.'); else if(s.includes(',')) s=s.replace(',','.'); return parseFloat(s)||0; };
    const rows=[];
    for(let i=1;i<aoa.length;i++){
      const r=aoa[i]; if(!r) continue; const d=r[ci.dia]; if(d==null||String(d).includes('Total')) continue;
      let dt=null; if(d instanceof Date) dt=d; else { const m=String(d).match(/(\d{4})-(\d{2})-(\d{2})/); if(m) dt=new Date(Date.UTC(+m[1],+m[2]-1,+m[3])); }
      if(!dt||isNaN(dt.getTime())) continue;
      const iso=dt.toISOString().slice(0,10);
      rows.push({id:iso,data:iso,periodo:iso.slice(0,7),custo:Math.round(num(r[ci.custo])*100)/100,receita:ci.rec>=0?Math.round(num(r[ci.rec])*100)/100:0,pedidos:Math.round(ci.ped>=0?num(r[ci.ped]):0),roi:ci.roi>=0?Math.round(num(r[ci.roi])*100)/100:0});
    }
    if(!rows.length){ set('nenhuma linha de custo encontrada','var(--rhode-red)'); return; }
    set('enviando '+rows.length+' dias…');
    await admProxy('POST','ads_custo?on_conflict=id',{body:rows,prefer:'resolution=merge-duplicates,return=minimal'});
    const tot=rows.reduce((s,x)=>s+x.custo,0);
    alert('✓ '+rows.length+' dias importados · custo R$ '+Math.round(tot).toLocaleString('pt-BR')+'. Atualizando o painel.');
    await load();
  }catch(e){ set('erro: '+e.message,'var(--rhode-red)'); }
}

  const head=`<div class="sec"><div class="sec-h"><h2>Liquidação por Cor × Canal <span class="pill">settlement real</span></h2>
    <div class="meta">${periodoLabel()} · a cor/lavagem mora no SKU (REF), não no nome do anúncio · liquidação = repasse real por pedido (comissão de afiliada já embutida)</div></div>${hero}</div>`;
  const secs=['Wide Leg','Mom','Baggy'].filter(c=>A[c]).map(cut=>{
    const C=A[cut];
    const cors=Object.keys(C).map(cor=>({cor,hero:C[cor].hero,ch:C[cor].ch,T:C[cor].ch['TOTAL']||{pecas:0,liq:0,settle:0,gmv:0,cpv:0}}))
      .filter(x=>x.T.pecas>=8).sort((a,b)=>b.T.pecas-a.T.pecas);
    const tot=cors.reduce((s,x)=>s+x.T.pecas,0)||1;

// Devolução e ruptura vêm de devolucoes / pedidos_sku.cancel_reason.
let PSKU={ped:[],dev:[]};
const PSKU_COM=0.06, PSKU_SRV=0.06, PSKU_ITEM=4, PSKU_AFI=0.0426;   // afiliada = média jun (3,22/75,60); varia por SKU
const DEV_VALIDO=new Set(['RETURN_OR_REFUND_REQUEST_COMPLETE','BUYER_SHIPPED_ITEM','AWAITING_BUYER_SHIP']);
function renderPskuShell(){ return `<div id="psku-body"><div class="sec"><div class="loading">Carregando P&L por SKU × tamanho…</div></div></div>`; }
function skuSplit(ss){ const m=/^(REF\d{3})(\d{2})$/.exec((ss||'').trim().toUpperCase()); return m?{ref:m[1],tam:m[2]}:{ref:(ss||'').toUpperCase()||'—',tam:'?'}; }
function pskuNextMonth(m){ const [y,mo]=m.split('-').map(Number); return mo>=12?`${y+1}-01`:`${y}-${String(mo+1).padStart(2,'0')}`; }
async function loadPsku(){
  const ms=getMeses(); const body=document.getElementById('psku-body'); if(!body) return;
  if(!ms.length){ body.innerHTML='<div class="sec"><div class="empty">Sem período selecionado.</div></div>'; return; }
  const inClause = ms.length===1?`periodo=eq.${ms[0]}`:`periodo=in.(${ms.join(',')})`;
  const de=ms[0]+'-01', ate=pskuNextMonth(ms[ms.length-1])+'-01';   // devolucoes filtra por data (não tem periodo)
  try{
    const [ped,dev]=await Promise.all([
      admProxy('GET',`pedidos_sku?select=seller_sku,qty,gmv,status,cancel_reason&${inClause}`,{paged:true}),
      admProxy('GET',`devolucoes?select=seller_sku,refund_item,return_reason,return_status&data=gte.${de}&data=lt.${ate}`,{paged:true})
    ]);
    PSKU.ped=ped.data||[]; PSKU.dev=dev.data||[]; renderPskuBody();
  }catch(e){ body.innerHTML=`<div class="sec"><div class="empty">Rode <span class="mono">sql/pedidos_cancel_reason.sql</span> e o backfill de <span class="mono">coletar_pedidos_sku.py</span> pra ativar esta lente.<br><small>${e.message}</small></div></div>`; }
}
function renderPskuBody(){
  const body=document.getElementById('psku-body'); if(!body) return;
  const ms=getMeses(), nMes=Math.max(1,ms.length), tax=(TX_VENDA+TX_ICMS)/100;
  if(!PSKU.ped.length){ body.innerHTML='<div class="sec"><div class="empty">Sem pedidos no período.</div></div>'; return; }
  // agrega vendas/cancelamento por (ref,tam)
  const A={};
  const cell=(ref,tam)=>{ const k=ref+'|'+tam; return A[k]||(A[k]={ref,tam,ss:ref+tam,q:0,gmv:0,cancq:0,ruptq:0,ruptgmv:0,devn:0,devr:0,fit:0}); };
  PSKU.ped.forEach(r=>{ const {ref,tam}=skuSplit(r.seller_sku), c=cell(ref,tam), q=+r.qty||0, g=+r.gmv||0;
    if(/CANCEL/i.test(r.status||'')){ c.cancq+=q; if(/fora de estoque/i.test(r.cancel_reason||'')){ c.ruptq+=q; c.ruptgmv+=g; } return; }
    c.q+=q; c.gmv+=g; });
  // devoluções por (ref,tam) — só status válido (exclui cancelada pelo comprador)
  const reasons={};
  PSKU.dev.forEach(r=>{ if(!DEV_VALIDO.has(r.return_status))return; const {ref,tam}=skuSplit(r.seller_sku), c=cell(ref,tam);
    c.devn++; c.devr+=+r.refund_item||0; if(/fit/i.test(r.return_reason||''))c.fit++;
    const rk=r.return_reason||'(sem motivo)'; reasons[rk]=(reasons[rk]||0)+1; });
  // calcula P&L por linha — TODAS as células (KPIs somam tudo; a tabela detalha q>=20)
  const all=Object.values(A).map(c=>{
    const preco=c.q?c.gmv/c.q:0, cpv=CPVMAP[c.ss]!=null?CPVMAP[c.ss]:null;
    const fees=preco*PSKU_COM + (preco*PSKU_SRV+PSKU_ITEM) + preco*PSKU_AFI + preco*tax;
    const marg=cpv!=null?preco-fees-cpv:null;
    const devTax=c.q?c.devn/c.q:0, margAdj=marg!=null?marg*(1-devTax):null;
    return {...c,preco,cpv,marg,devTax,margAdj,margTot:margAdj!=null?margAdj*c.q:null};
  });
  const rows=all.filter(c=>c.q>=20);                 // detalhe: só células com volume
  const T=all.reduce((s,r)=>{s.q+=r.q;s.gmv+=r.gmv;s.devn+=r.devn;s.devr+=r.devr;s.fit+=r.fit;s.rupt+=r.ruptgmv;s.ruptq+=r.ruptq;
    if(r.margTot!=null){s.marg+=r.margTot;s.qCpv+=r.q;} return s;},{q:0,gmv:0,devn:0,devr:0,fit:0,rupt:0,ruptq:0,marg:0,qCpv:0});
  const covCpv=T.q?T.qCpv/T.q*100:0;                 // cobertura de CPV (peças com custo conhecido)
  // reembolso da parcela "não serviu" (modelagem)
  const fitRefund=PSKU.dev.filter(r=>DEV_VALIDO.has(r.return_status)&&/fit/i.test(r.return_reason||'')).reduce((s,r)=>s+(+r.refund_item||0),0);
  const devTaxG=T.q?T.devn/T.q*100:0;

  const kpis=`<div class="kpis">
    ${kpi('Peças vendidas',NUM.format(T.q),periodoLabel()+' · exclui cancelados','k6')}
    ${kpi('Taxa de devolução',devTaxG.toFixed(1)+'%',NUM.format(T.devn)+' devoluções válidas','k6 '+(devTaxG>=15?'accent':''))}
    ${kpi('GMV devolvido · não serviu',fmt(fitRefund/nMes)+(nMes>1?'/mês':''),(T.devn?pct(T.fit,T.devn).toFixed(0):0)+'% das devoluções = modelagem','k6 accent')}
    ${kpi('Margem contribuição',fmt(T.marg/nMes)+(nMes>1?'/mês':''),'pós fee+afiliada+CPV+imposto '+(TX_VENDA+TX_ICMS).toFixed(1)+'% · cobertura CPV '+covCpv.toFixed(0)+'%','k6')}
  </div>`;

  // ---- devolução por TAMANHO (a grade quebra no topo) ----
  const byTam={}; rows.forEach(r=>{ const t=byTam[r.tam]||(byTam[r.tam]={q:0,dev:0,fit:0,devr:0}); t.q+=r.q;t.dev+=r.devn;t.fit+=r.fit;t.devr+=r.devr; });
  const tamRows=Object.entries(byTam).filter(([t])=>t!=='?').sort((a,b)=>a[0].localeCompare(b[0])).map(([t,v])=>{
    const tx=v.q?v.dev/v.q*100:0, fitp=v.dev?v.fit/v.dev*100:0, hot=tx>=18;
    return `<tr style="${hot?'background:rgba(220,50,50,.06)':''}"><td class="mp" style="${hot?'font-weight:700':''}">${t}${hot?' ◀':''}</td>
      <td>${NUM.format(v.q)}</td><td>${v.dev}</td><td style="font-weight:600;color:${hot?'var(--rhode-red)':'inherit'}">${tx.toFixed(1)}%</td>
      <td>${fitp.toFixed(0)}%</td><td>${fmt(v.devr)}</td></tr>`; }).join('');
  const tamSec=`<div class="sec"><div class="sec-h"><h2>Devolução por tamanho <span class="pill">a grade de modelagem</span></h2>
    <div class="meta">taxa = devoluções ÷ peças vendidas · “não serviu” = motivo <i>Item doesn't fit</i></div></div>
    <div style="overflow-x:auto"><table><thead><tr><th>Tam</th><th>Peças</th><th>Devol.</th><th>Taxa</th><th>% não serviu</th><th>Reembolso</th></tr></thead><tbody>${tamRows}</tbody></table></div></div>`;

  // ---- P&L detalhado por SKU × tamanho (pior margem primeiro = acionável) ----
  const det=rows.slice().sort((a,b)=>(a.margTot==null?1:b.margTot==null?-1:a.margTot-b.margTot));
  const detRows=det.map(r=>{
    const devHot=r.devTax>=0.20; const noCpv=r.cpv==null;
    return `<tr><td class="mp">${r.ref}</td><td>${r.tam}</td><td>${NUM.format(r.q)}</td><td>${fmt2(r.preco)}</td>
      <td style="${devHot?'color:var(--rhode-red);font-weight:600':''}">${(r.devTax*100).toFixed(1)}%</td>
      <td>${noCpv?'<span class="tag mut">s/ CPV</span>':fmt2(r.cpv)}</td>
      <td>${r.marg!=null?fmt2(r.marg):'—'}</td>
      <td style="font-weight:600">${r.margAdj!=null?fmt2(r.margAdj):'—'}</td>
      <td style="font-weight:600;color:${r.margTot!=null&&r.margTot<0?'var(--rhode-red)':'inherit'}">${r.margTot!=null?fmt(r.margTot):'—'}</td>
      <td>${r.ruptq?NUM.format(r.ruptq):'—'}</td></tr>`; }).join('');
  const detSec=`<div class="sec"><div class="sec-h"><h2>P&L por SKU × tamanho</h2>
    <div class="meta">margem = preço − comissão 6% − serviço 6%+R$4 − afiliada ${(PSKU_AFI*100).toFixed(1)}% − CPV − imposto ${(TX_VENDA+TX_ICMS).toFixed(1)}% · <b>ajustada</b> = ×(1−devolução) · ordenado por margem total (pior primeiro)</div></div>
    <div style="overflow-x:auto"><table><thead><tr><th>REF</th><th>Tam</th><th>Peças</th><th>Preço/pç</th><th>Dev%</th><th>CPV</th><th>Margem/pç</th><th>Ajust./pç</th><th>Margem total</th><th>Ruptura pç</th></tr></thead><tbody>${detRows}</tbody></table></div></div>`;

  // ---- motivos de devolução (com números) ----
  const rTot=Object.values(reasons).reduce((s,n)=>s+n,0)||1;
  const motRows=Object.entries(reasons).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,n])=>
    `<tr><td>${k}</td><td>${n}</td><td>${(n/rTot*100).toFixed(1)}%</td></tr>`).join('');
  const motSec=`<div class="sec"><div class="sec-h"><h2>Motivos de devolução</h2><div class="meta">${NUM.format(rTot)} devoluções válidas no período</div></div>
    <div style="overflow-x:auto"><table><thead><tr><th>Motivo</th><th>Qtd</th><th>%</th></tr></thead><tbody>${motRows}</tbody></table></div></div>`;

  const note=`<div class="note"><span>🎯</span><div>A frase pro Lucas/Júnior: <b>${(T.devn?pct(T.fit,T.devn).toFixed(0):0)}% das devoluções são “não serviu”</b> (${fmt(fitRefund/nMes)}${nMes>1?'/mês':''} de GMV devolvido) — é <b>modelagem</b>, não marketing. O tamanho <b>46</b> devolve muito mais que o <b>36</b>. <b>Ruptura</b> (fora de estoque) somou só ${fmt(T.rupt/nMes)}${nMes>1?'/mês':''} — não é o problema.<br>
    <span style="opacity:.75">A peça devolvida <b>volta ao estoque</b> e pode ser revendida — o custo puro é logística reversa + remarcação, menor que o GMV devolvido. “Margem ajustada” assume, de forma conservadora, contribuição ≈ 0 na peça devolvida. Imposto usa TX_VENDA+TX_ICMS (edite na aba Lucro; ICMS ainda a confirmar).</span></div></div>`;

  body.innerHTML=kpis+tamSec+detSec+motSec+note;
}

}
async function exportRelatorio(){
  if(!window.XLSX){ alert('Biblioteca de exportação ainda carregando — tente de novo em 2s.'); return; }
  const btn=document.getElementById('btn-export'), orig=btn?btn.textContent:'';
  if(btn){ btn.textContent='Gerando…'; btn.disabled=true; }
  const B=v=>Math.round((+v||0)*100)/100;
  try{
    const ms=getMeses(), D=agg(ms), C=D.conc, feeTot=C.com_real+C.serv_real+C.afi+C.ads;
    // export CONTEXTUAL por aba
    if(TAB==='lives'){ exportLivesHTML(); return; }
    if(TAB==='ads'){ exportAdsXLSX(ms, D, B); return; }
    const wb=XLSX.utils.book_new();
    // 1) RESUMO EXECUTIVO
    const s1=[['RELATÓRIO DE CONCILIAÇÃO — RHODE'],['Período',periodoLabel()],['Gerado em',new Date().toLocaleString('pt-BR')],[],
      ['RECEITA & REPASSE','R$'],
      ['GMV oficial (Seller Center)',B(D.gmvOficial||D.faturamento)],['GMV bruto (todos pedidos)',B(D.gmv)],
      ['Receita líquida (base das taxas)',B(C.receita)],['Repasse líquido (settlement)',B(C.repasse)],
      ['Taxa efetiva (% da receita)',C.receita?B(feeTot/C.receita*100):0],[],
      ['PROMOÇÃO','R$'],
      ['Preço de tabela',B(C.tabela)],['Desconto do vendedor (você banca)',B(C.desc)],['% desconto',C.tabela?B(C.desc/C.tabela*100):0],
      ['Subsídio TikTok (plataforma banca)',B(C.desc_plat)],['% subsídio',C.tabela?B(C.desc_plat/C.tabela*100):0],[],
      ['TAXAS (real, deduzido do repasse)','R$'],
      ['Comissão plataforma (6%)',B(C.com_real)],['Serviço + frete grátis',B(C.serv_real)],
      ['Comissão afiliada',B(C.afi)],['Mídia GMV Max (settlement)',B(C.ads)],['Frete líquido',B(C.fre)],[],
      ['CONCILIAÇÃO POR STATUS','qtd'],
      ['Conciliado (ok)',C.n_ok],['Serviço/frete a revisar',C.n_serv],['Com devolução',C.n_dev],
      ['Comissão acima',C.n_com],['Repasse faltante',C.n_falt],['Cancelado',C.n_canc],[],
      ['ALERTAS','R$'],
      ['Impacto tarifa 15/07 (por mês)',B(C.imp)],['A recuperar (repasse faltante)',B(C.faltante)]];
    const ws1=XLSX.utils.aoa_to_sheet(s1); ws1['!cols']=[{wch:36},{wch:16}]; XLSX.utils.book_append_sheet(wb,ws1,'Resumo');
    // 2) CONCILIAÇÃO POR MÊS
    const h2=['Mês','Pedidos','Receita','Repasse','Comissão real','Comissão esp','Serv/frete real','Serv/frete esp','Afiliada','Ads','Desconto vend','% desc','Subsídio TikTok','% subsídio','Impacto 15/07','ok','revisar','faltante'];
    const s2=[h2]; ms.forEach(m=>{const c=CONC[m]; if(!c)return; s2.push([m,c.pedidos_total,B(c.receita),B(c.repasse),B(c.comissao_real),B(c.comissao_esp),B(c.servico_real),B(c.servico_esp),B(c.afiliada),B(c.ads),B(c.desconto_vendedor),c.preco_tabela?B(c.desconto_vendedor/c.preco_tabela*100):0,B(c.desconto_plataforma),c.preco_tabela?B(c.desconto_plataforma/c.preco_tabela*100):0,B(c.impacto_1507),c.n_ok,c.n_servico,c.n_faltante]);});
    const ws2=XLSX.utils.aoa_to_sheet(s2); ws2['!cols']=h2.map((_,i)=>({wch:i===0?9:14})); XLSX.utils.book_append_sheet(wb,ws2,'Conciliação por mês');
    // 3) PEDIDOS (completo)
    let path='conciliacao_pedido?select=order_id,periodo,data,produto,qty,preco_tabela,desconto_vendedor,desconto_pct,desconto_plataforma,desconto_plataforma_pct,receita_liq,comissao_real,comissao_esperada,servico_frete_real,servico_frete_esperado,afiliada_real,ads_real,frete_real,custo_devolucao,settlement,taxa_efetiva_pct,div_comissao,div_servico_frete,impacto_1507,conciliacao&order=receita_liq.desc';
    if(ms.length===1) path+=`&periodo=eq.${ms[0]}`; else if(ms.length) path+=`&periodo=in.(${ms.join(',')})`;
    let ped=[]; try{ const r=await admProxy('GET',path,{paged:true}); ped=r.data||[]; }catch(e){}
    const h3=['Pedido','Período','Data','Produto','Qtd','Preço tabela','Desc vendedor','Desc %','Subsídio TikTok','Subsídio %','Receita líq','Comissão real','Comissão esp','Serv/frete real','Serv/frete esp','Afiliada','Ads','Frete','Custo devol','Repasse','Taxa %','Div comissão','Div serv/frete','Impacto 15/07','Status'];
    const s3=[h3].concat(ped.map(p=>[p.order_id,p.periodo,p.data,p.produto,+p.qty||0,B(p.preco_tabela),B(p.desconto_vendedor),B(p.desconto_pct),B(p.desconto_plataforma),B(p.desconto_plataforma_pct),B(p.receita_liq),B(p.comissao_real),B(p.comissao_esperada),B(p.servico_frete_real),B(p.servico_frete_esperado),B(p.afiliada_real),B(p.ads_real),B(p.frete_real),B(p.custo_devolucao),B(p.settlement),B(p.taxa_efetiva_pct),B(p.div_comissao),B(p.div_servico_frete),B(p.impacto_1507),p.conciliacao]));
    const ws3=XLSX.utils.aoa_to_sheet(s3); ws3['!cols']=[{wch:20},{wch:9},{wch:11},{wch:34}].concat(h3.slice(4).map(()=>({wch:13}))); ws3['!autofilter']={ref:'A1:'+XLSX.utils.encode_col(h3.length-1)+'1'};
    XLSX.utils.book_append_sheet(wb,ws3,'Pedidos ('+ped.length+')');
    // 4) PRODUTOS
    const prod=Object.entries(D.margAgg).map(([n,v])=>({n,...v})).filter(x=>x.gmv>0).sort((a,b)=>b.gmv-a.gmv);
    const s4=[['Produto','Qtd','GMV','Custo CPV','Contribuição','Margem líq','Margem %']];
    prod.forEach(x=>{const contrib=x.gmvCpv-x.custo, liq=x.gmvCpv*D.eficFrac-x.custo; s4.push([x.n,x.qty,B(x.gmvCpv),B(x.custo),B(contrib),B(liq),x.gmvCpv?B(liq/x.gmvCpv*100):0]);});
    const ws4=XLSX.utils.aoa_to_sheet(s4); ws4['!cols']=[{wch:42},{wch:8},{wch:13},{wch:13},{wch:13},{wch:13},{wch:10}]; XLSX.utils.book_append_sheet(wb,ws4,'Produtos');
    // 5) ADS (GMV Max — por campanha, da Business API)
    const inP=r=>(FILTER.modo==='range'&&FILTER.de&&FILTER.ate)?(r.data>=FILTER.de&&r.data<=FILTER.ate):ms.includes(r.periodo);
    const abyc={}; ADCAMP.filter(inP).forEach(r=>{const c=abyc[r.campaign_id]||(abyc[r.campaign_id]={campanha:r.campanha,modelo:r.modelo,cost:0,receita:0,pedidos:0}); c.cost+=+r.cost||0; c.receita+=+r.receita||0; c.pedidos+=+r.pedidos||0; if(r.campanha)c.campanha=r.campanha; if(r.modelo)c.modelo=r.modelo;});
    const s5=[['Campanha','Modelo','Investimento','Receita','ROAS','Pedidos','CPA','Ticket']];
    Object.values(abyc).filter(c=>c.cost>0||c.receita>0).sort((a,b)=>b.cost-a.cost).forEach(c=>{s5.push([c.campanha,c.modelo==='vendas_liquidas'?'Vendas Líquidas':'Receita bruta',B(c.cost),B(c.receita),c.cost?B(c.receita/c.cost):'',c.pedidos,c.pedidos?B(c.cost/c.pedidos):'',c.pedidos?B(c.receita/c.pedidos):'']);});
    const ws5=XLSX.utils.aoa_to_sheet(s5); ws5['!cols']=[{wch:46},{wch:16},{wch:13},{wch:13},{wch:8},{wch:9},{wch:10},{wch:10}]; XLSX.utils.book_append_sheet(wb,ws5,'Ads GMV Max');
    const per=periodoLabel().replace(/[^\w]+/g,'-').replace(/^-|-$/g,'');
    XLSX.writeFile(wb, `Relatorio Conciliacao ${per}_${new Date().toISOString().slice(0,10)}.xlsx`);
  }catch(e){ alert('Erro ao gerar relatório: '+e.message); }
  finally{ if(btn){ btn.textContent=orig; btn.disabled=false; } }
}
