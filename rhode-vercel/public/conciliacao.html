<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhode · Conciliação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#1d1d1f; --ink-64:#5a5a5e; --ink-48:#85858a; --ink-24:#bcbcc0;
    --pearl:#fafafc; --parchment:#f5f5f7; --hairline:#e6e6ea; --card:#ffffff;
    --rhode-red:#FE2C55; --green:#1a8f5a; --orange:#c05e00; --blue:#2563eb; --amber:#b45309;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:var(--pearl);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45}
  .mono{font-family:'JetBrains Mono',monospace}
  .num{font-variant-numeric:tabular-nums}

  /* login */
  #login{position:fixed;inset:0;display:grid;place-items:center;background:var(--pearl);z-index:50}
  .login-card{background:var(--card);border:1px solid var(--hairline);border-radius:18px;padding:40px;width:340px;box-shadow:0 12px 40px rgba(0,0,0,.06)}
  .login-card h1{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
  .login-card p{font-size:13px;color:var(--ink-48);margin-bottom:24px}
  .login-card input{width:100%;padding:13px 15px;border:1px solid var(--hairline);border-radius:11px;font-family:'JetBrains Mono',monospace;font-size:14px;margin-bottom:14px;outline:none}
  .login-card input:focus{border-color:var(--ink)}
  .login-card button{width:100%;padding:13px;background:var(--ink);color:#fff;border:none;border-radius:11px;font-weight:600;font-size:14px;cursor:pointer}
  .login-err{color:var(--rhode-red);font-size:12px;margin-top:12px;min-height:16px;text-align:center}

  /* topbar */
  .topbar{background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid rgba(0,0,0,.06);padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;z-index:30;gap:16px}
  .tlogo{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:18px;letter-spacing:-.02em}
  .tlogo b{color:var(--rhode-red)}
  .tlogo small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-48);font-weight:500;margin-left:8px}
  .tright{display:flex;align-items:center;gap:10px}
  .modnav{display:flex;gap:3px;background:var(--parchment);border:1px solid var(--hairline);border-radius:99px;padding:3px}
  .modnav a{font-size:13px;font-weight:500;text-decoration:none;color:var(--ink-48);padding:6px 15px;border-radius:99px;transition:all .15s;white-space:nowrap}
  .modnav a:hover{color:var(--ink)}
  .modnav a.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .lnk{font-size:12px;color:var(--ink-48);text-decoration:none;border:1px solid var(--hairline);padding:8px 12px;border-radius:9px;background:var(--card);cursor:pointer}
  .lnk:hover{color:var(--ink);border-color:var(--ink-24)}

  #app{display:none;max-width:1180px;margin:0 auto;padding:24px 28px 90px}

  /* filtro */
  .filterbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0 18px;margin-bottom:6px}
  .seg{display:flex;gap:2px;background:var(--parchment);border:1px solid var(--hairline);border-radius:10px;padding:2px}
  .seg button{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;border:none;background:none;color:var(--ink-48);padding:7px 13px;border-radius:8px;cursor:pointer;transition:all .12s}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .fld{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-48)}
  select,input[type=date],input[type=month]{font-family:'JetBrains Mono',monospace;font-size:12.5px;padding:7px 11px;border:1px solid var(--hairline);border-radius:9px;background:var(--card);cursor:pointer;outline:none;color:var(--ink)}
  .fmeta{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-48)}

  /* tabs */
  .tabnav{display:flex;gap:2px;border-bottom:1px solid var(--hairline);margin-bottom:26px;overflow-x:auto}
  .tabnav button{font-family:'Inter',sans-serif;font-size:14px;font-weight:500;border:none;background:none;color:var(--ink-48);padding:12px 16px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .12s}
  .tabnav button:hover{color:var(--ink)}
  .tabnav button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--rhode-red)}

  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  .kpis.k6{grid-template-columns:repeat(6,1fr)}
  .kpi{background:var(--card);border:1px solid var(--hairline);border-radius:14px;padding:16px 18px}
  .kpi .lbl{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-48)}
  .kpi .val{font-family:'JetBrains Mono',monospace;font-size:23px;font-weight:700;letter-spacing:-.02em;margin-top:7px;font-variant-numeric:tabular-nums}
  .kpi.k6 .val{font-size:19px}
  .kpi .val.accent{color:var(--green)}
  .kpi .val.danger{color:var(--rhode-red)}
  .kpi .foot{font-size:11px;color:var(--ink-48);margin-top:4px}

  .sec{background:var(--card);border:1px solid var(--hairline);border-radius:16px;padding:22px 24px;margin-bottom:20px}
  .sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
  .sec-h h2{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;letter-spacing:-.01em}
  .sec-h .meta{font-size:12px;color:var(--ink-48)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:880px){.grid2{grid-template-columns:1fr}.kpis,.kpis.k6{grid-template-columns:repeat(2,1fr)}}

  /* cascata */
  .casc-row{display:grid;grid-template-columns:200px 1fr 150px;align-items:center;gap:14px;padding:9px 0}
  .casc-row + .casc-row{border-top:1px solid #f1f1f4}
  .casc-lbl{font-size:13.5px;font-weight:500}
  .casc-lbl small{display:block;font-size:10.5px;color:var(--ink-48);font-weight:400;margin-top:1px}
  .casc-bar{height:9px;border-radius:5px;background:#eef0f3;overflow:hidden}
  .casc-bar i{display:block;height:100%;border-radius:5px}
  .casc-val{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  .casc-row.total{border-top:2px solid var(--ink);margin-top:4px;padding-top:13px}
  .casc-row.total .casc-lbl{font-weight:700}
  .casc-row.total .casc-val{font-size:17px;color:var(--green)}
  .neg{color:var(--rhode-red)}

  table{width:100%;border-collapse:collapse}
  th,td{text-align:right;padding:9px 12px;font-size:13px;font-variant-numeric:tabular-nums}
  th{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-48);border-bottom:1px solid var(--hairline);font-weight:600;cursor:default}
  td{font-family:'JetBrains Mono',monospace;border-bottom:1px solid #f1f1f4}
  th:first-child,td:first-child{text-align:left}
  tbody tr:hover{background:#fafafb}
  td.mp{font-family:'Inter',sans-serif;font-weight:600}
  .tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 8px;border-radius:99px;font-weight:600}
  .tag.ok{background:#e8f6ee;color:var(--green)} .tag.warn{background:#fdeaea;color:var(--rhode-red)} .tag.mut{background:var(--parchment);color:var(--ink-48)}

  .note{background:#fff8ee;border:1px solid #f0e2c8;border-radius:12px;padding:13px 15px;font-size:12.5px;color:#7a5b1e;line-height:1.5;display:flex;gap:10px}
  .note b{color:#5a4310}
  .note.green{background:#eef6f0;border-color:#cfe6d8;color:#2a6045} .note.green b{color:#1a5b3a}
  .pill{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.05em;background:var(--parchment);color:var(--ink-48);padding:3px 9px;border-radius:99px;border:1px solid var(--hairline)}
  .loading{text-align:center;color:var(--ink-48);font-size:13px;padding:60px}

  /* alerta destaque (tarifa) */
  .alert{display:flex;gap:16px;align-items:center;background:linear-gradient(120deg,#fff5f7,#fff);border:1px solid #f6cdd6;border-radius:16px;padding:18px 22px;margin-bottom:20px}
  .alert .ic{font-size:26px}
  .alert .big{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:800;color:var(--rhode-red);letter-spacing:-.02em}
  .alert .tx{font-size:13px;color:var(--ink-64);line-height:1.5}
  .alert .tx b{color:var(--ink)}

  /* search */
  .search{font-family:'JetBrains Mono',monospace;font-size:13px;padding:8px 13px;border:1px solid var(--hairline);border-radius:10px;background:var(--card);outline:none;width:230px}
  .chartwrap{position:relative;height:280px}
  .empty{text-align:center;color:var(--ink-48);font-size:13px;padding:40px}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <h1>rhode<span style="color:var(--rhode-red)">.</span> conciliação</h1>
    <p>Console financeiro · acesso admin</p>
    <input id="adm-pass" type="password" placeholder="senha admin" onkeydown="if(event.key==='Enter')admLogin()">
    <button onclick="admLogin()">Entrar</button>
    <div class="login-err" id="adm-err"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="tlogo">Rhode<b>.</b><small>Console</small></div>
    <div class="tright">
      <nav class="modnav"><a href="admin.html">Creators</a><a href="conciliacao.html" class="on">Conciliação</a></nav>
      <a class="lnk" onclick="logout()">Sair</a>
    </div>
  </div>

  <div style="max-width:1180px;margin:0 auto;padding:0 28px">
    <div class="filterbar">
      <div class="seg" id="seg-janela">
        <button data-j="tudo" class="on" onclick="setJanela('tudo')">Tudo</button>
        <button data-j="3m" onclick="setJanela('3m')">3M</button>
        <button data-j="6m" onclick="setJanela('6m')">6M</button>
        <button data-j="ano" onclick="setJanela('ano')">Ano</button>
      </div>
      <div class="fld">Mês <select id="f-mes" onchange="setMes(this.value)"></select></div>
      <div class="fld">Data <input type="date" id="f-de" onchange="setRange()"> → <input type="date" id="f-ate" onchange="setRange()"></div>
      <div class="fmeta" id="f-meta"></div>
      <button class="lnk" id="btn-export" onclick="exportRelatorio()" style="margin-left:12px;font-weight:600">⬇ Exportar relatório</button>
    </div>
  </div>

  <div style="max-width:1180px;margin:0 auto;padding:0 28px">
    <div class="tabnav" id="tabnav"></div>
    <div id="content"><div class="loading">Carregando dados…</div></div>
  </div>
</div>

<script>
const ADM_TOKEN_KEY='rhode-admin-token';
function admToken(){ try{return sessionStorage.getItem(ADM_TOKEN_KEY)||'';}catch(e){return'';} }
async function admLogin(){
  const pass=document.getElementById('adm-pass').value, err=document.getElementById('adm-err');
  try{
    const r=await fetch('/api/get-hub',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'admin_login',pass})});
    const d=await r.json().catch(()=>({}));
    if(r.ok && d.token){ sessionStorage.setItem(ADM_TOKEN_KEY,d.token); enter(); } else err.textContent=d.error||'Senha incorreta.';
  }catch(e){ err.textContent='Erro de conexão.'; }
}
function logout(){ try{sessionStorage.removeItem(ADM_TOKEN_KEY);}catch(_){}; location.reload(); }
async function admProxy(method, path, opts={}){
  const payload={action:'admin_query', adminToken:admToken(), method, path, paged:opts.paged};
  if(opts.body!==undefined) payload.body=opts.body;
  if(opts.prefer) payload.prefer=opts.prefer;
  const r=await fetch('/api/get-hub',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(r.status===401){ logout(); throw new Error('sessão expirada'); }
  if(!r.ok){ let e={};try{e=await r.json();}catch(_){}; throw new Error(e.error||('HTTP '+r.status)); }
  return r.json().catch(()=>({}));
}

// formatação
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const BRL2=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2});
const NUM=new Intl.NumberFormat('pt-BR');
const fmt=v=>BRL.format(v||0), fmt2=v=>BRL2.format(v||0);
const pct=(a,b)=>b?(a/b*100):0;
const MES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const fmtMes=id=>{const[y,m]=String(id||'').split('-');return m?`${MES[+m-1]}/${String(y).slice(2)}`:id;};

// estado
let FIN={}, GMV={}, PROD={}, CPVMAP={}, ADS={}, STX={}, DIV=[], SPLIT={}, OFI={}, CONC={}, ADC={}, MESES=[];
let TAB='visao';
let FILTER={modo:'tudo', mes:'', de:'', ate:''};
let CHART=null;
let TX_VENDA=parseFloat(localStorage.getItem('rhode_tx_venda'))||9.25;
let TX_IR=parseFloat(localStorage.getItem('rhode_tx_ir'))||34;
function setTx(w,v){const n=parseFloat(v)||0; if(w==='venda'){TX_VENDA=n;try{localStorage.setItem('rhode_tx_venda',n)}catch(e){}}else{TX_IR=n;try{localStorage.setItem('rhode_tx_ir',n)}catch(e){}} render();}

const TABS=[['visao','Visão Geral'],['conciliacao','Conciliação'],['repasse','Repasse'],['receber','A Receber'],['produtos','Produtos'],['lucro','Lucro'],['ads','Ads'],['pedidos','Pedidos']];

async function load(){
  const [fin, ped, cpv, ads, stx, div, ofi, conc, adc] = await Promise.all([
    admProxy('GET','finance_statements?select=data,revenue_amount,fee_amount,shipping_cost,adjustment,settlement&order=data.asc',{paged:true}),
    admProxy('GET','pedidos_sku?select=periodo,gmv,qty,produto,seller_sku,status',{paged:true}),
    admProxy('GET','custos_sku?select=ref,cpv',{paged:true}),
    admProxy('GET','ads_gmvmax?select=periodo,campanha,custo,receita_bruta,pedidos',{paged:true}),
    admProxy('GET','statement_tx_resumo?select=*',{paged:true}).catch(()=>({data:[]})),
    admProxy('GET','repasse_divergencias?select=*',{paged:true}).catch(()=>({data:[]})),
    admProxy('GET','gmv_oficial_resumo?select=*',{paged:true}).catch(()=>({data:[]})),
    admProxy('GET','conciliacao_resumo?select=*',{paged:true}).catch(()=>({data:[]})),
    admProxy('GET','ads_custo_resumo?select=*',{paged:true}).catch(()=>({data:[]}))
  ]);
  OFI={}; (ofi&&ofi.data?ofi.data:[]).forEach(r=>{ if(r.periodo) OFI[r.periodo]=r; });
  CONC={}; (conc&&conc.data?conc.data:[]).forEach(r=>{ if(r.periodo) CONC[r.periodo]=r; });
  ADC={}; (adc&&adc.data?adc.data:[]).forEach(r=>{ if(r.periodo) ADC[r.periodo]=r; });
  CPVMAP={}; (cpv.data||[]).forEach(r=>{ if(r.ref) CPVMAP[String(r.ref).toUpperCase()]=+r.cpv||0; });
  STX={}; (stx.data||[]).forEach(r=>{ if(r.periodo) STX[r.periodo]=r; });
  DIV = (div&&div.data)?div.data:[];
  ADS={}; (ads.data||[]).forEach(r=>{const m=r.periodo; if(!m)return; const a=ADS[m]||(ADS[m]={custo:0,receita:0,pedidos:0,camp:{}}); a.custo+=+r.custo||0;a.receita+=+r.receita_bruta||0;a.pedidos+=+r.pedidos||0; const n=(r.campanha||'—'); const c=a.camp[n]||(a.camp[n]={custo:0,receita:0,pedidos:0}); c.custo+=+r.custo||0;c.receita+=+r.receita_bruta||0;c.pedidos+=+r.pedidos||0;});
  FIN={}; (fin.data||[]).forEach(r=>{const m=(r.data||'').slice(0,7); if(!m)return; const a=FIN[m]||(FIN[m]={rev:0,fee:0,ship:0,adj:0,set:0,n:0}); a.rev+=+r.revenue_amount||0;a.fee+=+r.fee_amount||0;a.ship+=+r.shipping_cost||0;a.adj+=+r.adjustment||0;a.set+=+r.settlement||0;a.n++;});
  GMV={}; PROD={}; SPLIT={};
  (ped.data||[]).forEach(r=>{
    const m=r.periodo; if(!m)return;
    const g=+r.gmv||0, q=+r.qty||0, cpvUn=CPVMAP[(r.seller_sku||'').toUpperCase()];
    const canc=/CANCEL/i.test(r.status||'');
    const a=GMV[m]||(GMV[m]={gmv:0,qty:0,itens:0,canc:0,cancq:0}); a.gmv+=g; a.qty+=q; a.itens++; if(canc){a.canc+=g;a.cancq+=q;}
    if(canc) return;  // cancelado não gera margem nem fee — fora do GMV válido
    const nome=(r.produto||'—').trim();
    const pm=PROD[m]||(PROD[m]={}); const p=pm[nome]||(pm[nome]={gmv:0,qty:0,custo:0,gmvCpv:0});
    p.gmv+=g; p.qty+=q; if(cpvUn!=null){ p.custo+=cpvUn*q; p.gmvCpv+=g; }
    const sp=SPLIT[m]||(SPLIT[m]={gmvLt:0,qtyGe:0}); const un=q>0?g/q:0;
    if(un>0 && un<50) sp.gmvLt+=g; else if(un>=50) sp.qtyGe+=q;
  });
  MESES=[...new Set([...Object.keys(FIN),...Object.keys(GMV),...Object.keys(ADS),...Object.keys(STX)])].filter(Boolean).sort();
  // filtros
  document.getElementById('f-mes').innerHTML='<option value="">—</option>'+MESES.slice().reverse().map(m=>`<option value="${m}">${fmtMes(m)}</option>`).join('');
  document.getElementById('tabnav').innerHTML=TABS.map(([k,l])=>`<button data-t="${k}" class="${k===TAB?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('');
  render();
}

// ---- filtros → meses ----
function getMeses(){
  if(!MESES.length) return [];
  if(FILTER.modo==='mes' && FILTER.mes) return [FILTER.mes];
  if(FILTER.modo==='range' && FILTER.de && FILTER.ate){ const a=FILTER.de.slice(0,7), b=FILTER.ate.slice(0,7); return MESES.filter(m=>m>=a&&m<=b); }
  if(FILTER.modo==='3m') return MESES.slice(-3);
  if(FILTER.modo==='6m') return MESES.slice(-6);
  if(FILTER.modo==='ano'){ const y=MESES[MESES.length-1].slice(0,4); return MESES.filter(m=>m.startsWith(y)); }
  return MESES;
}
function periodoLabel(){ const ms=getMeses(); if(!ms.length) return '—'; if(ms.length===1) return fmtMes(ms[0]); return `${fmtMes(ms[0])} – ${fmtMes(ms[ms.length-1])}`; }
function setJanela(j){ FILTER={modo:j,mes:'',de:'',ate:''}; document.getElementById('f-mes').value=''; document.getElementById('f-de').value=''; document.getElementById('f-ate').value=''; syncSeg(j); render(); }
function setMes(v){ if(!v){return;} FILTER={modo:'mes',mes:v,de:'',ate:''}; document.getElementById('f-de').value=''; document.getElementById('f-ate').value=''; syncSeg(null); render(); }
function setRange(){ const de=document.getElementById('f-de').value, ate=document.getElementById('f-ate').value; if(de&&ate){ FILTER={modo:'range',mes:'',de,ate}; document.getElementById('f-mes').value=''; syncSeg(null); render(); } }
function syncSeg(j){ document.querySelectorAll('#seg-janela button').forEach(b=>b.classList.toggle('on', b.dataset.j===j)); }

function setTab(t){ TAB=t; document.querySelectorAll('#tabnav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t)); render(); }

// ---- núcleo de cálculo (para os meses do filtro) ----
function agg(meses){
  const A={rev:0,fee:0,ship:0,adj:0,set:0,n:0}; let gmv=0,qty=0,gmvVal=0,qtyVal=0,cancV=0, exSettle=0,exPago=0, pago=0;
  meses.forEach(m=>{const f=FIN[m]; if(f){A.rev+=f.rev;A.fee+=f.fee;A.ship+=f.ship;A.adj+=f.adj;A.set+=f.set;A.n+=f.n;} const g=GMV[m]; if(g){gmv+=g.gmv;qty+=g.qty;gmvVal+=(g.gmv-(g.canc||0));qtyVal+=(g.qty-(g.cancq||0));cancV+=(g.canc||0);} const s=STX[m]; if(s){exSettle+=+s.settle_liq||0;exPago+=+s.pago_liq||0;pago+=+s.pago_total||0;}});
  // GMV OFICIAL (Orders API, = Seller Center, sem lag) — ponte: oficial → frete → produto → válido
  let ofiHas=false, gmvOficial=0, ofiFrete=0, ofiProduto=0, ofiPagoCanc=0, ofiProdValido=0, ofiN=0;
  meses.forEach(m=>{const o=OFI[m]; if(o){ofiHas=true; gmvOficial+=+o.gmv_oficial||0; ofiFrete+=+o.frete||0; ofiProduto+=+o.produto||0; ofiPagoCanc+=+o.pago_cancelado||0; ofiProdValido+=+o.produto_valido||0; ofiN+=+o.pedidos_pagos||0;}});
  const gmvAll=gmvVal;                              // base de cobertura/ads = GMV válido produto
  const faturamento = ofiHas ? gmvOficial : gmvVal; // headline: GMV oficial (= SC) quando disponível; senão GMV válido
  const margAgg={};
  meses.forEach(m=>{const pm=PROD[m]||{}; Object.entries(pm).forEach(([nome,v])=>{const a=margAgg[nome]||(margAgg[nome]={qty:0,custo:0,gmvCpv:0,gmv:0}); a.qty+=v.qty;a.custo+=v.custo;a.gmvCpv+=v.gmvCpv;a.gmv+=v.gmv;});});
  let mCusto=0,mGmvCpv=0,mQty=0; Object.values(margAgg).forEach(v=>{mCusto+=v.custo;mGmvCpv+=v.gmvCpv;mQty+=v.qty;});
  let gRev=0,gSet=0; Object.values(FIN).forEach(f=>{gRev+=f.rev;gSet+=f.set;});
  const eficFrac = exPago>0 ? exSettle/exPago : (A.rev?A.set/A.rev:(gRev?gSet/gRev:0.74));
  const eficExata = exPago>0;
  const cobertura = gmvAll?mGmvCpv/gmvAll*100:0;
  const mContrib=mGmvCpv-mCusto, mLiq=mGmvCpv*eficFrac-mCusto;
  let adReal=0,adRealRec=0,adRealHas=false,adTrad=0;
  meses.forEach(m=>{const a=ADC[m]; if(a){adRealHas=true; adReal+=+a.custo||0; adRealRec+=+a.receita||0;} const g=ADS[m]; if(g) adTrad+=g.custo;});
  // PROVADO (4 investigadores · 98 statements reconciliam sem NENHUMA linha de ads): o settlement não tem custo de GMV Max. Tradicional E Vendas Líquidas são debitados da CONTA DE ADS → subtrair AMBOS (ads_custo total) do lucro.
  const impVenda=mGmvCpv*TX_VENDA/100, lucroAntesIR=mLiq-impVenda-adReal, impIR=lucroAntesIR>0?lucroAntesIR*TX_IR/100:0, lucroFinal=lucroAntesIR-impIR;
  const rp={liq:0,pagoLiq:0,rec:0,recN:0,dev:0,devN:0,plat:0,afi:0,ads:0,frete:0,liqN:0};
  meses.forEach(m=>{const s=STX[m]; if(!s)return; rp.liq+=+s.settle_liq||0;rp.pagoLiq+=+s.pago_liq||0;rp.liqN+=+s.liquidados||0;rp.rec+=+s.a_receber||0;rp.recN+=+s.pendentes||0;rp.dev+=+s.devolucao||0;rp.devN+=+s.devolvidos||0;rp.plat+=+s.comissao_plataforma||0;rp.afi+=+s.comissao_afiliada||0;rp.ads+=+s.comissao_ads_afil||0;rp.frete+=+s.frete||0;});
  const rpTaxa=rp.pagoLiq?(1-rp.liq/rp.pagoLiq)*100:0;
  const ad={custo:0,receita:0,pedidos:0,camp:{}};
  meses.forEach(m=>{const a=ADS[m]; if(!a)return; ad.custo+=a.custo;ad.receita+=a.receita;ad.pedidos+=a.pedidos; Object.entries(a.camp).forEach(([n,c])=>{const x=ad.camp[n]||(ad.camp[n]={custo:0,receita:0,pedidos:0});x.custo+=c.custo;x.receita+=c.receita;x.pedidos+=c.pedidos;});});
  let gmvLt=0,qtyGe=0; meses.forEach(m=>{const s=SPLIT[m]; if(s){gmvLt+=s.gmvLt;qtyGe+=s.qtyGe;}});
  const tarifaExtra=0.04*gmvLt+2.0*qtyGe;
  // CONCILIAÇÃO (esperado × real)
  const C={has:false,receita:0,repasse:0,com_real:0,com_esp:0,serv_real:0,serv_esp:0,afi:0,ads:0,fre:0,tabela:0,desc:0,div_serv:0,custo_dev:0,faltante:0,imp:0,n_ok:0,n_serv:0,n_com:0,n_dev:0,n_falt:0,n_canc:0,n_total:0};
  meses.forEach(m=>{const c=CONC[m]; if(!c)return; C.has=true;
    C.receita+=+c.receita||0; C.repasse+=+c.repasse||0; C.com_real+=+c.comissao_real||0; C.com_esp+=+c.comissao_esp||0;
    C.serv_real+=+c.servico_real||0; C.serv_esp+=+c.servico_esp||0; C.afi+=+c.afiliada||0; C.ads+=+c.ads||0; C.fre+=+c.frete||0;
    C.tabela+=+c.preco_tabela||0; C.desc+=+c.desconto_vendedor||0; C.div_serv+=+c.div_servico_revisar||0; C.custo_dev+=+c.custo_devolucao||0;
    C.faltante+=+c.valor_faltante||0; C.imp+=+c.impacto_1507||0;
    C.n_ok+=+c.n_ok||0; C.n_serv+=+c.n_servico||0; C.n_com+=+c.n_comissao||0; C.n_dev+=+c.n_devolucao||0; C.n_falt+=+c.n_faltante||0; C.n_canc+=+c.n_cancelado||0; C.n_total+=+c.pedidos_total||0;
  });
  return {A,gmv,qty,gmvAll,gmvVal,qtyVal,cancV,pago,faturamento,ofiHas,gmvOficial,ofiFrete,ofiProduto,ofiPagoCanc,ofiProdValido,ofiN,eficFrac,eficExata,margAgg,mCusto,mGmvCpv,mQty,cobertura,mContrib,mLiq,impVenda,impIR,lucroAntesIR,lucroFinal,rp,rpTaxa,ad,gmvLt,qtyGe,tarifaExtra,conc:C,adReal,adRealRec,adRealHas,adTrad};
}

// helpers UI
const kpi=(lbl,val,foot,cls='')=>`<div class="kpi ${cls.includes('k6')?'k6':''}"><div class="lbl">${lbl}</div><div class="val ${cls.replace('k6','').trim()}">${val}</div><div class="foot">${foot||''}</div></div>`;
const cascRow=(lbl,sub,val,color,maxv,cls='')=>`<div class="casc-row ${cls}"><div class="casc-lbl">${lbl}${sub?`<small>${sub}</small>`:''}</div><div class="casc-bar"><i style="width:${Math.min(100,Math.abs(val)/maxv*100)}%;background:${color}"></i></div><div class="casc-val ${val<0?'neg':''}">${fmt2(val)}</div></div>`;

function render(){
  document.getElementById('f-meta').textContent = periodoLabel()+' · '+getMeses().length+(getMeses().length===1?' mês':' meses');
  const ms=getMeses(), D=agg(ms);

  if(!ms.length){ el.innerHTML='<div class="empty">Sem dados no período.</div>'; return; }
  if(TAB==='visao')    el.innerHTML=renderVisao(D,ms);

  const falt=DIV.filter(d=>(FILTER.modo==='tudo'||ms.includes(d.periodo))&&d.classe==='repasse_faltante').reduce((s,d)=>s+(+d.pago||0),0);

  </div>`;
  const alert=D.tarifaExtra>0?`<div class="alert">
    <div class="ic">⚠️</div>
    <div><div class="big">+${fmt(D.tarifaExtra/Math.max(1,ms.length))}/mês</div>
    <div class="tx">A partir de <b>15/07/2026</b> a taxa por item do TikTok sobe <b>R$4 → R$6</b> (e comissão de itens &lt;R$50 vai a 10%). No seu volume isso é <b>~${fmt(D.tarifaExtra/Math.max(1,ms.length))}/mês</b> de custo novo — <b>reprecificar antes</b>. <span style="color:var(--ink-48)">Itens ≥R$50 = ${pct(D.qtyGe*1,D.qty).toFixed(0)}% das peças.</span></div></div>
  </div>`:'';
  const chart=`<div class="sec"><div class="sec-h"><h2>Evolução</h2><div class="meta">faturamento vs liquidado · mês a mês</div></div><div class="chartwrap"><canvas id="evo-chart"></canvas></div></div>`;
  const high=`<div class="grid2">
    <div class="sec"><div class="sec-h"><h2>Produto-herói</h2></div><div style="font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700">${fmt(top.gmv)}</div><div style="font-size:13px;color:var(--ink-64);margin-top:4px">${top.n}</div><div style="font-size:12px;color:var(--ink-48);margin-top:8px">o produto que mais fatura no período</div></div>
    <div class="sec"><div class="sec-h"><h2>A recuperar</h2></div><div style="font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:${falt>0?'var(--amber)':'var(--green)'}">${fmt(falt)}</div><div style="font-size:13px;color:var(--ink-64);margin-top:4px">repasse faltante (recuperável)</div><div style="font-size:12px;color:var(--ink-48);margin-top:8px">${falt>0?'pedidos pagos sem settlement — ver aba A Receber':'TikTok está pagando certo 👍'}</div></div>
  </div>`;
  let funil;
  if(D.ofiHas){
    const mx=Math.max(D.gmvOficial,1), prodCanc=D.ofiProduto-D.ofiProdValido;
    funil=`<div class="sec"><div class="sec-h"><h2>Ponte de receita <span class="pill">bate c/ Seller Center</span></h2><div class="meta">do GMV oficial ao que importa pro lucro</div></div>

      ${cascRow('− Produto pago-e-cancelado','pago, depois cancelado — sai da base',-prodCanc,'var(--rhode-red)',mx)}

function drawChart(){
  const c=document.getElementById('evo-chart'); if(!c||!window.Chart) return;

  const labels=MESES.map(fmtMes);
  const anyOfi=Object.keys(OFI).length>0;

  const liq=MESES.map(m=>STX[m]?+STX[m].settle_liq||0:(FIN[m]?FIN[m].set:0));
  CHART=new Chart(c,{type:'bar',data:{labels,datasets:[

function renderConciliacao(D,ms){
  const C=D.conc;
  if(!C.has) return `<div class="sec"><div class="empty">Rode <span class="mono">conciliacao_pedido.sql</span> (view v2) pra ligar a conciliação esperado×real.<br><small>Precisa do statement_tx itemizado (backfill).</small></div></div>`;
  const feeTot=C.com_real+C.serv_real+C.afi+C.ads, taxaEf=C.receita?feeTot/C.receita*100:0;
  const divCom=C.com_real-C.com_esp, descPct=C.tabela?C.desc/C.tabela*100:0;
  const k=`<div class="kpis k6">
    ${kpi('Receita líquida',fmt(C.receita),NUM.format(C.n_total)+' pedidos','k6')}

    ${kpi('Repasse',fmt(C.repasse),'líquido recebido','k6 accent')}

    ${kpi('A recuperar',fmt(C.faltante),NUM.format(C.n_falt)+' faltantes','k6')}

  const feeRow=(lbl,real,esp,note)=>{const dv=esp!=null?real-esp:null;
    const st=dv==null?'—':(Math.abs(dv)<=Math.max(2,esp*0.02)?'<span class="tag ok">ok</span>':(dv>0?'<span class="tag warn">+'+fmt(dv)+'</span>':'<span class="tag mut">'+fmt(dv)+'</span>'));
    return `<tr><td class="mp">${lbl}${note?'<br><small style="color:var(--ink-48);font-weight:400">'+note+'</small>':''}</td><td>${fmt(real)}</td><td>${esp!=null?fmt(esp):'—'}</td><td style="text-align:right">${st}</td></tr>`;};
  const casc=`<div class="sec"><div class="sec-h"><h2>Taxas: esperado × real <span class="pill">contratado TikTok BR</span></h2><div class="meta">${periodoLabel()}</div></div>
    <table><thead><tr><th>Componente</th><th>Real</th><th>Esperado</th><th style="text-align:right">Status</th></tr></thead><tbody>
    ${feeRow('Comissão plataforma',C.com_real,C.com_esp,'6% da receita líquida')}
    ${feeRow('Serviço + Frete grátis',C.serv_real,C.serv_esp,'6% + R$4/item')}
    ${feeRow('Comissão afiliada',C.afi,null,'taxa da creator (varia por produto)')}
    ${feeRow('Mídia GMV Max',C.ads,null,'custo de campanha')}
    ${feeRow('Frete líquido',C.fre,null,'')}
    </tbody></table>
    <div class="note green"><span>✅</span><div>A <b>comissão bate 6% ao centavo</b> (validado em 480+ pedidos). O "serviço+frete acima" é majoritariamente <b>frete não-subsidiado</b> que você absorve — custo real, a revisar caso a caso, não overcharge garantido.</div></div></div>`;
  const causa=(lbl,n,cor,val)=>`<div class="casc-row"><div class="casc-lbl">${lbl}${val!=null?'<small>'+fmt(val)+'</small>':''}</div><div class="casc-bar"><i style="width:${Math.min(100,n/Math.max(1,C.n_total)*100)}%;background:${cor}"></i></div><div class="casc-val">${NUM.format(n)}</div></div>`;
  const causas=`<div class="sec"><div class="sec-h"><h2>Conciliação por status</h2><div class="meta">${NUM.format(C.n_total)} pedidos</div></div>

  const mx=Math.max(C.tabela,1);
  const promo=`<div class="grid2">

      ${cascRow('Preço de tabela','soma dos preços "de"',C.tabela,'#cbd5e1',mx)}

  </div>`;
  return k+casc+causas+promo+renderConcDrillShell();
}
function renderConcDrillShell(){
  return `<div class="sec"><div class="sec-h"><h2>Pedidos · conciliação linha a linha</h2>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <select id="conc-filtro" onchange="loadConcDrill()">

    <div id="conc-body"><div class="loading">Carregando pedidos…</div></div></div>`;

let CONCROWS=[];
async function loadConcDrill(){
  const ms=getMeses(), f=document.getElementById('conc-filtro')?document.getElementById('conc-filtro').value:'';
  let path='conciliacao_pedido?select=order_id,data,produto,qty,preco_tabela,desconto_pct,receita_liq,comissao_real,comissao_esperada,servico_frete_real,servico_frete_esperado,afiliada_real,ads_real,settlement,taxa_efetiva_pct,conciliacao&order=receita_liq.desc&limit=300';
  if(ms.length===1) path+=`&periodo=eq.${ms[0]}`; else if(ms.length) path+=`&periodo=in.(${ms.join(',')})`;
  if(f) path+=`&conciliacao=eq.${f}`;
  try{ const r=await admProxy('GET',path); CONCROWS=r.data||[]; renderConcTable(); }
  catch(e){ const b=document.getElementById('conc-body'); if(b) b.innerHTML=`<div class="empty">Rode <span class="mono">conciliacao_pedido.sql</span> pra ativar o drill.<br><small>${e.message}</small></div>`; }
}
function renderConcTable(){
  const b=document.getElementById('conc-body'); if(!b) return;
  const query=(document.getElementById('conc-search')?document.getElementById('conc-search').value:'').trim().toLowerCase();
  const rows=CONCROWS.filter(r=>!query||String(r.order_id).toLowerCase().includes(query));
  if(!rows.length){ b.innerHTML='<div class="empty">Nenhum pedido.</div>'; return; }

  const clip='max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';

  return syncBar+realBanner+k+tradTbl+vlTbl;
}
async function syncAdsCusto(file){
  if(!file) return;
  const msg=document.getElementById('ads-sync-msg'), set=(t,c)=>{if(msg){msg.textContent=t;msg.style.color=c||'var(--ink-48)';}};
  if(!window.XLSX){ set('biblioteca carregando — tente de novo','var(--orange)'); return; }
  set('lendo '+file.name+'…');
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true});
    const hdr=(aoa[0]||[]).map(h=>String(h==null?'':h).toLowerCase());
    const col=(...ks)=>hdr.findIndex(h=>ks.some(k=>h.includes(k)));
    const ci={dia:col('por dia','dia'),custo:col('custo do gmv','custo do gmv máximo'),rec:col('receita'),ped:col('pedidos de sku','pedidos'),roi:hdr.indexOf('roi')};
    if(ci.custo<0){ set('não achei "Custo do GMV máximo" — é o "Campaign overview data"?','var(--rhode-red)'); return; }
    const num=x=>{ if(typeof x==='number') return x; if(x==null) return 0; let s=String(x).trim().replace(/[^\d,.-]/g,''); if(s.includes(',')&&s.includes('.')) s=s.replace(/\./g,'').replace(',','.'); else if(s.includes(',')) s=s.replace(',','.'); return parseFloat(s)||0; };
    const rows=[];
    for(let i=1;i<aoa.length;i++){
      const r=aoa[i]; if(!r) continue; const d=r[ci.dia]; if(d==null||String(d).includes('Total')) continue;
      let dt=null; if(d instanceof Date) dt=d; else { const m=String(d).match(/(\d{4})-(\d{2})-(\d{2})/); if(m) dt=new Date(Date.UTC(+m[1],+m[2]-1,+m[3])); }
      if(!dt||isNaN(dt.getTime())) continue;
      const iso=dt.toISOString().slice(0,10);
      rows.push({id:iso,data:iso,periodo:iso.slice(0,7),custo:Math.round(num(r[ci.custo])*100)/100,receita:ci.rec>=0?Math.round(num(r[ci.rec])*100)/100:0,pedidos:Math.round(ci.ped>=0?num(r[ci.ped]):0),roi:ci.roi>=0?Math.round(num(r[ci.roi])*100)/100:0});
    }
    if(!rows.length){ set('nenhuma linha de custo encontrada','var(--rhode-red)'); return; }
    set('enviando '+rows.length+' dias…');
    await admProxy('POST','ads_custo?on_conflict=id',{body:rows,prefer:'resolution=merge-duplicates,return=minimal'});
    const tot=rows.reduce((s,x)=>s+x.custo,0);
    alert('✓ '+rows.length+' dias importados · custo R$ '+Math.round(tot).toLocaleString('pt-BR')+'. Atualizando o painel.');
    await load();
  }catch(e){ set('erro: '+e.message,'var(--rhode-red)'); }
}

async function loadPedidos(){
  const ms=getMeses();
  let path='pedido_conciliado?select=order_id,data,produto,status,pago,settlement,taxa_pct,situacao&order=pago.desc&limit=400';
  if(ms.length===1) path+=`&periodo=eq.${ms[0]}`;
  else if(FILTER.modo==='range'&&FILTER.de&&FILTER.ate) path+=`&data=gte.${FILTER.de}&data=lte.${FILTER.ate}`;
  else if(ms.length) path+=`&periodo=in.(${ms.join(',')})`;
  try{
    const r=await admProxy('GET',path);
    PEDIDOS=r.data||[];
    renderPedidosTable();
  }catch(e){
    document.getElementById('ped-body').innerHTML=`<div class="empty">Rode <span class="mono">pedido_conciliado.sql</span> pra ativar o drill-down por pedido.<br><small>${e.message}</small></div>`;
  }
}
function renderPedidosTable(){
  const q=(document.getElementById('ped-search')?.value||'').trim().toLowerCase();
  const rows=PEDIDOS.filter(p=>!q||String(p.order_id).toLowerCase().includes(q));
  const body=document.getElementById('ped-body'); if(!body) return;
  if(!rows.length){ body.innerHTML='<div class="empty">Nenhum pedido.</div>'; return; }
  const sit=s=>s==='liquidado'?'<span class="tag ok">liquidado</span>':s==='devolvido'?'<span class="tag warn">devolvido</span>':'<span class="tag mut">a receber</span>';
  body.innerHTML=`<div style="font-size:11.5px;color:var(--ink-48);margin-bottom:10px">${rows.length} pedidos (top 400 por valor) · ${periodoLabel()}</div>
  <table><thead><tr><th>Pedido</th><th>Data</th><th>Produto</th><th>Pago</th><th>Settlement</th><th>Taxa</th><th>Situação</th></tr></thead>
  <tbody>${rows.slice(0,200).map(p=>`<tr>
    <td class="mono" style="font-size:11px">${p.order_id}</td>
    <td class="mp">${p.data||'—'}</td>
    <td class="mp" style="max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${(p.produto||'').replace(/"/g,'')}">${p.produto||'—'}</td>
    <td>${fmt2(+p.pago||0)}</td><td>${fmt2(+p.settlement||0)}</td>
    <td>${p.taxa_pct!=null?p.taxa_pct+'%':'—'}</td><td>${sit(p.situacao)}</td></tr>`).join('')}</tbody></table>`;
}
function filterPedidos(){ renderPedidosTable(); }

// ===== EXPORTAR RELATÓRIO (XLSX multi-aba) =====
async function exportRelatorio(){
  if(!window.XLSX){ alert('Biblioteca de exportação ainda carregando — tente de novo em 2s.'); return; }
  const btn=document.getElementById('btn-export'), orig=btn?btn.textContent:'';
  if(btn){ btn.textContent='Gerando…'; btn.disabled=true; }
  const B=v=>Math.round((+v||0)*100)/100;
  try{
    const ms=getMeses(), D=agg(ms), C=D.conc, feeTot=C.com_real+C.serv_real+C.afi+C.ads;
    const wb=XLSX.utils.book_new();
    // 1) RESUMO EXECUTIVO
    const s1=[['RELATÓRIO DE CONCILIAÇÃO — RHODE'],['Período',periodoLabel()],['Gerado em',new Date().toLocaleString('pt-BR')],[],
      ['RECEITA & REPASSE','R$'],
      ['GMV oficial (Seller Center)',B(D.gmvOficial||D.faturamento)],['GMV bruto (todos pedidos)',B(D.gmv)],
      ['Receita líquida (base das taxas)',B(C.receita)],['Repasse líquido (settlement)',B(C.repasse)],
      ['Taxa efetiva (% da receita)',C.receita?B(feeTot/C.receita*100):0],[],
      ['PROMOÇÃO — o que você banca','R$'],
      ['Preço de tabela',B(C.tabela)],['Desconto do vendedor',B(C.desc)],['% desconto',C.tabela?B(C.desc/C.tabela*100):0],[],
      ['TAXAS (real, deduzido do repasse)','R$'],
      ['Comissão plataforma (6%)',B(C.com_real)],['Serviço + frete grátis',B(C.serv_real)],
      ['Comissão afiliada',B(C.afi)],['Mídia GMV Max (settlement)',B(C.ads)],['Frete líquido',B(C.fre)],[],
      ['CONCILIAÇÃO POR STATUS','qtd'],
      ['Conciliado (ok)',C.n_ok],['Serviço/frete a revisar',C.n_serv],['Com devolução',C.n_dev],
      ['Comissão acima',C.n_com],['Repasse faltante',C.n_falt],['Cancelado',C.n_canc],[],
      ['ALERTAS','R$'],
      ['Impacto tarifa 15/07 (por mês)',B(C.imp)],['A recuperar (repasse faltante)',B(C.faltante)]];
    const ws1=XLSX.utils.aoa_to_sheet(s1); ws1['!cols']=[{wch:36},{wch:16}]; XLSX.utils.book_append_sheet(wb,ws1,'Resumo');
    // 2) CONCILIAÇÃO POR MÊS
    const h2=['Mês','Pedidos','Receita','Repasse','Comissão real','Comissão esp','Serv/frete real','Serv/frete esp','Afiliada','Ads','Desconto vend','% desc','Impacto 15/07','ok','revisar','faltante'];
    const s2=[h2]; ms.forEach(m=>{const c=CONC[m]; if(!c)return; s2.push([m,c.pedidos_total,B(c.receita),B(c.repasse),B(c.comissao_real),B(c.comissao_esp),B(c.servico_real),B(c.servico_esp),B(c.afiliada),B(c.ads),B(c.desconto_vendedor),c.preco_tabela?B(c.desconto_vendedor/c.preco_tabela*100):0,B(c.impacto_1507),c.n_ok,c.n_servico,c.n_faltante]);});
    const ws2=XLSX.utils.aoa_to_sheet(s2); ws2['!cols']=h2.map((_,i)=>({wch:i===0?9:14})); XLSX.utils.book_append_sheet(wb,ws2,'Conciliação por mês');
    // 3) PEDIDOS (completo)
    let path='conciliacao_pedido?select=order_id,periodo,data,produto,qty,preco_tabela,desconto_vendedor,desconto_pct,receita_liq,comissao_real,comissao_esperada,servico_frete_real,servico_frete_esperado,afiliada_real,ads_real,frete_real,custo_devolucao,settlement,taxa_efetiva_pct,div_comissao,div_servico_frete,impacto_1507,conciliacao&order=receita_liq.desc';
    if(ms.length===1) path+=`&periodo=eq.${ms[0]}`; else if(ms.length) path+=`&periodo=in.(${ms.join(',')})`;
    let ped=[]; try{ const r=await admProxy('GET',path,{paged:true}); ped=r.data||[]; }catch(e){}
    const h3=['Pedido','Período','Data','Produto','Qtd','Preço tabela','Desc vendedor','Desc %','Receita líq','Comissão real','Comissão esp','Serv/frete real','Serv/frete esp','Afiliada','Ads','Frete','Custo devol','Repasse','Taxa %','Div comissão','Div serv/frete','Impacto 15/07','Status'];
    const s3=[h3].concat(ped.map(p=>[p.order_id,p.periodo,p.data,p.produto,+p.qty||0,B(p.preco_tabela),B(p.desconto_vendedor),B(p.desconto_pct),B(p.receita_liq),B(p.comissao_real),B(p.comissao_esperada),B(p.servico_frete_real),B(p.servico_frete_esperado),B(p.afiliada_real),B(p.ads_real),B(p.frete_real),B(p.custo_devolucao),B(p.settlement),B(p.taxa_efetiva_pct),B(p.div_comissao),B(p.div_servico_frete),B(p.impacto_1507),p.conciliacao]));
    const ws3=XLSX.utils.aoa_to_sheet(s3); ws3['!cols']=[{wch:20},{wch:9},{wch:11},{wch:34}].concat(h3.slice(4).map(()=>({wch:13}))); ws3['!autofilter']={ref:'A1:'+XLSX.utils.encode_col(h3.length-1)+'1'};
    XLSX.utils.book_append_sheet(wb,ws3,'Pedidos ('+ped.length+')');
    // 4) PRODUTOS
    const prod=Object.entries(D.margAgg).map(([n,v])=>({n,...v})).filter(x=>x.gmv>0).sort((a,b)=>b.gmv-a.gmv);
    const s4=[['Produto','Qtd','GMV','Custo CPV','Contribuição','Margem líq','Margem %']];
    prod.forEach(x=>{const contrib=x.gmvCpv-x.custo, liq=x.gmvCpv*D.eficFrac-x.custo; s4.push([x.n,x.qty,B(x.gmvCpv),B(x.custo),B(contrib),B(liq),x.gmvCpv?B(liq/x.gmvCpv*100):0]);});
    const ws4=XLSX.utils.aoa_to_sheet(s4); ws4['!cols']=[{wch:42},{wch:8},{wch:13},{wch:13},{wch:13},{wch:13},{wch:10}]; XLSX.utils.book_append_sheet(wb,ws4,'Produtos');
    // 5) ADS
    const s5=[['Campanha','Modelo','Gasto','Receita','ROI','Pedidos']];
    Object.entries(D.ad.camp).map(([n,c])=>({n,...c})).sort((a,b)=>b.receita-a.receita).forEach(c=>{s5.push([c.n,c.custo>0?'Tradicional':'Vendas Líquidas',B(c.custo),B(c.receita),c.custo>0?B(c.receita/c.custo):'',c.pedidos]);});
    const ws5=XLSX.utils.aoa_to_sheet(s5); ws5['!cols']=[{wch:46},{wch:16},{wch:12},{wch:13},{wch:8},{wch:9}]; XLSX.utils.book_append_sheet(wb,ws5,'Ads GMV Max');
    const per=periodoLabel().replace(/[^\w]+/g,'-').replace(/^-|-$/g,'');
    XLSX.writeFile(wb, `Relatorio Conciliacao ${per}_${new Date().toISOString().slice(0,10)}.xlsx`);
  }catch(e){ alert('Erro ao gerar relatório: '+e.message); }
  finally{ if(btn){ btn.textContent=orig; btn.disabled=false; } }
}

function enter(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  load().catch(e=>{ document.getElementById('content').innerHTML=`<div class="loading">Erro: ${e.message}</div>`; });
}
if(admToken()) enter();
