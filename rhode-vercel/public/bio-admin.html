<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Rhode Bio · Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0A0A0A;
  --panel:#141414;
  --panel-2:#1c1c1c;
  --fg:#FFFFFF;
  --amarelo:#F2D413;
  --grafite:#4A4A48;
  --nevoa:#B5B2AC;
  --hairline:rgba(255,255,255,.1);
  --hairline-2:rgba(255,255,255,.18);
  --ink-48:rgba(255,255,255,.5);
  --ink-64:rgba(255,255,255,.66);
  --red:#f66;
  --green:#4ade80;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{
  font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);color:var(--fg);
  min-height:100vh;min-height:100svh;
  overflow-x:hidden;
}
input,button,select,textarea{font-family:inherit;color:inherit;background:none;border:none;outline:none}

/* ── HEADER ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--hairline);
  gap:12px;flex-wrap:wrap;
}
.brand{font-family:'Montserrat',sans-serif;font-weight:800;font-size:15px;letter-spacing:-.02em;text-transform:uppercase}
.brand .dot{color:var(--amarelo)}
.brand small{font-family:'DM Sans',sans-serif;font-weight:500;font-size:10px;letter-spacing:.2em;color:var(--nevoa);margin-left:10px;text-transform:uppercase}
.topbar-actions{display:flex;gap:8px;align-items:center}
.link-view{
  font-family:'DM Sans',sans-serif;font-size:11px;color:var(--ink-48);
  text-decoration:none;letter-spacing:.06em;
  padding:6px 10px;border:1px solid var(--hairline);border-radius:99px;
  transition:border-color .15s,color .15s;
}
.link-view:hover{border-color:var(--hairline-2);color:var(--fg)}
.btn-logout{
  font-size:11px;letter-spacing:.06em;color:var(--ink-48);cursor:pointer;padding:6px 10px;
  border:1px solid var(--hairline);border-radius:99px;
  transition:border-color .15s,color .15s;
}
.btn-logout:hover{border-color:var(--red);color:var(--red)}

/* ── LOGIN ── */
.login{
  min-height:100vh;min-height:100svh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 20px;gap:16px;
}
.login-brand{font-family:'Montserrat',sans-serif;font-weight:800;font-size:22px;letter-spacing:-.02em;text-transform:uppercase;margin-bottom:8px}
.login-brand .dot{color:var(--amarelo)}
.login-sub{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--nevoa);font-weight:500;margin-bottom:24px}
.login-form{width:100%;max-width:280px;display:flex;flex-direction:column;gap:10px}
.login-form input{
  height:44px;padding:0 14px;background:var(--panel);border:1px solid var(--hairline);border-radius:10px;
  font-size:14px;
}
.login-form input:focus{border-color:var(--amarelo)}
.login-form button{
  height:44px;background:var(--amarelo);color:var(--bg);
  font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  border-radius:10px;cursor:pointer;transition:transform .1s;
}
.login-form button:active{transform:scale(.98)}
.login-form button[disabled]{opacity:.5;cursor:not-allowed}
.login-err{color:var(--red);font-size:12px;text-align:center;min-height:16px}

/* ── APP ── */
.app{padding:20px;max-width:820px;margin:0 auto}
.actions-bar{
  display:flex;justify-content:space-between;align-items:center;
  margin:20px 0 14px;gap:10px;flex-wrap:wrap;
}
.title{font-family:'Montserrat',sans-serif;font-weight:700;font-size:18px;letter-spacing:-.015em}
.title small{font-family:'DM Sans',sans-serif;font-weight:500;font-size:11px;letter-spacing:.08em;color:var(--ink-48);text-transform:uppercase;margin-left:10px}
.btn-primary{
  background:var(--amarelo);color:var(--bg);
  padding:9px 16px;border-radius:8px;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  cursor:pointer;transition:transform .1s;
}
.btn-primary:active{transform:scale(.97)}

.list{display:flex;flex-direction:column;gap:8px}
.row{
  background:var(--panel);border:1px solid var(--hairline);border-radius:12px;
  overflow:hidden;transition:border-color .15s;
}
.row.inactive{opacity:.55}
.row.destaque{border-color:rgba(242,212,19,.4)}
.row-summary{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;cursor:default;
}
.row-icon{
  width:38px;height:38px;border-radius:9px;
  background:rgba(255,255,255,.05);border:1px solid var(--hairline);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
}
.row.destaque .row-icon{background:var(--amarelo);border-color:var(--amarelo);color:var(--bg)}
.row-info{flex:1;min-width:0}
.row-titulo{
  font-family:'Montserrat',sans-serif;font-weight:700;font-size:14px;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.row-sub{font-size:11.5px;color:var(--ink-64);margin-top:2px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-badges{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.badge{
  font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  padding:2px 7px;border-radius:99px;font-weight:600;
  background:rgba(255,255,255,.06);color:var(--ink-64);
}
.badge.on{background:rgba(74,222,128,.14);color:var(--green)}
.badge.off{background:rgba(255,102,102,.14);color:var(--red)}
.badge.dst{background:var(--amarelo);color:var(--bg)}
.row-actions{display:flex;gap:4px;flex-shrink:0}
.icon-btn{
  width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-64);cursor:pointer;font-size:14px;
  border:1px solid transparent;
  transition:background .15s,color .15s,border-color .15s;
}
.icon-btn:hover{background:rgba(255,255,255,.06);color:var(--fg);border-color:var(--hairline)}
.icon-btn.danger:hover{color:var(--red);border-color:rgba(255,102,102,.3)}
.icon-btn:disabled{opacity:.3;cursor:not-allowed}

/* ── EDIT ── */
.row-edit{
  display:none;
  padding:14px 16px 18px;
  border-top:1px solid var(--hairline);
  background:var(--panel-2);
}
.row.editing .row-edit{display:block}
.row.editing{border-color:var(--hairline-2)}
.form-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.form-grid{grid-template-columns:1fr 1fr}}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-48);font-weight:500}
.field input,.field select{
  height:38px;padding:0 12px;background:var(--panel);border:1px solid var(--hairline);border-radius:8px;font-size:13px;
}
.field input:focus,.field select:focus{border-color:var(--amarelo)}
.check-row{display:flex;gap:20px;flex-wrap:wrap;margin-top:4px}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.check input{
  width:18px;height:18px;accent-color:var(--amarelo);cursor:pointer;
}
.form-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.btn-save{
  padding:9px 16px;background:var(--amarelo);color:var(--bg);
  border-radius:8px;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
}
.btn-save:disabled{opacity:.5;cursor:not-allowed}
.btn-cancel{
  padding:9px 16px;color:var(--ink-64);border:1px solid var(--hairline);
  border-radius:8px;font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
}
.btn-cancel:hover{border-color:var(--hairline-2);color:var(--fg)}

/* toast */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--panel);border:1px solid var(--hairline-2);
  padding:10px 18px;border-radius:99px;font-size:13px;font-weight:500;
  z-index:100;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
.toast.err{border-color:var(--red);color:var(--red)}
.toast.ok{border-color:var(--green);color:var(--green)}

.empty{text-align:center;padding:60px 20px;color:var(--ink-48);font-size:13px}
.spin{text-align:center;padding:40px;color:var(--ink-48);font-size:11px;letter-spacing:.2em;text-transform:uppercase}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login" id="login">
  <div class="login-brand">Rhode<span class="dot">.</span></div>
  <div class="login-sub">Bio · Admin</div>
  <form class="login-form" id="loginForm">
    <input type="password" id="pwd" placeholder="senha admin" autocomplete="current-password" autofocus>
    <button type="submit" id="btnLogin">Entrar</button>
    <div class="login-err" id="loginErr"></div>
  </form>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="topbar">
    <div class="brand">Rhode<span class="dot">.</span>Bio<small>Admin</small></div>
    <div class="topbar-actions">
      <a class="link-view" href="/bio.html" target="_blank">Ver ao vivo ↗</a>
      <div class="btn-logout" id="btnLogout">Sair</div>
    </div>
  </div>

  <div class="app">
    <div class="actions-bar">
      <div class="title">Blocos<small id="counter">—</small></div>
      <button class="btn-primary" id="btnNew">+ Novo bloco</button>
    </div>
    <div class="list" id="list">
      <div class="spin">Carregando…</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(()=>{
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const el={
  login:$('#login'),app:$('#app'),
  loginForm:$('#loginForm'),pwd:$('#pwd'),loginErr:$('#loginErr'),btnLogin:$('#btnLogin'),
  btnLogout:$('#btnLogout'),btnNew:$('#btnNew'),list:$('#list'),counter:$('#counter'),
  toast:$('#toast'),
};

const TK='bio_admin_token';
let token=null;
try{token=sessionStorage.getItem(TK)}catch(e){}

function toast(msg,kind){
  el.toast.textContent=msg;
  el.toast.className='toast on '+(kind||'');
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>el.toast.className='toast',2400);
}

// ── auth
async function login(pass){
  const r=await fetch('/api/get-hub',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'admin_login',pass})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.token) throw new Error(j.error||'senha inválida');
  token=j.token;
  try{sessionStorage.setItem(TK,token)}catch(e){}
  return token;
}

async function api(method,path,body){
  const r=await fetch('/api/get-hub',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'admin_query',adminToken:token,method,path,body,prefer:method==='POST'?'return=representation':undefined})});
  const j=await r.json().catch(()=>({}));
  if(r.status===401){ token=null; try{sessionStorage.removeItem(TK)}catch(e){} showLogin(); throw new Error('sessão expirou'); }
  if(!r.ok) throw new Error(j.error||'erro '+r.status);
  return j.data;
}

function showLogin(){ el.login.style.display='flex'; el.app.style.display='none'; el.pwd.value=''; setTimeout(()=>el.pwd.focus(),50); }
function showApp(){ el.login.style.display='none'; el.app.style.display='block'; loadList(); }

el.loginForm.addEventListener('submit',async(e)=>{
  e.preventDefault();
  const p=el.pwd.value.trim();
  if(!p) return;
  el.btnLogin.disabled=true;el.btnLogin.textContent='Entrando…';el.loginErr.textContent='';
  try{ await login(p); showApp(); }
  catch(err){ el.loginErr.textContent=err.message; }
  finally{ el.btnLogin.disabled=false;el.btnLogin.textContent='Entrar'; }
});
el.btnLogout.addEventListener('click',()=>{ token=null; try{sessionStorage.removeItem(TK)}catch(e){} showLogin(); });

// ── CRUD
let rows=[];
async function loadList(){
  el.list.innerHTML='<div class="spin">Carregando…</div>';
  try{
    rows=await api('GET','rhode_links?select=*&order=destaque.desc,ordem.asc,id.asc');
    render();
  }catch(err){
    el.list.innerHTML='<div class="empty">Erro: '+err.message+'</div>';
  }
}

function fmt(v){ return v==null?'':String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

function render(){
  el.counter.textContent=(rows||[]).length?`${rows.length} · ${rows.filter(r=>r.ativo).length} ativos`:'0';
  if(!rows||!rows.length){ el.list.innerHTML='<div class="empty">Sem blocos ainda. Cria o primeiro.</div>'; return; }
  el.list.innerHTML=rows.map((r,i)=>{
    const cls='row'+(r.ativo?'':' inactive')+(r.destaque?' destaque':'');
    const badges=[
      r.ativo?'<span class="badge on">ativo</span>':'<span class="badge off">off</span>',
      r.destaque?'<span class="badge dst">destaque</span>':'',
      `<span class="badge">ordem ${r.ordem}</span>`,
    ].filter(Boolean).join('');
    return `
      <div class="row ${cls}" data-id="${r.id}" data-idx="${i}">
        <div class="row-summary">
          <div class="row-icon">${fmt(r.icone||'→')}</div>
          <div class="row-info">
            <div class="row-titulo">${fmt(r.titulo)}</div>
            <div class="row-sub">${fmt(r.subtitulo||r.url)}</div>
            <div class="row-badges">${badges}</div>
          </div>
          <div class="row-actions">
            <button class="icon-btn" data-act="up"    title="Subir">↑</button>
            <button class="icon-btn" data-act="down"  title="Descer">↓</button>
            <button class="icon-btn" data-act="edit"  title="Editar">✎</button>
            <button class="icon-btn danger" data-act="del" title="Deletar">×</button>
          </div>
        </div>
        <div class="row-edit"></div>
      </div>`;
  }).join('');
  el.list.querySelectorAll('.row').forEach(rowEl=>{
    const id=+rowEl.dataset.id;
    const idx=+rowEl.dataset.idx;
    rowEl.querySelectorAll('[data-act]').forEach(b=>{
      b.addEventListener('click',(e)=>{
        e.stopPropagation();
        const act=b.dataset.act;
        if(act==='up')   move(id,-1);
        if(act==='down') move(id, 1);
        if(act==='edit') openEdit(rowEl,id);
        if(act==='del')  del(id);
      });
    });
  });
}

async function move(id,dir){
  const i=rows.findIndex(r=>r.id===id);
  const swapWith=i+dir;
  if(swapWith<0||swapWith>=rows.length) return;
  const a=rows[i],b=rows[swapWith];
  try{
    await api('PATCH','rhode_links?id=eq.'+a.id,{ordem:b.ordem});
    await api('PATCH','rhode_links?id=eq.'+b.id,{ordem:a.ordem});
    toast('reordenado','ok');
    loadList();
  }catch(err){ toast(err.message,'err'); }
}

async function del(id){
  if(!confirm('Deletar esse bloco?')) return;
  try{
    await api('DELETE','rhode_links?id=eq.'+id);
    toast('deletado','ok');
    loadList();
  }catch(err){ toast(err.message,'err'); }
}

function openEdit(rowEl,id){
  const r=rows.find(x=>x.id===id) || {ordem:(rows.at(-1)?.ordem||0)+10,ativo:true,destaque:false,icone:'→'};
  const isNew=!id;
  document.querySelectorAll('.row.editing').forEach(e=>{e.classList.remove('editing');e.querySelector('.row-edit').innerHTML=''});
  rowEl.classList.add('editing');
  const editEl=rowEl.querySelector('.row-edit');
  editEl.innerHTML=`
    <div class="form-grid">
      <div class="field full"><label>Título</label><input id="f-titulo" value="${fmt(r.titulo||'')}" placeholder="Ex: Compre pelo site" maxlength="80"></div>
      <div class="field full"><label>Subtítulo (opcional)</label><input id="f-sub" value="${fmt(r.subtitulo||'')}" placeholder="Descrição curta" maxlength="120"></div>
      <div class="field full"><label>URL</label><input id="f-url" value="${fmt(r.url||'')}" placeholder="https://..." type="url"></div>
      <div class="field"><label>Ícone (emoji)</label><input id="f-icone" value="${fmt(r.icone||'')}" placeholder="🛍" maxlength="4"></div>
      <div class="field"><label>Ordem</label><input id="f-ordem" value="${r.ordem||10}" type="number" step="10"></div>
      <div class="field full check-row">
        <label class="check"><input type="checkbox" id="f-ativo" ${r.ativo?'checked':''}> Ativo (aparece no bio)</label>
        <label class="check"><input type="checkbox" id="f-destaque" ${r.destaque?'checked':''}> Destaque (fundo amarelo)</label>
      </div>
      <div class="form-actions full">
        <button class="btn-cancel" data-a="cancel">Cancelar</button>
        <button class="btn-save" data-a="save">${isNew?'Criar':'Salvar'}</button>
      </div>
    </div>`;
  editEl.querySelector('[data-a="cancel"]').addEventListener('click',()=>{ rowEl.classList.remove('editing'); editEl.innerHTML=''; if(isNew) loadList(); });
  editEl.querySelector('[data-a="save"]').addEventListener('click',async()=>{
    const body={
      titulo: editEl.querySelector('#f-titulo').value.trim(),
      subtitulo: editEl.querySelector('#f-sub').value.trim()||null,
      url: editEl.querySelector('#f-url').value.trim(),
      icone: editEl.querySelector('#f-icone').value.trim()||null,
      ordem: parseInt(editEl.querySelector('#f-ordem').value,10)||100,
      ativo: editEl.querySelector('#f-ativo').checked,
      destaque: editEl.querySelector('#f-destaque').checked,
    };
    if(!body.titulo||!body.url){ toast('titulo e url são obrigatórios','err'); return; }
    if(!/^https?:\/\//.test(body.url)){ toast('url deve começar com http(s)://','err'); return; }
    const btn=editEl.querySelector('[data-a="save"]');btn.disabled=true;btn.textContent='Salvando…';
    try{
      if(isNew) await api('POST','rhode_links',body);
      else      await api('PATCH','rhode_links?id=eq.'+id,body);
      toast('salvo','ok');
      loadList();
    }catch(err){ toast(err.message,'err');btn.disabled=false;btn.textContent=isNew?'Criar':'Salvar'; }
  });
}

// Add novo bloco — cria uma "row" placeholder e abre editor
el.btnNew.addEventListener('click',()=>{
  const placeholder=document.createElement('div');
  placeholder.className='row editing';
  placeholder.dataset.id='';
  placeholder.dataset.idx='-1';
  placeholder.innerHTML='<div class="row-summary" style="opacity:.6"><div class="row-icon">＋</div><div class="row-info"><div class="row-titulo">Novo bloco</div><div class="row-sub">preencha abaixo</div></div></div><div class="row-edit"></div>';
  el.list.insertBefore(placeholder,el.list.firstChild);
  openEdit(placeholder,0);
});

// ── boot
if(token) showApp(); else showLogin();
})();
</script>
</body>
</html>
