<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Rhode Jeans</title>
<meta name="description" content="Rhode Jeans · denim brasileiro. Feito pra durar.">
<meta property="og:title" content="Rhode Jeans">
<meta property="og:description" content="Denim feito pra durar.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://creators.rhodejeans.com.br/logo.png">
<link rel="preconnect" href="https://ivzpykuluxcxefhyzfsf.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;1,700&family=DM+Sans:wght@500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;1,700&family=DM+Sans:wght@500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;1,700&family=DM+Sans:wght@500&display=swap"></noscript>
<style>
:root{
  --bg:#0A0A0A;
  --fg:#FFFFFF;
  --amarelo:#F2D413;
  --grafite:#4A4A48;
  --nevoa:#B5B2AC;
  --hairline:rgba(255,255,255,.12);
  --card:rgba(74,74,72,.32);
  --card-hover:rgba(74,74,72,.55);
  --ink-64:rgba(255,255,255,.64);
  --ink-48:rgba(255,255,255,.5);
  --font-heading:'Montserrat',-apple-system,sans-serif;
  --font-body:'DM Sans',-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{
  font-family:var(--font-body);
  background:var(--bg);color:var(--fg);
  min-height:100vh;min-height:100svh;
  padding:32px 20px 64px;
  display:flex;flex-direction:column;align-items:center;
  overflow-x:hidden;
  background-attachment:fixed;
}
@media(max-width:480px){body{padding:24px 18px 56px}}
.wrap{width:100%;max-width:480px}
.brand{
  display:flex;flex-direction:column;align-items:center;
  margin-bottom:32px;
}
.logo{display:inline-flex;align-items:baseline;line-height:1}
.logo-main{
  font-family:var(--font-heading);
  font-weight:800;letter-spacing:-.02em;line-height:1;
  font-size:clamp(30px,8vw,42px);
  text-transform:uppercase;
}
.logo-dot{color:var(--amarelo);margin-left:.02em}
.logo-jeans{
  font-family:var(--font-heading);
  font-weight:700;font-style:italic;line-height:1;
  font-size:clamp(8px,1.9vw,10.5px);
  text-transform:uppercase;letter-spacing:.05em;
  margin-left:4px;
}
.tagline{
  font-family:var(--font-body);
  font-size:clamp(10px,2.4vw,11.5px);
  letter-spacing:.28em;text-transform:uppercase;
  color:var(--nevoa);font-weight:500;
  margin-top:12px;
}
/* ── HERO card (topo) ── */
.hero{
  display:none;text-decoration:none;color:var(--fg);
  background:var(--card);border:1px solid var(--hairline);
  border-radius:16px;padding:22px 20px;
  margin-bottom:14px;
  transition:transform .12s ease,filter .12s ease;
}
.hero.show{display:block}
.hero:active{transform:scale(.985)}
.hero .hero-kicker{
  display:inline-flex;align-items:center;gap:7px;
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  background:rgba(255,255,255,.14);color:inherit;
  padding:5px 11px;border-radius:20px;margin-bottom:12px;
}
.hero h2{
  font-family:var(--font-heading);
  font-size:24px;font-weight:700;line-height:1.15;margin-bottom:6px;letter-spacing:-.01em;
}
.hero p{font-size:13.5px;opacity:.85;line-height:1.45}
.hero .hero-go{
  display:inline-block;margin-top:14px;
  font-size:13px;font-weight:700;letter-spacing:.04em;
  border-bottom:1.5px solid currentColor;padding-bottom:2px;
}
.hero.is-live{background:#D24B3F;color:#fff;border-color:#D24B3F}
.hero.is-live .hero-kicker{background:#fff;color:#D24B3F}
.hero .dot{
  width:8px;height:8px;border-radius:50%;background:currentColor;
  animation:pulse 1.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.55}}

/* ── Divisor de seção ── */
.sect{
  display:flex;align-items:center;gap:10px;
  margin:16px 2px 4px;
}
.sect .rule{flex:1;height:1px;background:var(--hairline)}
.sect .txt{
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-48);font-weight:600;
}

.blocks{display:flex;flex-direction:column;gap:10px}
.block{
  display:flex;align-items:center;gap:14px;
  background:var(--card);border:1px solid var(--hairline);
  padding:14px 16px;border-radius:12px;
  text-decoration:none;color:var(--fg);
  min-height:56px;
  transition:background .15s,border-color .15s,transform .1s;
}
@media(min-width:481px){.block{padding:16px 18px;border-radius:14px}}
@media(hover:hover){.block:hover{background:var(--card-hover);border-color:rgba(255,255,255,.2)}}
.block:active{transform:scale(.985)}
.block.destaque{background:var(--amarelo);border-color:var(--amarelo);color:var(--bg)}
@media(hover:hover){.block.destaque:hover{filter:brightness(.94)}}
.block.ghost{background:transparent;border-color:rgba(255,255,255,.35)}
.block.solid{border-color:transparent}
@media(hover:hover){.block.solid:hover,.block.ghost:hover{filter:brightness(1.08)}}
.block-icon{
  width:36px;height:36px;border-radius:10px;
  background:rgba(255,255,255,.06);border:1px solid var(--hairline);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;flex-shrink:0;line-height:1;
}
@media(min-width:481px){.block-icon{width:40px;height:40px;border-radius:12px;font-size:19px}}
.block.destaque .block-icon{background:var(--bg);border-color:var(--bg);color:var(--amarelo)}
.block-info{flex:1;min-width:0}
.block-titulo{
  font-family:var(--font-heading);
  font-weight:700;font-size:14.5px;letter-spacing:-.005em;line-height:1.25;
}
@media(min-width:481px){.block-titulo{font-size:15px}}
.block.destaque .block-titulo,.block.solid .block-titulo{color:inherit}
.block-sub{
  font-size:11.5px;color:var(--ink-64);margin-top:2px;line-height:1.4;
}
.block.destaque .block-sub{color:rgba(10,10,10,.7)}
.block.solid .block-sub{color:currentColor;opacity:.72}
.block.ghost .block-sub{color:rgba(255,255,255,.6)}
.block-arrow{color:var(--ink-48);font-size:16px;flex-shrink:0;line-height:1}
.block.destaque .block-arrow,.block.solid .block-arrow{color:inherit;opacity:.85}

/* ── Chips (rodapé, marketplaces & links secundários) ── */
.chips{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  margin-top:14px;
}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;color:var(--ink-64);text-decoration:none;
  border:1px solid var(--hairline);border-radius:20px;padding:6px 13px;
  transition:border-color .12s,color .12s;
}
.chip:hover{border-color:var(--fg);color:var(--fg)}
.chip .chip-ico{font-size:12px;line-height:1}

footer{
  margin-top:32px;text-align:center;
  font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--ink-48);font-weight:500;
}
footer .sep{color:var(--amarelo);margin:0 8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="logo">
      <span class="logo-main">Rhode<span class="logo-dot">.</span></span>
      <span class="logo-jeans">Jeans</span>
    </div>
    <div class="tagline">Denim brasileiro · Fábrica própria</div>
  </div>
  <a class="hero" id="hero" href="#" rel="noopener">
    <span class="hero-kicker" id="hero-kicker"></span>
    <h2 id="hero-title"></h2>
    <p id="hero-desc"></p>
    <span class="hero-go" id="hero-go"></span>
  </a>
  <div class="blocks" id="blocks"></div>
  <div class="chips" id="chips"></div>
  <footer>RHODE<span class="sep">.</span>JEANS<span class="sep">·</span>2026</footer>
</div>
<script>
(()=>{
const SB='https://ivzpykuluxcxefhyzfsf.supabase.co';
const AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2enB5a3VsdXhjeGVmaHl6ZnNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3Mzc5MzYsImV4cCI6MjA5MTMxMzkzNn0.4_ZShB2t3yCg8ag7-LPWvzHXVrTmj0N4iKWp_tEZb9g';
const CACHE_KEY='bio_v5'; // bump — hero + seções + chips
const el=document.getElementById('blocks');
const chipsEl=document.getElementById('chips');
const heroEl=document.getElementById('hero');
// live mode overridable por ?live=1 (útil pra live team abrir sem tocar no admin)
const LIVE_OVERRIDE=new URLSearchParams(location.search).get('live')==='1';
const ESC={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>ESC[c]);
const safe=u=>{try{const x=new URL(u);return['http:','https:','mailto:','tel:'].includes(x.protocol)?u:'#'}catch(e){return'#'}};
// só permite valores CSS conservadores em cores (evita XSS via style)
const cssColor=v=>{if(!v||typeof v!=='string')return null;const s=v.trim();return /^(#[0-9a-f]{3,8}|rgb|hsl|[a-z]+)/i.test(s)&&s.length<40&&!/[;"'<>]/.test(s)?s:null};
const cssInt=(v,min,max,dflt)=>{const n=parseInt(v,10);return Number.isFinite(n)&&n>=min&&n<=max?n:dflt};
// só aceita URL de imagem do Supabase Storage do projeto (bio-assets)
const SUPABASE_HOST='ivzpykuluxcxefhyzfsf.supabase.co';
const safeImg=u=>{try{const x=new URL(u);return x.host===SUPABASE_HOST&&x.pathname.startsWith('/storage/v1/object/public/bio-assets/')?x.href:null}catch(e){return null}};
// fontes permitidas (Google Fonts)
const FONT_WHITELIST=['Montserrat','DM Sans','Playfair Display','Space Grotesk','Inter','Poppins','Manrope','Archivo','Bebas Neue','Cormorant Garamond','Work Sans','Nunito','Lora','Fraunces','Outfit'];
const safeFont=v=>FONT_WHITELIST.includes(v)?v:null;
const injectedFonts=new Set(['Montserrat','DM Sans']);
function injectFont(name){
  const nm=safeFont(name); if(!nm||injectedFonts.has(nm)) return;
  injectedFonts.add(nm);
  const l=document.createElement('link');
  l.rel='stylesheet';
  l.href=`https://fonts.googleapis.com/css2?family=${encodeURIComponent(nm)}:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&display=swap`;
  document.head.appendChild(l);
}

let sid;
try{sid=sessionStorage.getItem('bio_sid');if(!sid){sid=(crypto.randomUUID?crypto.randomUUID():'x'+Math.random().toString(36).slice(2)+Date.now().toString(36));sessionStorage.setItem('bio_sid',sid)}}
catch(e){sid='x'+Math.random().toString(36).slice(2)}

function applyConfig(c){
  if(!c) return;
  const root=document.documentElement, body=document.body;
  const pageBg=cssColor(c.page_bg), pageBg2=cssColor(c.page_bg_2);
  const img=safeImg(c.page_bg_image);
  if(c.page_bg_type==='image'&&img){
    const overlay=cssColor(c.page_bg_overlay)||'rgba(10,10,10,0.55)';
    body.style.background=`linear-gradient(${overlay}, ${overlay}), url("${img}") center/cover no-repeat`;
    body.style.backgroundAttachment='fixed';
  }else if(c.page_bg_type==='gradient'&&pageBg&&pageBg2){
    const ang=cssInt(c.page_bg_angle,0,360,180);
    body.style.background=`linear-gradient(${ang}deg, ${pageBg}, ${pageBg2})`;
    body.style.backgroundAttachment='fixed';
  }else if(pageBg){ body.style.background=pageBg; }
  const acc=cssColor(c.accent_color); if(acc) root.style.setProperty('--amarelo',acc);
  const fg=cssColor(c.text_color); if(fg) root.style.setProperty('--fg',fg);
  const cb=cssColor(c.card_bg); if(cb) root.style.setProperty('--card',cb);
  // fontes dinâmicas
  const fh=safeFont(c.font_heading); if(fh){ injectFont(fh); root.style.setProperty('--font-heading', `'${fh}',-apple-system,sans-serif`); }
  const fb=safeFont(c.font_body); if(fb){ injectFont(fb); root.style.setProperty('--font-body', `'${fb}',-apple-system,BlinkMacSystemFont,sans-serif`); }
  if(c.tagline!=null){ const t=document.querySelector('.tagline'); if(t) t.textContent=c.tagline; }
}

function styleForBlock(r){
  const m=(r.meta&&r.meta.styles)||{};
  const preset=m.preset||(r.destaque?'destaque':'default');
  const bg=cssColor(m.bg), color=cssColor(m.color);
  let cls='block '+preset, styleStr='';
  if(preset==='solid'){
    if(bg) styleStr+='background:'+bg+';border-color:'+bg+';';
    if(color) styleStr+='color:'+color+';';
  }else if(preset==='ghost'){
    if(bg) styleStr+='border-color:'+bg+';';
    if(color) styleStr+='color:'+color+';';
  }else if(preset==='destaque'&&bg){
    styleStr+='background:'+bg+';border-color:'+bg+';';
    if(color) styleStr+='color:'+color+';';
  }
  return {cls,styleStr};
}

// Se URL for wa.me/N e r.wa_msg estiver preenchido → wa.me/N?text=<encoded>
function urlFor(r){
  const u=safe(r.url); if(!u||u==='#') return '#';
  if(!r.wa_msg) return u;
  try{
    const x=new URL(u);
    if(x.hostname==='wa.me'||x.hostname==='api.whatsapp.com'){
      if(!x.searchParams.has('text')) x.searchParams.set('text', r.wa_msg);
      return x.toString();
    }
  }catch(e){}
  return u;
}

function renderHero(hero,liveMode){
  if(!hero){ heroEl.classList.remove('show','is-live'); return; }
  const isLive=liveMode||LIVE_OVERRIDE;
  heroEl.classList.add('show');
  if(isLive){
    heroEl.classList.add('is-live');
    heroEl.href=safe(hero.live_url||hero.url);
    document.getElementById('hero-kicker').innerHTML='<span class="dot"></span> '+esc(hero.live_kicker||'AO VIVO AGORA');
    document.getElementById('hero-title').textContent=hero.live_titulo||'A live tá rolando!';
    document.getElementById('hero-desc').textContent=hero.live_desc||'';
    document.getElementById('hero-go').textContent=hero.live_cta||'Entrar na live →';
    heroEl.style.background=''; heroEl.style.color='';
  }else{
    heroEl.classList.remove('is-live');
    heroEl.href=safe(hero.url);
    const bg=cssColor(hero.bg), color=cssColor(hero.color);
    heroEl.style.background=bg||'';
    heroEl.style.color=color||'';
    heroEl.style.borderColor=bg||'';
    document.getElementById('hero-kicker').textContent=hero.kicker||'';
    document.getElementById('hero-title').textContent=hero.titulo||'';
    document.getElementById('hero-desc').textContent=hero.descricao||'';
    document.getElementById('hero-go').textContent=hero.cta||'→';
  }
  heroEl.addEventListener('click',()=>track('hero_click',{live:isLive,titulo:isLive?(hero.live_titulo||''):(hero.titulo||''),url:heroEl.href}),{once:true});
}

function render(rows){
  if(!rows||!rows.length){el.innerHTML='';chipsEl.innerHTML='';return}
  // separa chips (preset=chip) dos blocks
  const chips=[], blocks=[];
  for(const r of rows){
    const preset=(r.meta&&r.meta.styles&&r.meta.styles.preset)||(r.destaque?'destaque':'default');
    if(preset==='chip') chips.push(r); else blocks.push(r);
  }
  // Render blocks agrupados por seção
  let out='', currentSecao=null;
  for(const r of blocks){
    const secao=(r.secao||'').trim();
    if(secao&&secao!==currentSecao){
      out+='<div class="sect"><span class="rule"></span><span class="txt">'+esc(secao)+'</span><span class="rule"></span></div>';
      currentSecao=secao;
    }else if(!secao){
      currentSecao=null;
    }
    const {cls,styleStr}=styleForBlock(r);
    const sub=r.subtitulo?'<div class="block-sub">'+esc(r.subtitulo)+'</div>':'';
    const st=styleStr?' style="'+styleStr+'"':'';
    const href=urlFor(r);
    out+='<a class="'+cls+'"'+st+' href="'+esc(href)+'" target="_blank" rel="noopener" data-lid="'+r.id+'" data-tit="'+esc(r.titulo)+'">'
      +'<div class="block-icon">'+esc(r.icone||'→')+'</div>'
      +'<div class="block-info"><div class="block-titulo">'+esc(r.titulo)+'</div>'+sub+'</div>'
      +'<div class="block-arrow">→</div></a>';
  }
  el.innerHTML=out;
  // Render chips no rodapé
  chipsEl.innerHTML=chips.map(r=>{
    const href=urlFor(r);
    return '<a class="chip" href="'+esc(href)+'" target="_blank" rel="noopener" data-lid="'+r.id+'" data-tit="'+esc(r.titulo)+'">'
      +(r.icone?'<span class="chip-ico">'+esc(r.icone)+'</span>':'')
      +esc(r.titulo)+'</a>';
  }).join('');
  // Click tracking pra ambos
  document.querySelectorAll('.block,.chip').forEach(a=>{
    a.addEventListener('click',()=>track('link_click',{link_id:a.dataset.lid,titulo:a.dataset.tit,url:a.href}));
  });
}

function track(evento,meta){
  try{
    const p={action:'track',aba:'bio_rhode',evento,session_id:sid,meta:meta||{},referrer:document.referrer||null};
    const b=new Blob([JSON.stringify(p)],{type:'application/json'});
    if(navigator.sendBeacon&&navigator.sendBeacon('/api/get-hub',b))return;
    fetch('/api/get-hub',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p),keepalive:true}).catch(()=>{});
  }catch(e){}
}

// 1. Render cache imediatamente
let cached=null;
try{const raw=localStorage.getItem(CACHE_KEY);if(raw){cached=JSON.parse(raw);if(cached){applyConfig(cached.cfg);if(cached.rows) render(cached.rows);if(cached.hero!==undefined) renderHero(cached.hero,cached.hero&&cached.hero.live_mode)}}}catch(e){}

// 2. Fresh fetch paralelo — config + hero + links
const H={apikey:AK,Authorization:'Bearer '+AK};
Promise.all([
  fetch(SB+'/rest/v1/rhode_bio_config?select=page_bg,page_bg_type,page_bg_2,page_bg_angle,page_bg_image,page_bg_overlay,accent_color,text_color,tagline,font_heading,font_body,card_bg&id=eq.1',{headers:H}).then(r=>r.ok?r.json():[]).then(a=>a&&a[0]||null).catch(()=>null),
  fetch(SB+'/rest/v1/rhode_bio_hero?select=*&id=eq.1&limit=1',{headers:H}).then(r=>r.ok?r.json():[]).then(a=>a&&a[0]||null).catch(()=>null),
  fetch(SB+'/rest/v1/rhode_links_efetivos?select=id,titulo,subtitulo,url,icone,destaque,meta,secao,wa_msg',{headers:H}).then(r=>r.ok?r.json():null).catch(()=>null),
]).then(([cfg,hero,rows])=>{
  if(cfg===null&&hero===null&&rows===null)return;
  const same=cached&&JSON.stringify(cached.cfg)===JSON.stringify(cfg)&&JSON.stringify(cached.hero)===JSON.stringify(hero)&&JSON.stringify(cached.rows)===JSON.stringify(rows);
  if(!same){
    if(cfg) applyConfig(cfg);
    renderHero(hero,hero&&hero.live_mode);
    if(rows) render(rows);
    try{localStorage.setItem(CACHE_KEY,JSON.stringify({cfg,hero,rows,at:Date.now()}))}catch(e){}
  }
});

// 3. Track page_view
setTimeout(()=>track('page_view',{}),50);
})();
</script>
</body>
</html>
