<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Rhode Jeans</title>
<meta name="description" content="Rhode Jeans · denim brasileiro. Feito pra durar.">
<meta property="og:title" content="Rhode Jeans">
<meta property="og:description" content="Denim feito pra durar.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://creators.rhodejeans.com.br/logo.png">
<link rel="preconnect" href="https://ivzpykuluxcxefhyzfsf.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;1,700&family=DM+Sans:wght@500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;1,700&family=DM+Sans:wght@500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;1,700&family=DM+Sans:wght@500&display=swap"></noscript>
<style>
:root{
  --bg:#0A0A0A;
  --fg:#FFFFFF;
  --amarelo:#F2D413;
  --grafite:#4A4A48;
  --nevoa:#B5B2AC;
  --hairline:rgba(255,255,255,.12);
  --card:rgba(74,74,72,.32);
  --card-hover:rgba(74,74,72,.55);
  --ink-64:rgba(255,255,255,.64);
  --ink-48:rgba(255,255,255,.5);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{
  font-family:'DM Sans',-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;
  background:var(--bg);color:var(--fg);
  min-height:100vh;min-height:100svh;
  padding:32px 20px 64px;
  display:flex;flex-direction:column;align-items:center;
  overflow-x:hidden;
}
@media(max-width:480px){body{padding:24px 18px 56px}}
.wrap{width:100%;max-width:480px}
.brand{
  display:flex;flex-direction:column;align-items:center;
  margin-bottom:32px;
}
.logo{display:inline-flex;align-items:baseline;line-height:1}
.logo-main{
  font-family:'Montserrat',-apple-system,sans-serif;
  font-weight:800;letter-spacing:-.02em;line-height:1;
  font-size:clamp(30px,8vw,42px);
  text-transform:uppercase;
}
.logo-dot{color:var(--amarelo);margin-left:.02em}
.logo-jeans{
  font-family:'Montserrat',-apple-system,sans-serif;
  font-weight:700;font-style:italic;line-height:1;
  font-size:clamp(8px,1.9vw,10.5px);
  text-transform:uppercase;letter-spacing:.05em;
  margin-left:4px;
}
.tagline{
  font-family:'DM Sans',-apple-system,sans-serif;
  font-size:clamp(10px,2.4vw,11.5px);
  letter-spacing:.28em;text-transform:uppercase;
  color:var(--nevoa);font-weight:500;
  margin-top:12px;
}
.blocks{display:flex;flex-direction:column;gap:10px}
.block{
  display:flex;align-items:center;gap:14px;
  background:var(--card);border:1px solid var(--hairline);
  padding:14px 16px;border-radius:12px;
  text-decoration:none;color:var(--fg);
  min-height:56px;
  transition:background .15s,border-color .15s,transform .1s;
}
@media(min-width:481px){.block{padding:16px 18px;border-radius:14px}}
@media(hover:hover){.block:hover{background:var(--card-hover);border-color:rgba(255,255,255,.2)}}
.block:active{transform:scale(.985)}
.block.destaque{background:var(--amarelo);border-color:var(--amarelo);color:var(--bg)}
@media(hover:hover){.block.destaque:hover{filter:brightness(.94)}}
.block.ghost{background:transparent;border-color:rgba(255,255,255,.35)}
.block.solid{border-color:transparent}
@media(hover:hover){.block.solid:hover,.block.ghost:hover{filter:brightness(1.08)}}
.block-icon{
  width:36px;height:36px;border-radius:10px;
  background:rgba(255,255,255,.06);border:1px solid var(--hairline);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;flex-shrink:0;line-height:1;
}
@media(min-width:481px){.block-icon{width:40px;height:40px;border-radius:12px;font-size:19px}}
.block.destaque .block-icon{background:var(--bg);border-color:var(--bg);color:var(--amarelo)}
.block-info{flex:1;min-width:0}
.block-titulo{
  font-family:'Montserrat',-apple-system,sans-serif;
  font-weight:700;font-size:14.5px;letter-spacing:-.005em;line-height:1.25;
}
@media(min-width:481px){.block-titulo{font-size:15px}}
.block.destaque .block-titulo,.block.solid .block-titulo{color:inherit}
.block-sub{
  font-size:11.5px;color:var(--ink-64);margin-top:2px;line-height:1.4;
}
.block.destaque .block-sub{color:rgba(10,10,10,.7)}
.block.solid .block-sub{color:currentColor;opacity:.72}
.block.ghost .block-sub{color:rgba(255,255,255,.6)}
.block-arrow{color:var(--ink-48);font-size:16px;flex-shrink:0;line-height:1}
.block.destaque .block-arrow,.block.solid .block-arrow{color:inherit;opacity:.85}
footer{
  margin-top:32px;text-align:center;
  font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--ink-48);font-weight:500;
}
footer .sep{color:var(--amarelo);margin:0 8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="logo">
      <span class="logo-main">Rhode<span class="logo-dot">.</span></span>
      <span class="logo-jeans">Jeans</span>
    </div>
    <div class="tagline">Denim brasileiro · Fábrica própria</div>
  </div>
  <div class="blocks" id="blocks"></div>
  <footer>RHODE<span class="sep">.</span>JEANS<span class="sep">·</span>2026</footer>
</div>
<script>
(()=>{
const SB='https://ivzpykuluxcxefhyzfsf.supabase.co';
const AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2enB5a3VsdXhjeGVmaHl6ZnNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3Mzc5MzYsImV4cCI6MjA5MTMxMzkzNn0.4_ZShB2t3yCg8ag7-LPWvzHXVrTmj0N4iKWp_tEZb9g';
const CACHE_KEY='bio_v3'; // bump — schema mudou (config + meta)
const el=document.getElementById('blocks');
const ESC={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>ESC[c]);
const safe=u=>{try{const x=new URL(u);return['http:','https:','mailto:','tel:'].includes(x.protocol)?u:'#'}catch(e){return'#'}};
// só permite valores CSS conservadores em cores (evita XSS via style)
const cssColor=v=>{if(!v||typeof v!=='string')return null;const s=v.trim();return /^(#[0-9a-f]{3,8}|rgb|hsl|[a-z]+)/i.test(s)&&s.length<40&&!/[;"'<>]/.test(s)?s:null};
const cssInt=(v,min,max,dflt)=>{const n=parseInt(v,10);return Number.isFinite(n)&&n>=min&&n<=max?n:dflt};

let sid;
try{sid=sessionStorage.getItem('bio_sid');if(!sid){sid=(crypto.randomUUID?crypto.randomUUID():'x'+Math.random().toString(36).slice(2)+Date.now().toString(36));sessionStorage.setItem('bio_sid',sid)}}
catch(e){sid='x'+Math.random().toString(36).slice(2)}

function applyConfig(c){
  if(!c) return;
  const root=document.documentElement, body=document.body;
  const pageBg=cssColor(c.page_bg), pageBg2=cssColor(c.page_bg_2);
  if(c.page_bg_type==='gradient'&&pageBg&&pageBg2){
    const ang=cssInt(c.page_bg_angle,0,360,180);
    body.style.background=`linear-gradient(${ang}deg, ${pageBg}, ${pageBg2})`;
    body.style.backgroundAttachment='fixed';
  }else if(pageBg){ body.style.background=pageBg; }
  const acc=cssColor(c.accent_color); if(acc) root.style.setProperty('--amarelo',acc);
  const fg=cssColor(c.text_color); if(fg) root.style.setProperty('--fg',fg);
  const cb=cssColor(c.card_bg); if(cb) root.style.setProperty('--card',cb);
  if(c.tagline!=null){ const t=document.querySelector('.tagline'); if(t) t.textContent=c.tagline; }
}

function styleForBlock(r){
  const m=(r.meta&&r.meta.styles)||{};
  const preset=m.preset||(r.destaque?'destaque':'default');
  const bg=cssColor(m.bg), color=cssColor(m.color);
  let cls='block '+preset, styleStr='';
  if(preset==='solid'){
    if(bg) styleStr+='background:'+bg+';border-color:'+bg+';';
    if(color) styleStr+='color:'+color+';';
  }else if(preset==='ghost'){
    if(bg) styleStr+='border-color:'+bg+';';
    if(color) styleStr+='color:'+color+';';
  }else if(preset==='destaque'&&bg){
    // permite override do amarelo padrão
    styleStr+='background:'+bg+';border-color:'+bg+';';
    if(color) styleStr+='color:'+color+';';
  }
  return {cls,styleStr};
}

function render(rows){
  if(!rows||!rows.length){el.innerHTML='';return}
  el.innerHTML=rows.map(r=>{
    const {cls,styleStr}=styleForBlock(r);
    const sub=r.subtitulo?'<div class="block-sub">'+esc(r.subtitulo)+'</div>':'';
    const st=styleStr?' style="'+styleStr+'"':'';
    return '<a class="'+cls+'"'+st+' href="'+esc(safe(r.url))+'" target="_blank" rel="noopener" data-lid="'+r.id+'" data-tit="'+esc(r.titulo)+'">'
      +'<div class="block-icon">'+esc(r.icone||'→')+'</div>'
      +'<div class="block-info"><div class="block-titulo">'+esc(r.titulo)+'</div>'+sub+'</div>'
      +'<div class="block-arrow">→</div></a>';
  }).join('');
  el.querySelectorAll('.block').forEach(a=>{
    a.addEventListener('click',()=>track('link_click',{link_id:a.dataset.lid,titulo:a.dataset.tit,url:a.href}));
  });
}

function track(evento,meta){
  try{
    const p={action:'track',aba:'bio_rhode',evento,session_id:sid,meta:meta||{},referrer:document.referrer||null};
    const b=new Blob([JSON.stringify(p)],{type:'application/json'});
    if(navigator.sendBeacon&&navigator.sendBeacon('/api/get-hub',b))return;
    fetch('/api/get-hub',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p),keepalive:true}).catch(()=>{});
  }catch(e){}
}

// 1. Render cache imediatamente
let cached=null;
try{const raw=localStorage.getItem(CACHE_KEY);if(raw){cached=JSON.parse(raw);if(cached){applyConfig(cached.cfg);if(cached.rows) render(cached.rows)}}}catch(e){}

// 2. Fresh fetch paralelo — config + links
const H={apikey:AK,Authorization:'Bearer '+AK};
Promise.all([
  fetch(SB+'/rest/v1/rhode_bio_config?select=*&id=eq.1',{headers:H}).then(r=>r.ok?r.json():[]).then(a=>a&&a[0]||null).catch(()=>null),
  fetch(SB+'/rest/v1/rhode_links_efetivos?select=id,titulo,subtitulo,url,icone,destaque,meta',{headers:H}).then(r=>r.ok?r.json():null).catch(()=>null),
]).then(([cfg,rows])=>{
  if(cfg===null&&rows===null)return;
  const same=cached&&JSON.stringify(cached.cfg)===JSON.stringify(cfg)&&JSON.stringify(cached.rows)===JSON.stringify(rows);
  if(!same){
    if(cfg) applyConfig(cfg);
    if(rows) render(rows);
    try{localStorage.setItem(CACHE_KEY,JSON.stringify({cfg,rows,at:Date.now()}))}catch(e){}
  }
});

// 3. Track page_view
setTimeout(()=>track('page_view',{}),50);
})();
</script>
</body>
</html>
