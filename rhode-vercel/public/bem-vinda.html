<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<title>Rhode Creators · Triagem</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f5f2;--surface:#ffffff;--text:#222222;--dim:#6a6a6a;--dimmer:#a8a8a8;
  --red:#FE2C55;--green:#00796b;--orange:#c05e00;--gold:#9a7030;
  --border:rgba(0,0,0,0.08);
  --sh:rgba(0,0,0,0.02) 0px 0px 0px 1px,rgba(0,0,0,0.04) 0px 2px 6px,rgba(0,0,0,0.1) 0px 4px 8px;
}
html{-webkit-text-size-adjust:100%}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}

#loading{display:flex;flex-direction:column;align-items:center;gap:16px}
.loading-logo{font-weight:800;font-size:28px;letter-spacing:-1px}
.loading-logo span{color:var(--red)}
.loading-dot{display:flex;gap:6px}
.loading-dot i{width:6px;height:6px;border-radius:50%;background:var(--red);opacity:.3;animation:pulse 1.2s ease-in-out infinite}
.loading-dot i:nth-child(2){animation-delay:.2s}.loading-dot i:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

#app{display:none;width:100%;max-width:420px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;margin-bottom:20px;text-align:center}
.logo span{color:var(--red)}

.card{background:var(--surface);box-shadow:var(--sh);border-radius:24px;overflow:hidden}
.card-header{padding:22px 24px 18px;border-bottom:1px solid var(--border)}
.kicker{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--dimmer);margin-bottom:8px}
.headline{font-weight:800;font-size:21px;letter-spacing:-.4px;line-height:1.25}
.card-body{padding:18px 24px 22px}

.progress{display:flex;gap:4px;margin-bottom:16px}
.progress i{height:3px;flex:1;border-radius:2px;background:var(--border);transition:background .2s}
.progress i.on{background:var(--red)}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 16px;border-radius:14px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-family:inherit;color:var(--text);transition:border-color .15s,background .15s,transform .15s,box-shadow .15s}
.opt:hover,.opt:focus{border-color:var(--red);background:#fff;transform:translateY(-1px);box-shadow:var(--sh);outline:none}
.opt-emoji{font-size:20px;flex-shrink:0;width:24px;text-align:center}
.opt-txt{flex:1}
.opt-title{font-weight:700;font-size:14.5px;line-height:1.2}
.opt-sub{display:block;font-size:12px;color:var(--dim);margin-top:3px;line-height:1.35}
.opt-arrow{color:var(--dimmer);font-size:18px;flex-shrink:0}

.field{margin-bottom:14px}
.field label{display:block;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dimmer);margin-bottom:6px}
.field input{width:100%;padding:14px;font-size:16px;font-family:inherit;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);outline:none;transition:border-color .15s,background .15s}
.field input:focus{border-color:var(--red);background:#fff}
.help{font-size:13.5px;color:var(--dim);line-height:1.55;margin-bottom:16px}

.cta{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:15px;border-radius:12px;border:none;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .2s,background .2s;margin-top:10px}
.cta-primary{background:#25D366;color:#fff;box-shadow:0 4px 16px rgba(37,211,102,.25)}
.cta-primary:hover{background:#1ebe5d;transform:translateY(-1px)}
.cta-dark{background:#222;color:#fff}.cta-dark:hover{background:#111;transform:translateY(-1px)}
.cta-red{background:var(--red);color:#fff;box-shadow:0 4px 16px rgba(254,44,85,.22)}.cta-red:hover{transform:translateY(-1px)}
.cta-outline{background:transparent;color:var(--dim);border:1px solid var(--border)}.cta-outline:hover{background:var(--bg);color:var(--text)}
.cta-disabled{background:var(--bg);color:var(--dimmer);border:1px dashed var(--border);cursor:default}
.cta-disabled:hover{transform:none}
.cta:disabled{opacity:.6;cursor:not-allowed}

.badge{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.5px;padding:5px 12px;border-radius:99px;border:1px solid var(--border);background:var(--bg)}
.label-sm{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--dimmer);margin-bottom:10px}
.desc{font-size:14px;color:var(--dim);line-height:1.6;margin-bottom:18px}
.gmv-badge{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg);border-radius:10px;margin-bottom:16px;border:1px solid var(--border)}
.gmv-badge .gv-l{font-family:'DM Mono',monospace;font-size:9px;color:var(--dimmer);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.gmv-badge .gv-v{font-weight:700;font-size:14px}

.steps-list{margin:0 0 18px;padding-left:0;list-style:none;counter-reset:s}
.steps-list li{position:relative;padding:8px 0 8px 30px;font-size:13.5px;color:var(--dim);line-height:1.5;border-bottom:1px solid var(--border);counter-increment:s}
.steps-list li:last-child{border-bottom:none}
.steps-list li::before{content:counter(s);position:absolute;left:0;top:7px;width:20px;height:20px;border-radius:50%;background:var(--text);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}

.foot{padding:13px 24px;border-top:1px solid var(--border);text-align:center}
.foot-t{font-family:'DM Mono',monospace;font-size:9px;color:var(--dimmer);line-height:1.7}
.foot-t a{color:var(--red);text-decoration:none}

.back{display:inline-flex;align-items:center;gap:4px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--dimmer);background:none;border:none;cursor:pointer;margin-bottom:12px;padding:4px 0}
.back:hover{color:var(--text)}
.err{color:var(--red);font-size:12px;margin-top:8px;min-height:16px;font-family:'DM Mono',monospace}
@media (max-width:380px){.headline{font-size:19px}.card-body{padding:16px 18px 20px}.card-header{padding:18px 18px 16px}.foot{padding:12px 18px}}
</style>
</head>
<body>

<div id="app"></div>
<script>

/* ════════════ CONFIG — preencher antes/depois de publicar ════════════════════

   WhatsApp da equipe. Preencher os links reais e rodar deploy de novo. */
const CONFIG={

  linkGrupoVIP:        '',   // convite do grupo "Rhode VIP" (Parceiras / top creators)

  whatsappEquipe:      '5511952759126',
  // mensagem padrão de quem escolhe "só quero ser avisada das flash sales" → redireciona direto pro WhatsApp do suporte
  flashSaleWhatsMsg:   'Oi, equipe Rhode! 👋 Quero entrar na lista de avisos das flash sales — me avisem quando rolar uma promoção relâmpago. ⚡🤍',

  linkCadastro:        '/cadastro.html',

  //    deixe vazio p/ não gravar; recebe os mesmos campos do payload de saveTriagem()
  sheetsTriagemURL:    '',
};
/* ════════════════════════════════════════════════════════════════════════════ */

const $=s=>document.querySelector(s);
const tokenFromURL=()=>new URLSearchParams(location.search).get('token')||'';
const waLink=msg=>`https://wa.me/${CONFIG.whatsappEquipe}?text=${encodeURIComponent(msg)}`;
const normHandle=h=>(h||'').trim().replace(/^@+/,'');
const R=v=>'R$ '+(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=p=>p+Math.random().toString(36).slice(2,8);

/* ───────────────── ESTADO ───────────────── */
const ST={
  relacao:null,   // afiliada_ativa | quer_vender  ("só quero flash sales" não chega aqui — redireciona pro WhatsApp)
  gmvFaixa:null,  // 0 | ate5k | 5a20k | 20a80k
  temPeca:null,   // sim | nao | quer_mais
  nome:'', handle:'', whatsapp:'',
  diagnostico:null,
  origem:'cold',  // cold | token
  gmv60d:0,       // só quando vem de token de affiliate
};

/* ───────────────── DIAGNÓSTICO ───────────────── */
// Triagem self-service: "já sou afiliada" → ativar/fechado/parceira_track (por GMV);
// "quero vender Rhode" → nova (entrar no programa + amostra grátis).
// "só quero flash sales" não passa por aqui — redireciona direto pro WhatsApp do suporte.
// vip não é auto-declarável — vem de classifyKnown (token c/ modelo=parceira ou GMV-60d ≥ 80k).
// nova_com_peca/nova_sem_peca seguem definidos mas só acessíveis via ?diagnostico=.
function computeDiag(){
  if(ST.relacao==='quer_vender') return 'nova';
  switch(ST.gmvFaixa){            // afiliada_ativa → faixa de GMV declarada
    case '20a80k':  return 'parceira_track';
    case '5a20k':   return 'fechado';
    case 'ate5k':   return 'fechado';
    case '0':       return 'ativar';
    default:        return 'fechado';
  }
}
// quem chega com token de affiliate já cadastrada → classificação direta, sem triagem
function classifyKnown(d){
  if(d.modelo==='parceira') return 'vip';
  if(d.modelo==='fechado')  return 'fechado';
  if(d.modelo==='aberto')   return 'ativar';
  if(d.gmv60d>=80000) return 'vip';
  if(d.gmv60d>=20000) return 'parceira_track';
  if(d.gmv60d>0)      return 'fechado';
  return 'ativar';
}

/* ───────────────── PERSISTÊNCIA (Google Sheets via Apps Script) ───────────────── */
function saveTriagem(){
  if(!CONFIG.sheetsTriagemURL) return;
  const p=new URLSearchParams();
  p.append('tipo','triagem');
  p.append('nome',ST.nome);
  p.append('tiktok',ST.handle); p.append('handle',ST.handle);
  p.append('whatsapp',ST.whatsapp);
  p.append('relacao',ST.relacao||'');
  p.append('gmv_faixa',ST.gmvFaixa||'');
  p.append('tem_peca',ST.temPeca||'');
  p.append('diagnostico',ST.diagnostico||'');
  p.append('origem',ST.origem);
  p.append('ts',new Date().toISOString());
  fetch(CONFIG.sheetsTriagemURL,{method:'POST',mode:'no-cors',body:p}).catch(()=>{});
}

/* ───────────────── SHELL / RENDER ───────────────── */
function shell(inner){
  return `<div class="logo">Rhode<span>.</span></div><div class="card">${inner}</div>
  <div class="foot"><div class="foot-t">Dúvidas? Fale com a equipe Rhode no <a href="${waLink('Oi! Tenho uma dúvida sobre o programa de creators da Rhode 🤍')}" target="_blank" rel="noopener">WhatsApp</a> · <a href="${CONFIG.linkAcesso}">Já tenho cadastro</a></div></div>`;
}
function mount(html){
  $('#loading').style.display='none';
  $('#app').innerHTML=shell(html);
  $('#app').style.display='block';
  window.scrollTo(0,0);
}
function bind(id,fn){ const el=document.getElementById(id); if(el&&fn) el.onclick=fn; }
function progressBar(n,total){
  let s='';for(let k=1;k<=total;k++)s+=`<i class="${k<=n?'on':''}"></i>`;
  return `<div class="progress">${s}</div>`;
}
function totalSteps(){
  if(ST.relacao==='quer_vender') return 2;          // relação → identidade
  if(ST.relacao==='afiliada_ativa') return 4;       // relação → gmv → peça → identidade
  return 3;                                         // relação → peça → identidade (fallback)
}

/* ───────────────── COMPONENTES ───────────────── */
function optBtn(emoji,title,sub,fn){
  const id=uid('o'); setTimeout(()=>bind(id,fn),0);
  return `<button class="opt" id="${id}"><span class="opt-emoji">${emoji}</span><span class="opt-txt"><span class="opt-title">${title}</span>${sub?`<span class="opt-sub">${sub}</span>`:''}</span><span class="opt-arrow">›</span></button>`;
}
function backBtn(fn){ const id=uid('b'); setTimeout(()=>bind(id,fn),0); return `<button class="back" id="${id}">‹ Voltar</button>`; }

/* ───────────────── TELAS DE PERGUNTA (triagem) ───────────────── */
function screenRelacao(){
  mount(`
    <div class="card-header"><div class="kicker">Programa de Creators · Rhode Jeans</div><div class="headline">Vamos te direcionar pro lugar certo</div></div>
    <div class="card-body">
      ${progressBar(1,3)}
      <p class="help">Qual é a sua relação com a Rhode hoje?</p>
      <div class="opts">
        ${optBtn('💸','Já sou afiliada da Rhode no TikTok Shop','Tenho meu link de afiliada da Rhode — vendendo ou ainda começando',()=>{ST.relacao='afiliada_ativa';screenGmv();})}
        ${optBtn('✨','Já vendo no TikTok e quero vender Rhode','Quero virar afiliada da Rhode e receber uma amostra grátis pra começar',()=>{ST.relacao='quer_vender';screenIdentity();})}
        ${optBtn('⚡','Só quero ser avisada das flash sales','Não quero o programa completo agora — vai direto pro WhatsApp do suporte',()=>{location.href=waLink(CONFIG.flashSaleWhatsMsg);})}
      </div>
    </div>`);
}

function screenGmv(){   // só afiliada_ativa
  mount(`
    <div class="card-header"><div class="kicker">Passo 2</div><div class="headline">Quanto você vendeu pela Rhode nos últimos ~60 dias?</div></div>
    <div class="card-body">
      ${progressBar(2,4)}
      ${backBtn(screenRelacao)}
      <p class="help">Valor aproximado de GMV (valor bruto de vendas). Pode estimar.</p>
      <div class="opts">
        ${optBtn('🚀','Ainda não vendi nada','R$ 0 — bora ativar',()=>{ST.gmvFaixa='0';screenPeca();})}
        ${optBtn('🌱','Até R$ 5.000','Começando a engrenar',()=>{ST.gmvFaixa='ate5k';screenPeca();})}
        ${optBtn('📈','R$ 5.000 – R$ 20.000','Vendendo com consistência',()=>{ST.gmvFaixa='5a20k';screenPeca();})}
        ${optBtn('🔥','R$ 20.000 ou mais','Top performer da Rhode',()=>{ST.gmvFaixa='20a80k';screenPeca();})}
      </div>
    </div>`);
}

function screenPeca(){
  const t=totalSteps(), n=(ST.relacao==='afiliada_ativa')?3:2;
  mount(`
    <div class="card-header"><div class="kicker">Passo ${n}</div><div class="headline">Você já tem alguma peça Rhode em casa pra gravar?</div></div>
    <div class="card-body">
      ${progressBar(n,t)}
      ${backBtn(ST.relacao==='afiliada_ativa'?screenGmv:screenRelacao)}
      <p class="help">A gente usa isso pra saber se precisa te enviar uma amostra antes de você começar a postar.</p>
      <div class="opts">
        ${optBtn('👖','Sim, tenho peça(s) Rhode comigo','Posso gravar assim que estiver tudo certo',()=>{ST.temPeca='sim';screenIdentity();})}
        ${optBtn('📦','Não tenho nenhuma peça ainda','Vou precisar de uma amostra',()=>{ST.temPeca='nao';screenIdentity();})}
        ${optBtn('🆕','Tenho, mas quero modelos novos pra gravar','Já comecei — quero renovar o conteúdo',()=>{ST.temPeca='quer_mais';screenIdentity();})}
      </div>
    </div>`);
}

/* ───────────────── IDENTIDADE ───────────────── */
function screenIdentity(){
  ST.diagnostico=computeDiag();
  mount(`
    <div class="card-header"><div class="kicker">Quase lá</div><div class="headline">Pra te direcionar certinho</div></div>
    <div class="card-body">
      ${progressBar(totalSteps(),totalSteps())}
      ${backBtn(ST.relacao==='quer_vender'?screenRelacao:screenPeca)}
      <p class="help">Só o básico — leva 30 segundos.</p>
      <form id="idf" autocomplete="off">
        <div class="field"><label>Nome</label><input id="f_nome" type="text" placeholder="Seu nome" value="${(ST.nome||'').replace(/"/g,'&quot;')}" required></div>
        <div class="field"><label>@ do TikTok</label><input id="f_handle" type="text" placeholder="@seuusuario" value="${ST.handle?('@'+ST.handle):''}" required></div>
        <div class="field"><label>WhatsApp (com DDD)</label><input id="f_wpp" type="tel" inputmode="tel" placeholder="(11) 9 9999-9999" value="${(ST.whatsapp||'').replace(/"/g,'&quot;')}" required></div>
        <button type="submit" class="cta cta-red" id="f_btn">Ver meu direcionamento</button>
        <div class="err" id="f_err"></div>
      </form>
    </div>`);
  $('#idf').addEventListener('submit',e=>{
    e.preventDefault();
    const nome=$('#f_nome').value.trim(), h=normHandle($('#f_handle').value), wpp=$('#f_wpp').value.trim();
    const err=$('#f_err');
    if(nome.length<2){err.textContent='Coloca seu nome.';return;}
    if(h.length<2){err.textContent='Coloca seu @ do TikTok.';return;}
    if(wpp.replace(/\D/g,'').length<10){err.textContent='WhatsApp com DDD, por favor.';return;}
    ST.nome=nome; ST.handle=h; ST.whatsapp=wpp;
    const btn=$('#f_btn'); btn.disabled=true; btn.textContent='Direcionando…';
    saveTriagem();
    setTimeout(screenResult,350);
  });
}

/* ───────────────── CARDS DE RESULTADO ───────────────── */
const WA_ICON='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg> ';

function ctaHTML(c){
  if(!c) return '';
  if(c.fn){ const id=uid('c'); setTimeout(()=>bind(id,c.fn),0); return `<button class="cta ${c.cls}" id="${id}">${c.icon||''}${c.label}</button>`; }
  if(!c.href) return `<span class="cta cta-disabled">${c.label} · em breve</span>`;
  return `<a class="cta ${c.cls}" href="${c.href}"${c.ext?' target="_blank" rel="noopener"':''}>${c.icon||''}${c.label}</a>`;
}
function hubHref(){ const t=tokenFromURL(); return t?`${CONFIG.linkHub}?token=${encodeURIComponent(t)}`:CONFIG.linkAcesso; }
function amostraCTA(label){
  const txt=label||'Solicitar amostra Rhode';
  const href=CONFIG.linkFormAmostra||waLink(`Oi! Quero solicitar uma amostra Rhode pra gravar 🤍 — meu @ no TikTok é @${ST.handle}`);
  return {label:txt,href,cls:'cta-outline',ext:true};
}

/* ───────────────── BOOTSTRAP ───────────────── */
async function getByToken(token){
  try{
    let r=await fetch(`${SB_URL}/rest/v1/affiliates?access_token=eq.${encodeURIComponent(token)}&limit=1`,{headers:SBH});
    let rows=r.ok?await r.json():[];
    if(rows&&rows.length){
      const row=rows[0];
      const handle=normHandle(row.tiktok_handle||row.affiliate_id||'').toLowerCase();
      let gmv60d=0;
      try{
        const since=new Date(Date.now()-60*864e5).toISOString().slice(0,7);
        const pr=await fetch(`${SB_URL}/rest/v1/performance_periods?affiliate_id=ilike.${encodeURIComponent(handle.toUpperCase())}&periodo=gte.${since}&select=gmv_liquido`,{headers:SBH});
        const ps=pr.ok?await pr.json():[];
        gmv60d=(ps||[]).reduce((s,p)=>s+(+p.gmv_liquido||0),0);
      }catch(e){}
      return {kind:'affiliate',nome:(row.nome||row.name||'@'+handle).split(' ')[0],handle,gmv60d,modelo:row.modelo||null};
    }
    r=await fetch(`${SB_URL}/rest/v1/eventos_creators?access_token=eq.${encodeURIComponent(token)}&limit=1`,{headers:SBH});
    rows=r.ok?await r.json():[];
    if(rows&&rows.length){
      const row=rows[0];
      return {kind:'evento',nome:(row.nome||row.name||'').split(' ')[0],handle:normHandle(row.handle||'').toLowerCase(),whatsapp:row.whatsapp||''};
    }
  }catch(e){}
  return null;
}

(async()=>{
  const q=new URLSearchParams(location.search);
  // preview: ?diagnostico=vip|parceira_track|fechado|ativar|nova|nova_com_peca|nova_sem_peca|onboarding  (&peca=sim|nao)
  if(q.get('diagnostico')){ ST.diagnostico=q.get('diagnostico'); ST.nome=q.get('nome')||'Preview'; ST.handle=q.get('handle')||'preview'; ST.temPeca=q.get('peca')||null; screenResult(); return; }
  // compat com teste antigo: ?gmv=10000&nome=Julia&modelo=parceira
  if(q.get('modelo')){
    const map={parceira:'vip',fechado:'fechado',aberto:'ativar',onboarding:'onboarding'};
    ST.diagnostico=map[q.get('modelo')]||'onboarding'; ST.nome=q.get('nome')||'Creator'; ST.handle='preview';
    ST.origem='token'; ST.gmv60d=parseFloat(q.get('gmv'))||0; screenResult(); return;
  }
  if(q.get('step')==='triagem'||q.get('triagem')==='1'){ screenRelacao(); return; }

  const token=q.get('token');
  if(token){
    const data=await getByToken(token);
    if(data&&data.kind==='affiliate'){
      ST.origem='token'; ST.nome=data.nome; ST.handle=data.handle; ST.gmv60d=data.gmv60d;
      ST.diagnostico=classifyKnown(data); screenResult(); return;
    }
    if(data&&data.kind==='evento'){
      ST.nome=data.nome||''; ST.handle=data.handle||''; ST.whatsapp=data.whatsapp||'';
      screenRelacao(); return;
    }
    // token inválido → triagem normal
  }
  screenRelacao();
})();
</script>
