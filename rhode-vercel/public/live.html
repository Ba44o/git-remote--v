<!doctype html>
<html lang=pt-BR>
<head>
  <meta charset=utf-8>
  <meta name=viewport content='width=device-width,initial-scale=1'>
  <meta name=color-scheme content='light dark'>
  <meta name=theme-color content='#000000'>
  <meta name=robots content='noindex,nofollow'>
  <meta http-equiv=Content-Security-Policy content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src https://*.supabase.co https://creators.rhodejeans.com.br 'self'; font-src 'self' data: https://fonts.gstatic.com">
  <title>Rhode Live</title>
  <link rel=preconnect href='https://ivzpykuluxcxefhyzfsf.supabase.co'>
  <link rel=dns-prefetch href='https://www.tiktok.com'>
  <link rel=dns-prefetch href='https://m.tiktok.com'>
  <link rel=preconnect href='https://fonts.googleapis.com'>
  <link rel=preconnect href='https://fonts.gstatic.com' crossorigin>
  <link rel=stylesheet href='https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap'>
  <style>
    /* Inter self-hosted via @font-face data URI (latin subset, weights 500/600) */
    
    
    :root{--rhode-red:#FE2C55;--ink:#1d1d1f;--parchment:#f5f5f7;--hairline:rgba(0,0,0,.08)}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{font-family:'Inter',system-ui,sans-serif;background:#000;color:#fff;min-height:100vh;min-height:100dvh;overflow-x:hidden;font-weight:400;-webkit-font-smoothing:antialiased}
    @supports(-webkit-touch-callout:none){body{min-height:-webkit-fill-available}}
    .stage{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center}
    /* LIVE_NOW state */
    .pulse{width:12px;height:12px;border-radius:50%;background:var(--rhode-red);box-shadow:0 0 0 0 var(--rhode-red);animation:pulse 1.4s ease-out infinite;margin-bottom:24px}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(254,44,85,.6)}70%{box-shadow:0 0 0 20px rgba(254,44,85,0)}100%{box-shadow:0 0 0 0 rgba(254,44,85,0)}}
    @media(prefers-reduced-motion:reduce){.pulse{animation:none}.redirect-bar::after{animation:none;transform:translateX(0)}}
    .live-title{font-size:14px;letter-spacing:.24em;text-transform:uppercase;opacity:.7;margin-bottom:12px;font-weight:500}
    .creator-handle{font-size:32px;font-weight:600;letter-spacing:-.02em;margin-bottom:6px}
    .live-sub{font-size:13px;opacity:.5;margin-bottom:48px}
    .redirect-bar{width:200px;height:2px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden;position:relative}
    .redirect-bar::after{content:'';position:absolute;inset:0;background:var(--rhode-red);width:100%;transform:translateX(-100%);animation:slide 800ms ease-out forwards}
    @keyframes slide{to{transform:translateX(0)}}
    /* BETWEEN_LIVES state */
    body.between{background:var(--parchment);color:var(--ink)}
    @media(prefers-color-scheme:dark){body.between{background:#fff;color:#1d1d1f}} /* força light no parchment, evita inversão iOS */
    .b-eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:rgba(0,0,0,.45);margin-bottom:24px;font-weight:500}
    .b-title{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin-bottom:8px;max-width:340px}
    .b-when{font-size:14px;color:rgba(0,0,0,.55);margin-bottom:16px;font-variant-numeric:tabular-nums}
    /* CUPOM movido pro topo: visível mesmo com teclado aberto */
    .b-coupon-top{display:inline-block;margin-bottom:32px;padding:8px 14px;border:1px solid var(--hairline);border-radius:999px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:#fff}
    .b-coupon-top b{color:var(--rhode-red);letter-spacing:.08em;font-weight:600}
    .b-form{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
    .b-input{height:52px;border:1px solid var(--hairline);background:#fff;border-radius:12px;padding:0 16px;font:inherit;font-size:16px;color:var(--ink);outline:none;transition:border-color .15s}
    .b-input:focus-visible{border-color:var(--ink);outline:2px solid rgba(29,29,31,.15);outline-offset:2px}
    .b-input.valid{border-color:#0a7a3f}
    .b-input.invalid{border-color:#c33}
    .b-error{color:#c33;font-size:13px;text-align:left;min-height:1.2em;padding:0 4px}
    .b-btn{height:52px;border:none;background:var(--ink);color:#fff;border-radius:12px;font:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:transform .1s}
    .b-btn:active{transform:scale(.98)}
    .b-btn[disabled]{opacity:.4;cursor:not-allowed}
    .b-thanks{color:#0a7a3f;font-size:14px;font-weight:500;margin-top:8px;padding:16px;background:#e8f5ed;border-radius:12px}
    .b-consent{font-size:11px;color:rgba(0,0,0,.45);text-align:center;line-height:1.4;margin-top:-4px}
    .b-consent a{color:rgba(0,0,0,.6);text-decoration:underline}
    .b-meta{display:flex;flex-direction:column;gap:0;width:100%;max-width:420px;padding-top:24px;border-top:1px solid var(--hairline)}
    .b-meta a{color:var(--ink);text-decoration:none;font-size:14px;display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--hairline)}
    .b-meta a:last-child{border:none}
    .b-meta a span:last-child{opacity:.4}
    /* honeypot — invisível pra humano, bot preenche */
    .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
    body.empty{background:var(--parchment);color:var(--ink)}
    .foot{position:fixed;bottom:16px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.35;font-variant-numeric:tabular-nums}
  </style>
</head>
<body>
  <main class=stage id=stage role=main aria-live=polite></main>
  <div class=foot>RHODE · VITRINE SP</div>

<script>
(()=>{
  // ── CONFIG ──
  const SB_URL='https://ivzpykuluxcxefhyzfsf.supabase.co';
  const SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2enB5a3VsdXhjeGVmaHl6ZnNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3Mzc5MzYsImV4cCI6MjA5MTMxMzkzNn0.4_ZShB2t3yCg8ag7-LPWvzHXVrTmj0N4iKWp_tEZb9g';
  const SBH={'apikey':SB_ANON,'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'};
  const REDIRECT_MS=800;          // teto duro
  const QUERY_BUDGET_MS=600;      // se queries não voltarem em 600ms, decisão usa fallback
  const GRACE_BEFORE_MS=5*60*1000;
  const GRACE_AFTER_MS=15*60*1000;
  const COUPONS_VALIDOS=['VITRINE10','LIVE10','TACI15'];

  // ── BOT FILTER ──
  const UA=navigator.userAgent||'';
  const IS_BOT=/bot|crawl|spider|preview|facebookexternalhit|whatsapp|telegram|slack|linkedin/i.test(UA);
  // bots ainda renderizam (não 404), mas tracking marca

  // ── ESCAPE HTML ──
  const ESC_MAP={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','/':'&#x2F;','`':'&#x60;','=':'&#x3D;'};
  const esc=s=>String(s==null?'':s).replace(/[&<>"'`=\/]/g,c=>ESC_MAP[c]);
  const escAttr=s=>esc(s);

  // ── PARSE PATH + SANITIZE ──
  const pathParts=location.pathname.split('/').filter(Boolean);
  let rawHandle=decodeURIComponent(pathParts[1]||'').replace(/^[@.]+/,'').toLowerCase();
  rawHandle=rawHandle.replace(/[^a-z0-9_.-]/g,''); // strict sanitize
  const validHandle=/^[a-z0-9_.-]{2,30}$/.test(rawHandle);
  const handleUpper=rawHandle.toUpperCase();

  const qs=new URLSearchParams(location.search);
  const rawCoupon=(qs.get('c')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,16);
  const coupon=COUPONS_VALIDOS.includes(rawCoupon)?rawCoupon:'VITRINE10';
  const forceState=qs.get('state'); // debug
  const isDebug=qs.get('debug')==='1';
  const scanSrc=qs.get('src')==='qr'?'qr':'link';

  // ── SESSION ID (localStorage com TTL pra dedup cross-tab; sessionStorage fallback) ──
  const SID_KEY='vitrine_sid';
  const SID_TTL=30*60*1000;
  let sid=null;
  try{
    const stored=JSON.parse(localStorage.getItem(SID_KEY)||'null');
    if(stored&&stored.exp>Date.now())sid=stored.id;
  }catch(e){}
  if(!sid){
    sid=(crypto.randomUUID?crypto.randomUUID():'x'+Math.random().toString(36).slice(2)+Date.now().toString(36));
    try{localStorage.setItem(SID_KEY,JSON.stringify({id:sid,exp:Date.now()+SID_TTL}))}catch(e){}
  }

  // ── DEDUP qr_scanned (não duplicar em refresh acidental <5min) ──
  const SCAN_KEY='vitrine_scanned_'+handleUpper;
  let alreadyScanned=false;
  try{
    const t=parseInt(sessionStorage.getItem(SCAN_KEY)||'0',10);
    if(t&&(Date.now()-t<5*60*1000))alreadyScanned=true;
  }catch(e){}

  // ── TRACK (via /api/get-hub action:'track' — sendBeacon-friendly) ──
  function track(evento,meta){
    if(isDebug)return;
    try{
      const payload={
        action:'track',
        affiliate_id:handleUpper||null,
        session_id:sid,
        evento,
        aba:'vitrine',
        meta:Object.assign({
          coupon,handle:rawHandle,path:location.pathname,
          scan_source:scanSrc,
          utm_source:qs.get('utm_source')||'vitrine_qr',
          utm_campaign:qs.get('utm_campaign')||'vitrine_sp',
          is_likely_bot:IS_BOT||undefined
        },meta||{}),
        referrer:document.referrer||null
      };
      const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
      if(navigator.sendBeacon){
        const ok=navigator.sendBeacon('/api/get-hub',blob);
        if(ok)return;
      }
      // fallback fetch keepalive
      fetch('/api/get-hub',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),keepalive:true}).catch(()=>{});
    }catch(e){}
  }

  // ── BUILD TIKTOK URL ──
  function buildTiktokUrl(creatorRow,scheduleRow){
    let base=null;
    // prioridade: tiktok_room_url da live > affiliate_link da creator > /@handle/live
    try{if(scheduleRow&&scheduleRow.tiktok_room_url)base=scheduleRow.tiktok_room_url}catch(e){}
    if(!base&&creatorRow&&typeof creatorRow.affiliate_link==='string'&&creatorRow.affiliate_link.startsWith('http'))base=creatorRow.affiliate_link;
    if(!base){
      const h=(creatorRow&&typeof creatorRow.tiktok_handle==='string'?creatorRow.tiktok_handle:rawHandle).replace(/^[@.]+/,'').toLowerCase();
      base='https://www.tiktok.com/@'+encodeURIComponent(h)+'/live';
    }
    try{
      const u=new URL(base);
      // só aceita hosts TikTok
      if(!/(^|\.)tiktok\.com$/.test(u.hostname)){
        // fallback se affiliate_link aponta pra outro lugar
        return 'https://www.tiktok.com/@'+encodeURIComponent(rawHandle)+'/live?utm_source=vitrine_qr&utm_medium=offline&utm_campaign=vitrine_sp&utm_content='+encodeURIComponent(rawHandle);
      }
      u.searchParams.set('utm_source','vitrine_qr');
      u.searchParams.set('utm_medium','offline');
      u.searchParams.set('utm_campaign','vitrine_sp');
      u.searchParams.set('utm_content',rawHandle);
      return u.toString();
    }catch(e){
      return 'https://www.tiktok.com/@'+encodeURIComponent(rawHandle)+'/live?utm_source=vitrine_qr&utm_medium=offline&utm_campaign=vitrine_sp&utm_content='+encodeURIComponent(rawHandle);
    }
  }

  // ── DATE/FMT helpers (sempre BRT) ──
  const FMT_HM=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit',hour12:false});
  const FMT_DM=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit'});
  function dayKeyBRT(d){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
  function formatNextLive(iso){
    if(!iso)return 'em breve';
    const d=new Date(iso);
    if(isNaN(d.getTime()))return 'em breve';
    const now=new Date();
    const diffMin=Math.round((d-now)/60000);
    if(diffMin>0&&diffMin<60)return `em ${diffMin} min · ${FMT_HM.format(d)}`;
    const today=dayKeyBRT(now);
    const target=dayKeyBRT(d);
    if(target===today)return `hoje · ${FMT_HM.format(d)}`;
    const tomorrow=new Date(now.getTime()+86400000);
    if(target===dayKeyBRT(tomorrow))return `amanhã · ${FMT_HM.format(d)}`;
    const diffDays=Math.round((d-now)/86400000);
    if(diffDays>=2&&diffDays<=7)return `em ${diffDays} dias · ${FMT_DM.format(d)}`;
    return `${FMT_DM.format(d)} · ${FMT_HM.format(d)}`;
  }

  // ── RENDER STATES ──
  const stage=document.getElementById('stage');
  let renderedState=null;

  function renderLiveNow(creatorRow,scheduleRow){
    if(renderedState==='live_now')return;
    renderedState='live_now';
    document.body.className='live';
    const name=(creatorRow&&typeof creatorRow.nome==='string'&&creatorRow.nome)?creatorRow.nome:('@'+rawHandle);
    stage.innerHTML=
      '<div class=pulse aria-hidden=true></div>'+
      '<div class=live-title>AO VIVO AGORA</div>'+
      '<div class=creator-handle>'+esc(name)+'</div>'+
      '<div class=live-sub>levando você pro TikTok…</div>'+
      '<div class=redirect-bar aria-hidden=true></div>';
  }

  function renderBetween(creatorRow,nextLive,replayUrl){
    renderedState='between_lives';
    document.body.className='between';
    const name=(creatorRow&&typeof creatorRow.nome==='string'&&creatorRow.nome)?creatorRow.nome:('@'+rawHandle);
    const whenStr=nextLive?formatNextLive(nextLive.scheduled_start):'em breve';
    const safeReplay=(typeof replayUrl==='string'&&/^https:\/\/(www\.|m\.|vm\.|vt\.)?tiktok\.com\//.test(replayUrl))?replayUrl:null;
    stage.innerHTML=
      '<div class=b-eyebrow>RHODE LIVE · VITRINE SP</div>'+
      '<div class=b-title>'+esc(name)+' volta pra live</div>'+
      '<div class=b-when>'+esc(whenStr)+'</div>'+
      '<div class=b-coupon-top>cupom · <b>'+esc(coupon)+'</b> · 10% off</div>'+
      '<form class=b-form id=optin novalidate autocomplete=off>'+
        '<input class=hp type=text name=website tabindex=-1 autocomplete=off aria-hidden=true>'+
        '<input class=b-input id=wpp type=tel inputmode=numeric placeholder="WhatsApp (11) 91234-5678" maxlength=16 required aria-label="WhatsApp com DDD">'+
        '<div class=b-error id=err></div>'+
        '<button class=b-btn type=submit id=btn>quero ser avisada</button>'+
        '<div class=b-consent>ao enviar você concorda em receber 1 mensagem por live e nada mais. <a href="/privacidade-vitrine" target=_blank rel=noopener>política</a></div>'+
      '</form>'+
      '<div class=b-meta>'+
        (safeReplay?'<a href="'+escAttr(safeReplay)+'" id=replay target=_blank rel=noopener>ver replay da última live <span aria-hidden=true>→</span></a>':'')+
        '<a href="https://www.tiktok.com/@'+escAttr(rawHandle)+'" id=perfil target=_blank rel=noopener>perfil TikTok da '+esc(name.replace('@',''))+' <span aria-hidden=true>→</span></a>'+
      '</div>';
    // mask + validate
    const inp=document.getElementById('wpp');
    const errEl=document.getElementById('err');
    function maskBR(v){
      const d=v.replace(/\D/g,'').slice(0,11);
      if(d.length<=2)return d;
      if(d.length<=7)return '('+d.slice(0,2)+') '+d.slice(2);
      return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);
    }
    const DDD_VALIDOS=/^(1[1-9]|2[12478]|3[1-578]|4[1-9]|5[13-5]|6[1-9]|7[13-9]|8[1-9]|9[1-9])/;
    function validate(d){
      if(d.length<10)return 'falta o DDD ou número completo';
      if(d.length>11)return 'número muito longo';
      if(!DDD_VALIDOS.test(d))return 'DDD inválido';
      if(d.length===11&&d[2]!=='9')return 'celular começa com 9';
      return null;
    }
    inp.addEventListener('input',e=>{
      e.target.value=maskBR(e.target.value);
      const d=e.target.value.replace(/\D/g,'');
      const err=d.length>=10?validate(d):null;
      if(d.length>=10){
        if(err){inp.classList.remove('valid');inp.classList.add('invalid');errEl.textContent=err}
        else{inp.classList.add('valid');inp.classList.remove('invalid');errEl.textContent=''}
      }else{inp.classList.remove('valid','invalid');errEl.textContent=''}
    });
    document.getElementById('optin').addEventListener('submit',e=>{
      e.preventDefault();
      const honeypot=e.target.elements.website.value;
      if(honeypot)return; // bot
      const d=inp.value.replace(/\D/g,'');
      const err=validate(d);
      if(err){errEl.textContent=err;inp.classList.add('invalid');return}
      const phone=d.startsWith('55')?d:('55'+d);
      submitOptin(phone,nextLive);
    });
    if(safeReplay){document.getElementById('replay').addEventListener('click',()=>track('action',{tipo:'replay_click'}))}
    document.getElementById('perfil').addEventListener('click',()=>track('action',{tipo:'perfil_click'}));
    track('optin_shown',{});
  }

  function renderEmpty(creatorRow){
    renderedState='no_schedule';
    document.body.className='empty';
    const name=(creatorRow&&typeof creatorRow.nome==='string'&&creatorRow.nome)?creatorRow.nome:('@'+rawHandle);
    stage.innerHTML=
      '<div class=b-eyebrow>RHODE · VITRINE SP</div>'+
      '<div class=b-title>'+esc(name)+' ainda não agendou a próxima live</div>'+
      '<div class=b-when>siga pra saber em primeira mão</div>'+
      '<div class=b-coupon-top>cupom · <b>'+esc(coupon)+'</b> · 10% off</div>'+
      '<div class=b-meta>'+
        '<a href="https://www.tiktok.com/@'+escAttr(rawHandle)+'" target=_blank rel=noopener>seguir no TikTok <span aria-hidden=true>→</span></a>'+
      '</div>';
  }

  // ── SUBMIT OPT-IN ──
  async function submitOptin(phone,nextLive){
    const btn=document.getElementById('btn');
    const errEl=document.getElementById('err');
    btn.disabled=true;btn.textContent='salvando…';
    track('optin_submitted',{phone_hash:phone.slice(-4),next_start:nextLive&&nextLive.scheduled_start});
    const ctrl=new AbortController();
    const t=setTimeout(()=>ctrl.abort(),8000);
    try{
      // INSERT via PostgREST com on_conflict declarado (UPSERT correto)
      const r=await fetch(SB_URL+'/rest/v1/vitrine_optins?on_conflict=creator_handle,phone',{
        method:'POST',
        headers:Object.assign({},SBH,{'Prefer':'return=minimal,resolution=merge-duplicates'}),
        body:JSON.stringify({creator_handle:handleUpper,phone,session_id:sid,next_live_id:nextLive?nextLive.id:null,coupon,meta:{ua_short:UA.slice(0,80),scan_source:scanSrc}}),
        signal:ctrl.signal
      });
      clearTimeout(t);
      if(!r.ok){throw new Error('save_failed_'+r.status)}
      // fire-and-forget Z-API
      fetch('/api/get-hub',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'live_optin',phone,creator:handleUpper,session_id:sid})}).catch(()=>{});
      btn.parentElement.innerHTML='<div class=b-thanks>pronto. te avisamos no WhatsApp ✓<br><small style=opacity:.7>cupom <b>'+esc(coupon)+'</b> vale agora.</small></div>';
    }catch(e){
      clearTimeout(t);
      btn.disabled=false;btn.textContent='tentar de novo';
      errEl.textContent='sem internet ou erro temporário. tenta de novo.';
    }
  }

  // ── BOOT: REDIRECT OTIMISTA ──
  // Caminho crítico LIVE_NOW: agenda redirect AGORA com URL padrão.
  // Em paralelo, queries refinam. Se chegarem com BETWEEN/EMPTY ANTES dos 800ms, cancela.
  let redirectTimer=null;
  let redirectedAlready=false;
  function scheduleRedirect(url){
    if(redirectedAlready)return;
    if(redirectTimer)clearTimeout(redirectTimer);
    redirectTimer=setTimeout(()=>{
      redirectedAlready=true;
      try{location.replace(url)}catch(e){location.href=url}
    },REDIRECT_MS);
  }
  function cancelRedirect(){if(redirectTimer){clearTimeout(redirectTimer);redirectTimer=null}}

  async function safeFetch(url){
    try{
      const r=await fetch(url,{headers:SBH});
      if(!r.ok)return {err:'http_'+r.status};
      const data=await r.json();
      return {data:Array.isArray(data)?data:[]};
    }catch(e){return {err:'network'}}
  }

  async function boot(){
    // PATH inválido → tela genérica, sem redirect
    if(!validHandle){
      renderEmpty(null);
      if(!alreadyScanned){track('qr_scanned',{state:'no_schedule',invalid_handle:true});try{sessionStorage.setItem(SCAN_KEY,String(Date.now()))}catch(e){}}
      return;
    }

    // Render OTIMISTA: assume LIVE_NOW imediatamente + agenda redirect.
    // Se queries provarem o contrário em <800ms, cancela.
    const fallbackUrl=buildTiktokUrl(null,null);
    renderLiveNow(null,null);
    scheduleRedirect(fallbackUrl);

    // Queries em paralelo, com timeout duro de QUERY_BUDGET_MS
    const nowIso=new Date().toISOString();
    const creatorP=safeFetch(SB_URL+'/rest/v1/affiliates?or=(tiktok_handle.ilike.'+encodeURIComponent(rawHandle)+',affiliate_id.ilike.'+encodeURIComponent(handleUpper)+')&select=affiliate_id,tiktok_handle,nome&limit=1');
    const schedP=safeFetch(SB_URL+'/rest/v1/live_schedule?creator_handle=eq.'+encodeURIComponent(handleUpper)+'&scheduled_end=gte.'+encodeURIComponent(nowIso)+'&status=in.(scheduled,live)&order=scheduled_start.asc&limit=1');
    const replayP=safeFetch(SB_URL+'/rest/v1/live_schedule?creator_handle=eq.'+encodeURIComponent(handleUpper)+'&status=eq.ended&replay_url=not.is.null&order=scheduled_start.desc&limit=1');
    const timeoutP=new Promise(res=>setTimeout(()=>res('timeout'),QUERY_BUDGET_MS));

    const results=await Promise.race([Promise.all([creatorP,schedP,replayP]),timeoutP]);
    if(results==='timeout'){
      // mantém redirect otimista — pessoa vai pra @handle/live
      if(!alreadyScanned){track('qr_scanned',{state:'live_now',via:'optimistic_timeout'});try{sessionStorage.setItem(SCAN_KEY,String(Date.now()))}catch(e){}}
      track('tiktok_redirected',{url:fallbackUrl,via:'optimistic_timeout'});
      return;
    }
    const [cR,sR,rR]=results;
    const creator=(cR.data&&cR.data[0])||null;
    const nextLive=(sR.data&&sR.data[0])||null;
    const replayRow=(rR.data&&rR.data[0])||null;
    const replayUrl=(replayRow&&replayRow.replay_url)||null;

    // debug overrides
    if(forceState==='live'){cancelRedirect();renderedState=null;renderLiveNow(creator,nextLive);scheduleRedirect(buildTiktokUrl(creator,nextLive));return}
    if(forceState==='between'){cancelRedirect();renderedState=null;renderBetween(creator,nextLive||{scheduled_start:new Date(Date.now()+3600000).toISOString(),id:'debug'},replayUrl);return}
    if(forceState==='empty'){cancelRedirect();renderedState=null;renderEmpty(creator);return}

    // DECISÃO REAL com tolerância + status como verdade primária
    const now=Date.now();
    let isLiveNow=false;
    let finalState='no_schedule';
    if(nextLive){
      const start=new Date(nextLive.scheduled_start).getTime();
      const end=new Date(nextLive.scheduled_end).getTime();
      const inGraceWindow=(now>=start-GRACE_BEFORE_MS)&&(now<=end+GRACE_AFTER_MS);
      // Critério: status='live' SEMPRE ganha; status='scheduled' precisa de janela de tolerância
      if(nextLive.status==='live')isLiveNow=true;
      else if(nextLive.status==='scheduled'&&inGraceWindow&&now>=start)isLiveNow=true; // só após start (não antecipa)
      finalState=isLiveNow?'live_now':'between_lives';
    }

    if(isLiveNow){
      // refina URL e mantém redirect
      const refinedUrl=buildTiktokUrl(creator,nextLive);
      // re-render com nome real (se mudou)
      if(creator&&creator.nome){renderedState=null;renderLiveNow(creator,nextLive)}
      cancelRedirect();
      scheduleRedirect(refinedUrl);
      if(!alreadyScanned){track('qr_scanned',{state:'live_now'});try{sessionStorage.setItem(SCAN_KEY,String(Date.now()))}catch(e){}}
      track('tiktok_redirected',{url:refinedUrl});
      return;
    }
    // não está ao vivo → cancela redirect, re-renderiza
    cancelRedirect();
    renderedState=null;
    if(nextLive){renderBetween(creator,nextLive,replayUrl);if(!alreadyScanned){track('qr_scanned',{state:'between_lives',next_start:nextLive.scheduled_start});try{sessionStorage.setItem(SCAN_KEY,String(Date.now()))}catch(e){}}}
    else{renderEmpty(creator);if(!alreadyScanned){track('qr_scanned',{state:'no_schedule'});try{sessionStorage.setItem(SCAN_KEY,String(Date.now()))}catch(e){}}}
  }

  boot();
})();
</script>

</html>
