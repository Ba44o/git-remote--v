<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=DM+Sans:wght@400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 400px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(1200px 500px at 50% 40%, #141414 0%, #0A0A0A 70%);
    font-family: 'Montserrat', 'Arial Black', 'Helvetica Neue', sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .orbit { position: absolute; inset: 0; width: 1600px; height: 400px; }
  .content {
    position: relative; z-index: 3;
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  .selo {
    display: inline-flex; align-items: center; gap: 10px;
    background: #F2D413; color: #0A0A0A;
    font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 700; font-size: 20px; letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 9px 20px; border-radius: 999px;
  }
  .selo .dot { width: 9px; height: 9px; border-radius: 50%; background: #0A0A0A; }
  .wordmark {
    font-family: 'Montserrat', 'Arial Black', 'Helvetica Neue', sans-serif;
    font-weight: 800; font-size: 122px; line-height: 0.9;
    color: #FFFFFF; letter-spacing: 0.14em; text-indent: 0.14em;
    text-shadow: 0 6px 40px rgba(0,0,0,0.55);
  }
  .subtitle {
    font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 500; font-size: 40px; letter-spacing: 0.06em;
    color: #EDEDED;
  }
  .subtitle b { color: #F2D413; font-weight: 700; }
</style>
</head>
<body>
  <svg class="orbit" viewBox="0 0 1600 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <g transform="rotate(-11 800 200)">
      <ellipse cx="800" cy="200" rx="735" ry="150"
               fill="none" stroke="#F2D413" stroke-opacity="0.55"
               stroke-width="2.5" stroke-dasharray="9 13" stroke-linecap="round"/>
    </g>
    <!-- planeta na órbita -->
    <circle cx="1487" cy="286" r="12" fill="#F2D413"/>
    <circle cx="1487" cy="286" r="26" fill="#F2D413" fill-opacity="0.18"/>
    <circle cx="128" cy="112" r="6" fill="#F2D413" fill-opacity="0.85"/>
  </svg>

  <div class="content">
    <span class="selo"><span class="dot"></span>Dia do Amigo · missão até 22/07</span>
    <div class="wordmark">RHODELOVERS</div>
    <div class="subtitle"><b>Missão</b> das Madrinhas</div>
  </div>
</body>
</html>
