name: Rhode — Relatório automático de live

# Procura lives que terminaram há 45+ minutos e ainda não têm relatório, gera no template
# travado (8 abas) e publica na pasta do Drive "Relatorios de Live". Estado = a própria
# pasta (room_id em appProperties).
#
# ⚠️ POR QUE O JOB FICA HORAS RODANDO EM LOOP, em vez de um cron de 15 min:
# o GitHub ESTRANGULA workflows agendados. Medido neste repo em 11/09: o workflow de flash
# sales pede "*/30" e é executado a cada 2–5 HORAS. Um cron de 15 min aqui simplesmente não
# entrega — a promessa de "45 min após a live" morre. Então o job roda um laço próprio de
# ~5h30 (teto de 6h do runner), checando a cada 15 min de verdade, e no fim dispara a si
# mesmo. O `schedule` abaixo fica só como rede: se a corrente quebrar, ele religa.
# Repositório público = minutos de Actions gratuitos, então o laço não custa nada.
on:
  schedule:
    - cron: "17 */3 * * *"    # rede de segurança: religa a corrente se ela parar
  workflow_dispatch:
    inputs:
      room:
        description: "room_id específico (deixe vazio para o ciclo normal)"
        required: false
      espera:
        description: "minutos de espera após o fim da live"
        required: false
        default: "45"
      dry_run:
        description: "true = só mostra o que faria"
        required: false
        default: "false"

concurrency:
  group: rhode-relatorio-live
  cancel-in-progress: false

permissions:
  actions: write        # para o job disparar o próximo elo da corrente
  contents: read

jobs:
  relatorio:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # 5h50 — abaixo do teto de 6h do runner
    env:
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TIKTOK_APP_KEY:       ${{ secrets.TIKTOK_APP_KEY }}
      TIKTOK_APP_SECRET:    ${{ secrets.TIKTOK_APP_SECRET }}
      TIKTOK_SHOP_CIPHER:   ${{ secrets.TIKTOK_SHOP_CIPHER }}
      GOOGLE_OAUTH_TOKEN:   ${{ secrets.GOOGLE_OAUTH_TOKEN }}
      DRIVE_FOLDER_ID:      ${{ vars.DRIVE_FOLDER_ID || '1tWpDpY6gpOijpEkw_EpWmylohL8BpRix' }}
      EMAIL_AVISO:          ${{ vars.EMAIL_AVISO || 'humbertobasso9@gmail.com' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install requests pandas openpyxl python-dotenv google-api-python-client google-auth

      - name: Credenciais da service account
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          echo "${GCP_CREDENTIALS}" > credentials.json
          chmod 600 credentials.json

      - name: Conferir que o OAuth está configurado
        run: |
          if [ -z "${GOOGLE_OAUTH_TOKEN}" ]; then
            echo "::error::Falta o secret GOOGLE_OAUTH_TOKEN. A service account tem quota ZERO de Drive e não cria planilha."
            echo "::error::Rode automacao/oauth_setup.py localmente e cadastre o secret."
            exit 1
          fi
          echo "OAuth presente."

      - name: Rodar o monitor
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.room }}" ]; then
            ARGS="$ARGS --room ${{ github.event.inputs.room }}"
          fi
          if [ -n "${{ github.event.inputs.espera }}" ]; then
            ARGS="$ARGS --espera ${{ github.event.inputs.espera }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          # Um room específico é pedido pontual: roda uma vez e sai.
          if [ -n "${{ github.event.inputs.room }}" ]; then
            echo "modo pontual · args:$ARGS"
            python3 automacao/monitor_lives.py $ARGS
            exit 0
          fi

          # Laço: checa a cada 15 min por ~5h30. É isto que entrega a granularidade
          # que o cron do GitHub não entrega.
          FIM=$(( $(date +%s) + 19800 ))     # 5h30
          N=0
          while [ "$(date +%s)" -lt "$FIM" ]; do
            N=$((N+1))
            echo "───── ciclo $N · $(TZ=America/Sao_Paulo date '+%H:%M BRT') ─────"
            python3 automacao/monitor_lives.py $ARGS || echo "⚠ ciclo falhou, seguindo"
            sleep 900
          done
          echo "laço encerrado após $N ciclos"

      - name: Passar o bastão para o próximo run
        # Sempre — inclusive se o monitor falhar — senão a corrente morre em silêncio.
        if: always() && github.event.inputs.room == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run relatorio-live.yml --repo "${{ github.repository }}" \
            && echo "✓ próximo elo disparado" \
            || echo "::warning::não consegui disparar o próximo elo — o cron de 3h religa"

      - name: Limpar credenciais
        if: always()
        run: rm -f credentials.json
