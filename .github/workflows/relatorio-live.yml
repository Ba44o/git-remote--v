name: Rhode — Relatórios automáticos (live + loja + semanal head)

# Procura lives que terminaram há 45+ minutos e ainda não têm relatório, gera no template
# travado (8 abas) e publica na pasta do Drive "Relatorios de Live". Estado = a própria
# pasta (room_id em appProperties).
#
# Disparo curto, só no horário de live: uma checagem a cada 20 min entre 08h e 00h BRT.
# Até 02/10/2026 o job rodava um laço de 5h30 que disparava a si mesmo (~67 mil min/mês de
# Actions). Isso só era viável com o repositório público; no privado o grátis é 2.000 min.
# O GitHub atrasa crons agendados, então o relatório pode sair mais tarde que 45 min após a
# live — troca aceita para o repositório poder ser privado.
on:
  schedule:
    - cron: "*/20 11-23 * * *"   # 08:00–20:59 BRT
    - cron: "*/20 0-2 * * *"     # 21:00–23:59 BRT
  workflow_dispatch:
    inputs:
      room:
        description: "room_id específico (deixe vazio para o ciclo normal)"
        required: false
      data_loja:
        description: "AAAA-MM-DD para forçar o relatório da loja de um dia"
        required: false
      semana_head:
        description: "segunda-feira AAAA-MM-DD para forçar o relatório semanal head"
        required: false
      espera:
        description: "minutos de espera após o fim da live"
        required: false
        default: "45"
      dry_run:
        description: "true = só mostra o que faria"
        required: false
        default: "false"

concurrency:
  group: rhode-relatorio-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  relatorio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TIKTOK_APP_KEY:       ${{ secrets.TIKTOK_APP_KEY }}
      TIKTOK_APP_SECRET:    ${{ secrets.TIKTOK_APP_SECRET }}
      TIKTOK_SHOP_CIPHER:   ${{ secrets.TIKTOK_SHOP_CIPHER }}
      GOOGLE_OAUTH_TOKEN:   ${{ secrets.GOOGLE_OAUTH_TOKEN }}
      DRIVE_FOLDER_ID:      ${{ vars.DRIVE_FOLDER_ID || '1tWpDpY6gpOijpEkw_EpWmylohL8BpRix' }}
      DRIVE_FOLDER_LOJA:    ${{ vars.DRIVE_FOLDER_LOJA || '1ubpK3GZLdLUbzfnJrafyW63p9NdadR4a' }}
      DRIVE_FOLDER_HEAD:    ${{ vars.DRIVE_FOLDER_HEAD || '1lT2xshXVJBaS3WlGJIwCEDAMJ06a7fmC' }}
      EMAIL_AVISO:          ${{ vars.EMAIL_AVISO || 'humbertobasso9@gmail.com' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install requests pandas numpy xlrd openpyxl python-dotenv google-api-python-client google-auth
          # pandas é exigido por coletar_dados.py — sem ele os coletores morrem calados

      - name: Credenciais da service account
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          echo "${GCP_CREDENTIALS}" > credentials.json
          chmod 600 credentials.json

      - name: Conferir que o OAuth está configurado
        run: |
          if [ -z "${GOOGLE_OAUTH_TOKEN}" ]; then
            echo "::error::Falta o secret GOOGLE_OAUTH_TOKEN. A service account tem quota ZERO de Drive e não cria planilha."
            echo "::error::Rode automacao/oauth_setup.py localmente e cadastre o secret."
            exit 1
          fi
          echo "OAuth presente."

      - name: Rodar o monitor
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.room }}" ]; then
            ARGS="$ARGS --room ${{ github.event.inputs.room }}"
          fi
          if [ -n "${{ github.event.inputs.espera }}" ]; then
            ARGS="$ARGS --espera ${{ github.event.inputs.espera }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          # Um room específico é pedido pontual: roda uma vez e sai.
          if [ -n "${{ github.event.inputs.room }}" ]; then
            echo "modo pontual · args:$ARGS"
            python3 automacao/monitor_lives.py $ARGS
            exit 0
          fi
          if [ -n "${{ github.event.inputs.semana_head }}" ]; then
            echo "modo pontual (semanal head) · ${{ github.event.inputs.semana_head }}"
            python3 automacao/monitor_semanal.py --forcar-semana "${{ github.event.inputs.semana_head }}"
            exit 0
          fi
          if [ -n "${{ github.event.inputs.data_loja }}" ]; then
            echo "modo pontual (loja) · ${{ github.event.inputs.data_loja }}"
            python3 automacao/monitor_loja.py --data "${{ github.event.inputs.data_loja }}"
            exit 0
          fi

          # Uma passada. Falha em qualquer monitor deixa o job VERMELHO no fim — antes o
          # "|| echo seguindo" escondia o erro e um token do Google expirado passou dias sem alarme.
          FALHAS=""
          python3 automacao/monitor_lives.py $ARGS || FALHAS="$FALHAS lives"
          # Relatório diário da loja: idempotente (checa a pasta do Drive antes) — sai uma vez por dia.
          python3 automacao/monitor_loja.py || FALHAS="$FALHAS loja"
          # Semanal head (terça 08:00) + check de sexta (08:00). Idempotente pelo estado no Drive.
          python3 automacao/monitor_semanal.py || FALHAS="$FALHAS semanal"
          if [ -n "$FALHAS" ]; then
            echo "::error::monitor(es) com falha:$FALHAS"
            exit 1
          fi

      - name: Limpar credenciais
        if: always()
        run: rm -f credentials.json
